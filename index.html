<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F3F2EE; --text:#181917; --text-dim:#8B8A83;
  --accent:#2E4A34; --accent-soft:#E7ECE4; --protein:#9C6B32; --protein-soft:#F2E9DA;
  --danger:#AE4B3E; --danger-soft:#F5E7E4; --line:#E5E3DC; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:82px; min-height:100vh;}
h1,h2,h3{font-family:'Fraunces',serif; font-weight:500; margin:0; letter-spacing:-0.01em;}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums;}
.wrap{max-width:560px; margin:0 auto; padding:0 18px;}
a{color:inherit;}
svg{width:1em; height:1em; display:block; flex-shrink:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* header */
.topbar{padding:22px 0 14px;}
.topbar .date{color:var(--text-dim); font-size:13px; margin-bottom:2px;}
.topbar h1{font-size:26px;}

/* dashboard */
.metric-row{display:flex; gap:12px; margin:18px 0;}
.metric{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:16px 16px 14px;}
.metric .label{color:var(--text-dim); font-size:12px; text-transform:none; margin-bottom:8px;}
.metric .value{font-size:22px; font-weight:600;}
.metric .value .sub{font-size:13px; color:var(--text-dim); font-weight:400;}
.bar-track{height:5px; background:var(--surface2); border-radius:3px; margin-top:10px; overflow:hidden; position:relative;}
.bar-fill{height:100%; border-radius:3px; transition:width .3s ease;}
.bar-fill.kcal{background:var(--accent);}
.bar-fill.prot{background:var(--protein);}
.bar-fill.over{background:var(--danger);}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px;}
.section-title h2{font-size:16px; font-weight:500;}
.section-title .hint{font-size:12px; color:var(--text-dim);}

.weekbars{display:flex; gap:6px; align-items:flex-end; height:64px; margin:8px 0 4px;}
.weekbars .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%;}
.weekbars .stick{width:100%; max-width:22px; border-radius:2px 2px 1px 1px; background:var(--surface2); position:relative;}
.weekbars .stick .fill{position:absolute; bottom:0; left:0; right:0; border-radius:2px 2px 1px 1px; background:var(--accent);}
.weekbars .day{font-size:10px; color:var(--text-dim);}

.entry{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);}
.entry:last-child{border-bottom:none;}
.entry .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.entry .dot.recipe{background:var(--accent);}
.entry .dot.ingredient{background:var(--protein);}
.entry .dot.supplement{background:#7C6A93;}
.entry .dot.custom{background:var(--text-dim);}
.entry .info{flex:1; min-width:0;}
.entry .info .name{font-size:14.5px; font-weight:500;}
.entry .info .qty{font-size:12px; color:var(--text-dim); margin-top:1px;}
.entry .macros{text-align:right; font-size:12.5px; color:var(--text-dim); flex-shrink:0;}
.entry .macros .kc{color:var(--text); font-weight:600;}
.entry .del{color:var(--text-dim); background:none; border:none; padding:4px 0 4px 10px; font-size:18px; line-height:1;}
.empty{color:var(--text-dim); font-size:13.5px; padding:20px 0; text-align:center;}

.fab-row{display:flex; gap:10px; margin-top:14px;}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:2px; padding:13px 16px; font-size:14.5px; font-weight:500; text-align:center; flex:1;}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
.btn.ghost{background:none; border-color:transparent;}
.btn.danger{color:var(--danger); border-color:var(--line);}
.btn.small{padding:9px 12px; font-size:13px; flex:none;}
.btn.full{width:100%;}

/* tab bar */
.tabbar{position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.94); backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
.tabbar button{flex:1; background:none; border:none; color:var(--text-dim); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0;}
.tabbar button.active{color:var(--accent);}
.tabbar svg{width:21px; height:21px;}

/* recipe library */
.searchbar{display:flex; gap:8px; margin:16px 0 6px;}
.searchbar input{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:11px 14px; color:var(--text); font-size:14.5px;}
.searchbar input::placeholder{color:var(--text-dim);}
.chiprow{display:flex; gap:7px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; background:none; border:1px solid var(--line); color:var(--text-dim); padding:7px 13px; border-radius:100px; font-size:13px; white-space:nowrap;}
.chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

.recipe-card{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); gap:10px;}
.recipe-card .name{font-size:15px; font-weight:500;}
.recipe-card .tag{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
.recipe-card .m{text-align:right; font-size:12px; color:var(--text-dim); flex-shrink:0;}
.recipe-card .m .kc{font-size:14.5px; color:var(--accent); font-weight:600; display:block;}

/* detail / editor sheets */
.sheet-header{display:flex; align-items:center; justify-content:space-between; padding:18px 0 6px;}
.sheet-header .back{color:var(--text-dim); font-size:14px; background:none; border:none; padding:6px 0;}
.field{margin:16px 0;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px;}
.field input, .field select{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:12px 14px; color:var(--text); font-size:15px;}
.ing-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.ing-row .n{flex:1; font-size:14.5px;}
.ing-row .g{width:64px; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:8px 8px; color:var(--text); font-size:14px; text-align:center;}
.ing-row .u{font-size:12px; color:var(--text-dim); width:16px;}
.ing-row .rm{color:var(--text-dim); background:none; border:none; font-size:17px; padding:4px 2px;}
.macro-preview{display:flex; gap:10px; background:var(--surface2); border-radius:2px; padding:16px; margin:14px 0;}
.macro-preview .m{flex:1; text-align:center;}
.macro-preview .m .v{font-size:17px; font-weight:600;}
.macro-preview .m .l{font-size:10.5px; color:var(--text-dim); margin-top:2px;}
.autocomplete{position:relative;}
.ac-list{position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:2px; max-height:230px; overflow-y:auto; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.06);}
.ac-item{padding:11px 14px; font-size:14px; border-bottom:1px solid var(--line);}
.ac-item:last-child{border-bottom:none;}
.ac-item .k{color:var(--text-dim); font-size:11.5px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(20,20,18,.4); z-index:40; display:flex; align-items:flex-end;}
.modal{background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:4px 18px 24px; border-top:1px solid var(--line);}
.modal-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:10px auto 4px;}

.settings-row{display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid var(--line);}
.settings-row .l{font-size:14.5px;}
.settings-row .l .s{display:block; font-size:12px; color:var(--text-dim); margin-top:2px;}
.settings-row input[type=number]{width:84px; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:9px 10px; color:var(--text); text-align:right; font-size:15px;}

.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:32px; height:32px; border-radius:50%; background:var(--surface2); border:1px solid var(--line); color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center;}
.stepper .v{min-width:44px; text-align:center; font-size:15px; font-weight:600;}

.toast{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:11px 18px; border-radius:100px; font-size:13.5px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.time-badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--text-dim);}
.time-badge svg{width:12px; height:12px;}
.person-pills{display:flex; gap:8px; margin:10px 0;}
.person-pill{flex:1; border:1px solid var(--line); border-radius:100px; padding:9px 10px; text-align:center; font-size:13.5px; color:var(--text-dim); background:none;}
.person-pill.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}
.person-switch{display:flex; gap:6px; margin-bottom:4px;}
.person-switch button{flex:1; padding:8px 10px; border-radius:100px; border:1px solid var(--line); background:none; color:var(--text-dim); font-size:13px;}
.person-switch button.active{background:var(--text); color:#fff; border-color:var(--text);}
.roulette-wheel{text-align:center; padding:30px 10px; font-family:'Fraunces',serif; font-size:22px; min-height:100px; display:flex; align-items:center; justify-content:center;}
</style>
</head>

{id:'r-omelette-fromage', n:'Omelette 3 œufs, fromage', cat:'petit-dej', ing:[{id:'oeuf',g:165},{id:'emmental',g:25}], steps:'1. Battre les œufs \u00e0 la fourchette avec une pinc\u00e9e de sel et de poivre, jusqu\u2019\u00e0 ce que le m\u00e9lange soit homog\u00e8ne (pas besoin de mousser).\n2. Chauffer une po\u00eale antiadh\u00e9sive \u00e0 feu moyen avec un peu d\u2019huile ou de beurre \u2014 elle est pr\u00eate quand une goutte d\u2019œuf grésille imm\u00e9diatement.\n3. Verser les œufs, laisser prendre 10-15 sec sans toucher, puis ramener les bords cuits vers le centre \u00e0 la spatule pendant que l\u2019œuf liquide coule sur les zones vides.\n4. D\u00e8s que le dessus est encore l\u00e9g\u00e8rement baveux (elle continue \u00e0 cuire hors du feu), ajouter le fromage r\u00e2p\u00e9 sur une moiti\u00e9.\n5. Replier l\u2019autre moiti\u00e9 par-dessus, laisser 10 sec pour faire fondre le fromage, puis glisser dans l\u2019assiette. Une omelette trop cuite devient caoutchouteuse \u2014 mieux vaut la retirer un peu tôt.', t:12},
{id:'r-oeufs-benedict', n:'Œufs B\u00e9n\u00e9dicte simplifi\u00e9s', cat:'petit-dej', ing:[{id:'pain-blanc',g:70},{id:'oeuf',g:110},{id:'jambonblanc',g:50},{id:'cremeepaisse',g:20}], steps:'1. Porter une casserole d\u2019eau \u00e0 fr\u00e9missement (pas \u00e0 gros bouillon) et ajouter une cuill\u00e8re \u00e0 soupe de vinaigre blanc \u2014 \u00e7a aide le blanc \u00e0 se resserrer autour du jaune.\n2. Casser chaque œuf dans une petite tasse (pas directement dans l\u2019eau, pour garder le contr\u00f4le).\n3. Cr\u00e9er un l\u00e9ger tourbillon dans l\u2019eau avec une cuill\u00e8re, y glisser l\u2019œuf doucement. Cuire 3 min pile pour un jaune coulant.\n4. Retirer \u00e0 l\u2019\u00e9cumoire, \u00e9goutter sur du papier absorbant.\n5. Griller le pain, monter avec le jambon puis l\u2019œuf poch\u00e9, napper d\u2019un peu de cr\u00e8me \u00e9paisse. Saler, poivrer.', t:12},
{id:'r-shakshuka', n:'Shakshuka (œufs, tomate, poivron)', cat:'dejeuner', ing:[{id:'oeuf',g:165},{id:'coulistomate',g:200},{id:'poivron',g:100},{id:'huile-olive',g:10}], steps:'1. Faire revenir le poivron coup\u00e9 en lani\u00e8res dans l\u2019huile 5 min \u00e0 feu moyen jusqu\u2019\u00e0 ce qu\u2019il s\u2019attendrisse.\n2. Ajouter le coulis de tomate, saler, poivrer, ajouter éventuellement du paprika ou du cumin. Mijoter 5-8 min \u00e0 d\u00e9couvert jusqu\u2019\u00e0 ce que la sauce \u00e9paississe l\u00e9g\u00e8rement.\n3. Creuser de petits puits dans la sauce avec le dos d\u2019une cuill\u00e8re, casser un œuf dans chaque puits.\n4. Couvrir et cuire 5-6 min \u00e0 feu doux \u2014 le blanc doit \u00eatre opaque et ferme, le jaune encore tremblotant au centre. Ne pas remuer pendant cette \u00e9tape.\n5. Servir directement dans la po\u00eale, avec du pain pour saucer.', t:30},
{id:'r-frittata-legumes', n:'Frittata légumes, fromage', cat:'dejeuner', ing:[{id:'oeuf',g:220},{id:'courgette',g:100},{id:'emmental',g:30}], steps:'1. Faire revenir la courgette en d\u00e9s dans une po\u00eale allant au four (ou adaptable) 3-4 min jusqu\u2019\u00e0 l\u00e9g\u00e8re coloration.\n2. Battre les œufs avec sel, poivre et le fromage r\u00e2p\u00e9, verser sur les courgettes.\n3. Baisser \u00e0 feu doux, couvrir, cuire 8-10 min sans toucher \u2014 les bords doivent \u00eatre pris et le centre encore l\u00e9g\u00e8rement tremblotant.\n4. Si le dessus reste trop liquide, passer 2-3 min sous le grill du four pour finir la cuisson plut\u00f4t que de prolonger \u00e0 la po\u00eale (\u00e7a br\u00fblerait le dessous).\n5. Laisser reposer 2 min hors du feu avant de d\u00e9couper \u2014 elle finit de se raffermir.', t:20},
{id:'r-oeufs-cocotte', n:'Œufs cocotte, tomate, crème légère', cat:'dejeuner', ing:[{id:'oeuf',g:110},{id:'coulistomate',g:100},{id:'cremelegere',g:30},{id:'pain-complet',g:50}], steps:'1. Pr\u00e9chauffer le four \u00e0 200\u00b0C avec un plat contenant 1-2 cm d\u2019eau chaude (bain-marie) pour une cuisson douce et r\u00e9guli\u00e8re.\n2. R\u00e9partir le coulis et la cr\u00e8me dans le fond des ramequins, saler, poivrer.\n3. Casser un œuf dans chaque ramequin sans percer le jaune.\n4. Enfourner les ramequins dans le bain-marie 10-12 min \u2014 le blanc doit \u00eatre opaque, le jaune encore mou. Surveiller d\u00e8s 9 min, \u00e7a continue \u00e0 cuire en sortant du four.\n5. Servir imm\u00e9diatement avec le pain grill\u00e9 en mouillettes.', t:30},
{id:'r-tortilla-espagnole', n:'Tortilla espagnole (pomme de terre, œuf)', cat:'dejeuner', ing:[{id:'oeuf',g:220},{id:'pdt-cuite',g:250},{id:'oignon',g:50},{id:'huile-olive',g:15}], steps:'1. Faire revenir l\u2019oignon \u00e9minc\u00e9 et les pommes de terre en tranches fines dans l\u2019huile \u00e0 feu doux 10 min, en remuant de temps en temps, jusqu\u2019\u00e0 ce qu\u2019elles soient fondantes (pas croustillantes).\n2. Battre les œufs \u00e0 part avec sel et poivre, ajouter les pommes de terre encore ti\u00e8des, m\u00e9langer.\n3. Reverser le tout dans la po\u00eale bien huil\u00e9e \u00e0 feu doux-moyen, cuire 6-8 min \u2014 les bords doivent \u00eatre pris, le centre encore un peu coulant.\n4. Le moment d\u00e9licat : poser une grande assiette sur la po\u00eale, retourner d\u2019un geste ferme et rapide, puis faire glisser la tortilla dans la po\u00eale pour cuire l\u2019autre face 3-4 min.\n5. Elle doit rester moelleuse au centre \u2014 une tortilla trop cuite devient sèche. Servir ti\u00e8de ou froide.', t:25},
{id:'r-omelette-espagnole-legere', n:'Omelette aux l\u00e9gumes', cat:'dejeuner', ing:[{id:'oeuf',g:220},{id:'poivron',g:80},{id:'courgette',g:80},{id:'huile-olive',g:8}], steps:'1. Faire revenir poivron et courgette en d\u00e9s dans l\u2019huile 5 min \u00e0 feu moyen jusqu\u2019\u00e0 tendret\u00e9.\n2. Battre les œufs avec sel et poivre, verser sur les l\u00e9gumes.\n3. Baisser \u00e0 feu doux, couvrir, cuire 6-8 min sans remuer jusqu\u2019\u00e0 ce que le centre soit juste pris.\n4. Servir directement, pli\u00e9e en deux ou en parts comme une tortilla.', t:15},
{id:'r-oeufs-cocotte-chevre', n:'Œufs cocotte au ch\u00e8vre', cat:'dejeuner', ing:[{id:'oeuf',g:110},{id:'chevre',g:50},{id:'cremelegere',g:30},{id:'pain-complet',g:50}], steps:'1. Pr\u00e9chauffer le four \u00e0 200\u00b0C, pr\u00e9parer un bain-marie (plat avec eau chaude) pour une cuisson douce.\n2. Verser la cr\u00e8me dans les ramequins, \u00e9mietter le ch\u00e8vre dessus, saler, poivrer.\n3. Casser un œuf dans chaque ramequin.\n4. Cuire 10-12 min au bain-marie \u2014 blanc opaque, jaune encore mou. Surveiller d\u00e8s 9 min.\n5. Servir avec le pain grill\u00e9.', t:18},
{id:'r-porridge-whey', n:'Porridge avoine, whey, banane', cat:'petit-dej', ing:[{id:'avoine',g:60},{id:'lait-demi',g:200},{id:'banane',g:60},{id:'whey-hsn',g:1}], steps:'1. Faire chauffer l\u2019avoine avec le lait 4-5 min \u00e0 feu doux en remuant jusqu\u2019\u00e0 absorption.\n2. Retirer du feu avant d\u2019incorporer la whey (\u00e0 chaud elle grumelle), ajouter la banane \u00e9cras\u00e9e ou coup\u00e9e.', t:7},
{id:'r-pancakes-proteines', n:'Pancakes protéinés (avoine, œuf, banane)', cat:'petit-dej', ing:[{id:'avoine',g:60},{id:'oeuf',g:110},{id:'banane',g:100}], steps:'1. Mixer tous les ingr\u00e9dients jusqu\u2019\u00e0 p\u00e2te lisse.\n2. Cuire par petites louches 2 min de chaque c\u00f4t\u00e9 \u00e0 feu moyen dans une po\u00eale légèrement huil\u00e9e, retourner d\u00e8s que des bulles apparaissent en surface.', t:12},
{id:'r-yaourt-fruits-miel', n:'Yaourt grec, fruits rouges, miel', cat:'petit-dej', ing:[{id:'yaourtgrec',g:200},{id:'fraises',g:100},{id:'miel',g:15}], steps:'1. Couper les fraises, mélanger avec le yaourt et filer de miel par-dessus.', t:7},
{id:'r-skyr-granola', n:'Skyr, granola, myrtilles', cat:'petit-dej', ing:[{id:'skyr',g:200},{id:'granola',g:40},{id:'myrtilles',g:60}], steps:'1. Verser le skyr dans un bol, parsemer de granola et de myrtilles juste avant de servir pour garder le croquant.', t:7},
{id:'r-oeufs-brouilles-avocat', n:'Œufs brouillés, pain complet, avocat', cat:'petit-dej', ing:[{id:'oeuf',g:150},{id:'pain-complet',g:60},{id:'avocat',g:60},{id:'beurre',g:5}], steps:'1. Battre les œufs, cuire \u00e0 feu doux dans le beurre en remuant sans arr\u00eater \u2014 retirer du feu quand encore l\u00e9g\u00e8rement baveux.\n2. Servir sur le pain grill\u00e9 avec l\u2019avocat \u00e9cras\u00e9.', t:12},
{id:'r-toast-avocat-oeuf', n:'Toast avocat, œuf poché', cat:'petit-dej', ing:[{id:'pain-complet',g:70},{id:'avocat',g:80},{id:'oeuf',g:55}], steps:'1. Porter l\u2019eau \u00e0 fr\u00e9missement avec un peu de vinaigre, cr\u00e9er un tourbillon et y glisser l\u2019œuf. Pocher 3 min pour un jaune coulant.\n2. Tartiner le pain grill\u00e9 d\u2019avocat \u00e9cras\u00e9 et d\u00e9poser l\u2019œuf dessus.', t:12},
{id:'r-smoothie-proteine', n:'Smoothie banane, whey, beurre de cacahuète', cat:'petit-dej', ing:[{id:'banane',g:120},{id:'lait-demi',g:250},{id:'beurrecacahuete',g:15}], steps:'1. Mixer tous les ingrédients ensemble jusqu’à texture lisse — une banane bien mûre donne un smoothie plus onctueux et sucré naturellement.', t:5},
{id:'r-bowl-fromageblanc', n:'Bowl fromage blanc, fruits rouges, amandes', cat:'petit-dej', ing:[{id:'fromageblanc0',g:200},{id:'fraises',g:80},{id:'amandes',g:15}], steps:'1. Verser le fromage blanc dans un bol, ajouter les fraises coupées et les amandes concassées juste avant de servir pour garder leur croquant.', t:7},
{id:'r-tartine-jambon-fromage', n:'Pain complet, jambon, fromage', cat:'petit-dej', ing:[{id:'pain-complet',g:80},{id:'jambonblanc',g:60},{id:'emmental',g:30}], steps:'1. Assembler simplement, ou passer 2 min sous le grill du four pour faire fondre le fromage et rendre le pain croustillant.', t:7},
{id:'r-porridge-choco', n:'Porridge cacao, lait, banane', cat:'petit-dej', ing:[{id:'avoine',g:60},{id:'lait-demi',g:200},{id:'cacao',g:10},{id:'banane',g:80}], steps:'1. Faire chauffer l’avoine, le lait et le cacao 4-5 min à feu doux en remuant.\n2. Servir avec la banane coupée par-dessus.', t:7},
{id:'r-oeufs-toast-simple', n:'2 œufs au plat, pain complet', cat:'petit-dej', ing:[{id:'oeuf',g:110},{id:'pain-complet',g:60},{id:'beurre',g:8}], steps:'1. Chauffer le beurre à feu moyen jusqu’à ce qu’il mousse, casser les œufs dedans.\n2. Cuire 2-3 min selon la cuisson souhaitée du jaune, à couvert pour un jaune coulant cuit uniformément.', t:12},
{id:'r-oeufs-saumonfume', n:'Œufs brouillés, saumon fumé, pain complet', cat:'petit-dej', ing:[{id:'oeuf',g:110},{id:'saumonfume',g:60},{id:'pain-complet',g:50}], steps:'1. Cuire les œufs brouillés à feu doux en remuant, retirer encore légèrement baveux.\n2. Servir avec le saumon fumé et le pain grillé à côté.', t:12},
{id:'r-overnight-oats', n:'Overnight oats (avoine, yaourt, fruits)', cat:'petit-dej', ing:[{id:'avoine',g:60},{id:'yaourtgrec',g:150},{id:'lait-demi',g:100},{id:'myrtilles',g:60}], steps:'1. Mélanger avoine, yaourt et lait dans un pot, couvrir.\n2. Laisser au frigo toute la nuit. Ajouter les fruits frais le matin seulement, pour qu’ils gardent leur texture.', t:8},
{id:'r-croque-proteine', n:'Croque-monsieur protéiné (dinde, fromage)', cat:'petit-dej', ing:[{id:'pain-mie-complet',g:70},{id:'jambondinde',g:60},{id:'emmental',g:30}], steps:'1. Assembler le sandwich (pain, jambon de dinde, fromage, pain).\n2. Cuire 3-4 min de chaque côté à la poêle ou au grille-pain jusqu’à ce que le fromage fonde et le pain soit doré.', t:12},
{id:'r-pain-perdu-proteine', n:'Pain perdu protéiné', cat:'petit-dej', ing:[{id:'pain-mie-complet',g:70},{id:'oeuf',g:110},{id:'lait-demi',g:60},{id:'miel',g:10}], steps:'1. Battre l\u2019œuf avec le lait dans une assiette creuse.\n2. Tremper chaque tranche de pain 10-15 sec de chaque c\u00f4t\u00e9 \u2014 assez pour qu\u2019elle s\u2019impr\u00e8gne, pas au point de se d\u00e9sint\u00e9grer.\n3. Chauffer une po\u00eale \u00e0 feu moyen avec un peu de beurre ou d\u2019huile.\n4. Cuire 2-3 min de chaque c\u00f4t\u00e9 jusqu\u2019\u00e0 ce que le dessus soit dor\u00e9 et l\u2019int\u00e9rieur juste pris (pas liquide). Baisser le feu si \u00e7a dore trop vite \u2014 l\u2019int\u00e9rieur doit avoir le temps de cuire.\n5. Napper de miel juste avant de servir.', t:12},
{id:'r-smoothiebowl', n:'Smoothie bowl yaourt, fruits, granola', cat:'petit-dej', ing:[{id:'yaourtgrec',g:180},{id:'banane',g:100},{id:'myrtilles',g:60},{id:'granola',g:30}], steps:'1. Mixer le yaourt avec la moitié de la banane et des myrtilles jusqu’à texture épaisse.\n2. Verser dans un bol, garnir avec le reste des fruits et le granola juste avant de servir pour qu’il reste croquant.', t:5},
{id:'r-wrap-petitdej', n:'Wrap œuf, fromage', cat:'petit-dej', ing:[{id:'tortilla',g:60},{id:'oeuf',g:110},{id:'emmental',g:25}], steps:'1. Cuire l’œuf brouillé à feu doux, encore légèrement baveux.\n2. Déposer avec le fromage sur la tortilla tiédie à la poêle sèche, rouler serré.', t:12},
{id:'r-fromagefrais-saumon', n:'Tartine fromage frais, saumon fumé', cat:'petit-dej', ing:[{id:'pain-complet',g:60},{id:'fromagefrais',g:40},{id:'saumonfume',g:50}], steps:'1. Tartiner le pain de fromage frais, déposer le saumon fumé par-dessus, poivrer.', t:7},
{id:'r-granola-maison', n:'Granola maison au four, yaourt', cat:'petit-dej', ing:[{id:'avoine',g:60},{id:'miel',g:15},{id:'amandes',g:15},{id:'yaourtgrec',g:150}], steps:'1. Mélanger avoine, miel et amandes, étaler en couche fine sur une plaque.\n2. Four 15-18 min à 160°C en remuant à mi-cuisson pour une coloration uniforme. Laisser refroidir complètement (il croustille en refroidissant) avant de servir sur le yaourt.', t:22},
{id:'r-chiapudding', n:'Chia pudding, fruits rouges', cat:'petit-dej', ing:[{id:'lait-demi',g:200},{id:'fraises',g:80},{id:'miel',g:10}], steps:'1. Mélanger le lait avec des graines de chia, bien remuer pour éviter les grumeaux, laisser reposer au frigo toute la nuit.\n2. Ajouter les fruits et le miel au moment de servir.', t:6},
{id:'r-bagel-saumon', n:'Bagel, saumon fum\u00e9, fromage frais', cat:'petit-dej', ing:[{id:'pain-blanc',g:90},{id:'saumonfume',g:60},{id:'fromagefrais',g:40}], steps:'1. Couper le bagel en deux, le toaster légèrement si aimé.\n2. Tartiner de fromage frais, garnir de saumon fumé.', t:5},
{id:'r-muffin-anglais-bacon', n:'Muffin anglais, œuf, bacon', cat:'petit-dej', ing:[{id:'pain-blanc',g:70},{id:'oeuf',g:55},{id:'lardons',g:40},{id:'emmental',g:20}], steps:'1. Faire dorer les lardons à sec jusqu’à croustillants.\n2. Cuire un œuf au plat, jaune encore coulant. Monter le muffin toasté avec lardons, œuf et fromage.', t:12},
{id:'r-porridge-pomme-cannelle', n:'Porridge pomme, cannelle', cat:'petit-dej', ing:[{id:'avoine',g:60},{id:'lait-demi',g:200},{id:'pomme',g:100},{id:'cannelle',g:2}], steps:'1. Faire chauffer l’avoine avec le lait 4-5 min à feu doux en remuant.\n2. Ajouter la pomme coupée en dés et la cannelle, laisser 1-2 min de plus pour que la pomme s’attendrisse légèrement.', t:10},
{id:'r-skyr-fruitssecs', n:'Skyr, fruits secs, miel', cat:'petit-dej', ing:[{id:'skyr',g:200},{id:'amandes',g:15},{id:'dattes',g:20},{id:'miel',g:10}], steps:'1. Mélanger le skyr avec les fruits secs coupés et le miel juste avant de servir pour garder leur croquant.', t:5},
{id:'r-tartine-ricotta-miel', n:'Tartine ricotta, miel', cat:'petit-dej', ing:[{id:'pain-complet',g:70},{id:'ricotta',g:80},{id:'miel',g:12}], steps:'1. Tartiner le pain grillé de ricotta, filer un peu de miel par-dessus.', t:5},
{id:'r-pain-perdu-classique', n:'Pain perdu classique', cat:'petit-dej', ing:[{id:'pain-blanc',g:80},{id:'oeuf',g:55},{id:'lait-demi',g:80},{id:'sucre',g:10},{id:'beurre',g:10}], steps:'1. Battre l\u2019œuf avec le lait et le sucre.\n2. Tremper le pain 10-15 sec de chaque c\u00f4t\u00e9 (du pain un peu rassis absorbe mieux sans se d\u00e9faire).\n3. Faire fondre le beurre dans une po\u00eale \u00e0 feu moyen jusqu\u2019\u00e0 ce qu\u2019il mousse l\u00e9g\u00e8rement.\n4. Cuire le pain 2-3 min de chaque c\u00f4t\u00e9 jusqu\u2019\u00e0 dor\u00e9. Baisser le feu si \u00e7a colore trop vite pour laisser l\u2019int\u00e9rieur cuire.\n5. Servir chaud, avec du sucre ou de la confiture si besoin.', t:12},
{id:'r-smoothie-vert', n:'Smoothie vert (\u00e9pinard, banane)', cat:'petit-dej', ing:[{id:'epinards',g:50},{id:'banane',g:120},{id:'lait-demi',g:200}], steps:'1. Mixer tous les ingrédients ensemble jusqu’à texture lisse — ajouter les épinards en dernier pour qu’ils se mélangent bien.', t:4},
{id:'r-blinis-saumon', n:'Blinis, saumon fum\u00e9, fromage frais', cat:'petit-dej', ing:[{id:'pain-blanc',g:60},{id:'saumonfume',g:50},{id:'fromagefrais',g:30}], steps:'1. Tartiner les blinis de fromage frais, garnir de saumon fumé.', t:5},
{id:'r-congee-poulet', n:'Congee au poulet (riz asiatique)', cat:'petit-dej', ing:[{id:'riz-blanc-cru',g:60},{id:'poulet-cuit',g:100},{id:'gingembre',g:5},{id:'saucesoja',g:10}], steps:'1. Cuire le riz dans beaucoup d’eau (5-6 fois son volume) 30-35 min à feu doux en remuant de temps en temps, jusqu’à texture crémeuse.\n2. Ajouter le poulet effiloché, le gingembre râpé et la sauce soja en fin de cuisson.', t:40},
{id:'r-porridge-quinoa', n:'Porridge de quinoa, fruits', cat:'petit-dej', ing:[{id:'quinoa-cuit',g:150},{id:'lait-demi',g:150},{id:'banane',g:80},{id:'miel',g:10}], steps:'1. Chauffer le quinoa cuit avec le lait 3-4 min à feu doux en remuant.\n2. Ajouter la banane et le miel.', t:10},
{id:'r-muesli-maison', n:'Muesli, lait', cat:'petit-dej', ing:[{id:'granola',g:60},{id:'lait-demi',g:180},{id:'pomme',g:80}], steps:'1. Mélanger le granola avec le lait et la pomme coupée en dés juste avant de servir pour garder le croquant.', t:5},
{id:'r-toast-avocat-feta', n:'Toast avocat, feta', cat:'petit-dej', ing:[{id:'pain-complet',g:70},{id:'avocat',g:80},{id:'feta',g:30}], steps:'1. Écraser l’avocat avec un peu de sel et de citron si dispo, étaler sur le pain grillé.\n2. Émietter la feta par-dessus.', t:6},
{id:'r-gaufres-proteinees', n:'Gaufres prot\u00e9in\u00e9es', cat:'petit-dej', ing:[{id:'avoine',g:50},{id:'oeuf',g:110},{id:'whey-hsn',g:1},{id:'lait-demi',g:60}], steps:'1. Mixer tous les ingr\u00e9dients ensemble jusqu\u2019\u00e0 p\u00e2te lisse (pas de grumeaux d\u2019avoine).\n2. Bien pr\u00e9chauffer le gaufrier \u00e0 vide avant de verser \u2014 une plaque pas assez chaude fait coller la gaufre.\n3. Huiler l\u00e9g\u00e8rement les plaques, verser la p\u00e2te sans d\u00e9border.\n4. Cuire 4-5 min sans ouvrir avant la fin du minutage indicatif \u2014 ouvrir trop t\u00f4t d\u00e9chire la gaufre encore molle.\n5. Elle est pr\u00eate quand elle se d\u00e9tache facilement et est dor\u00e9e. La laisser reposer 1 min sur une grille pour qu\u2019elle croustille.', t:12},
{id:'r-crepes-classiques', n:'Cr\u00eapes classiques', cat:'petit-dej', ing:[{id:'farine',g:60},{id:'oeuf',g:55},{id:'lait-demi',g:150},{id:'sucre',g:10}], steps:'1. Verser la farine dans un saladier, creuser un puits, casser l\u2019œuf dedans avec le sucre.\n2. Incorporer le lait petit \u00e0 petit en fouettant depuis le centre \u2014 verser tout d\u2019un coup cr\u00e9e des grumeaux.\n3. Fouetter jusqu\u2019\u00e0 p\u00e2te lisse et fluide (consistance d\u2019une cr\u00e8me liquide). Laisser reposer 15-20 min si possible, \u00e7a d\u00e9tend le gluten.\n4. Chauffer une po\u00eale l\u00e9g\u00e8rement huil\u00e9e \u00e0 feu moyen-vif, verser une petite louche en inclinant la po\u00eale pour r\u00e9partir fin.\n5. Cuire 1-2 min jusqu\u2019\u00e0 ce que les bords se d\u00e9collent et que le dessous soit dor\u00e9, retourner d\u2019un geste rapide (ou \u00e0 la spatule) et cuire 1 min de l\u2019autre c\u00f4t\u00e9.', t:15},
{id:'r-compote-fromageblanc-granola', n:'Fromage blanc, compote, granola', cat:'petit-dej', ing:[{id:'fromageblanc0',g:180},{id:'compote',g:100},{id:'granola',g:30}], steps:'1. Superposer fromage blanc et compote dans un bol, parsemer de granola juste avant de servir.', t:4},
{id:'r-petitdej-anglais', n:'Petit-d\u00e9jeuner anglais simplifi\u00e9', cat:'petit-dej', ing:[{id:'oeuf',g:110},{id:'lardons',g:50},{id:'haricotsblancs-tomate',g:120},{id:'pain-complet',g:50}], steps:'1. Cuire les œufs au plat, jaune encore coulant.\n2. Faire dorer les lardons à sec jusqu’à croustillants, réchauffer les haricots blancs. Servir le tout avec le pain grillé.', t:15},

// --- POULET / DINDE ---
{id:'r-poulet-riz-brocoli', n:'Poulet, riz, brocoli', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'riz-basmati-cuit',g:200},{id:'brocoli',g:150},{id:'huile-olive',g:8}], steps:'1. Couper le poulet en morceaux r\u00e9guliers, saler.\n2. Faire chauffer l\u2019huile \u00e0 feu vif avant d\u2019ajouter le poulet (une po\u00eale pas assez chaude le fait bouillir au lieu de dorer), saisir 8-10 min jusqu\u2019\u00e0 belle coloration et cuisson \u00e0 cœur.\n3. Cuire le brocoli \u00e0 la vapeur 5-6 min \u2014 il doit rester ferme et vert vif, pas d\u00e9tremp\u00e9.\n4. Assembler avec le riz. Un filet de sauce soja ou de jus de citron en fin de cuisson rel\u00e8ve bien l\u2019ensemble.', t:15},
{id:'r-poulet-curry-coco', n:'Poulet, riz, curry lait de coco', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'riz-basmati-cuit',g:200},{id:'lait-coco',g:100},{id:'oignon',g:60}], steps:'1. Faire revenir l\u2019oignon \u00e9minc\u00e9 5-6 min \u00e0 feu doux jusqu\u2019\u00e0 fondant \u2014 c\u2019est la base sucr\u00e9e du curry, ne pas le pr\u00e9cipiter.\n2. Ajouter des \u00e9pices (curcuma, curry) 30 sec pour les r\u00e9veiller, puis le poulet en morceaux, saisir 5 min.\n3. Verser le lait de coco, mijoter 10-15 min \u00e0 couvert \u00e0 feu doux jusqu\u2019\u00e0 l\u00e9g\u00e8re r\u00e9duction. Servir sur le riz.', t:30},
{id:'r-poulet-quinoa-legumes', n:'Poulet, quinoa, légumes rôtis', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'quinoa-cuit',g:180},{id:'courgette',g:100},{id:'poivron',g:80},{id:'huile-olive',g:8}], steps:'1. Couper les l\u00e9gumes en morceaux r\u00e9guliers, les enduire d\u2019huile, r\u00f4tir au four 20 min \u00e0 200\u00b0C jusqu\u2019\u00e0 bords caram\u00e9lis\u00e9s \u2014 \u00e7a concentre leur go\u00fbt bien plus qu\u2019une cuisson vapeur.\n2. Poêler le poulet \u00e0 part 8-10 min \u00e0 feu vif jusqu\u2019\u00e0 bien color\u00e9.\n3. Servir sur le quinoa, avec un filet d\u2019huile d\u2019olive crue pour finir.', t:30},
{id:'r-salade-poulet-avocat', n:'Salade poulet, avocat, tomate', cat:'dejeuner', ing:[{id:'poulet-cuit',g:150},{id:'avocat',g:70},{id:'tomate',g:100},{id:'salade',g:60},{id:'huile-olive',g:8}], steps:'1. Couper tous les ingr\u00e9dients juste avant de servir (l\u2019avocat noircit vite).\n2. M\u00e9langer dans un saladier avec un filet d\u2019huile, sel, poivre, et un peu de jus de citron si dispo pour la fraicheur et pour emp\u00eacher l\u2019avocat de noircir.', t:10},
{id:'r-wrap-poulet', n:'Wrap poulet, crudités', cat:'dejeuner', ing:[{id:'poulet-cuit',g:130},{id:'pain-blanc',g:70},{id:'salade',g:30},{id:'tomate',g:50},{id:'mayonnaise',g:12}], steps:'1. R\u00e9chauffer légèrement la tortilla \u00e0 la po\u00eale s\u00e8che quelques secondes \u2014 elle devient plus souple et se roule sans casser.\n2. Garnir avec le poulet, la salade, la tomate et la mayonnaise, rouler serré en repliant les c\u00f4t\u00e9s vers l\u2019int\u00e9rieur.', t:15},
{id:'r-poulet-patatedouce', n:'Poulet rôti, patate douce', cat:'dejeuner', ing:[{id:'poulet-cuisse-cru',g:180},{id:'patatedouce-cuite',g:220},{id:'haricotsverts',g:100}], steps:'1. Saler le poulet et le laisser reposer 10 min avant cuisson si possible \u2014 le sel p\u00e9n\u00e8tre mieux.\n2. Rôtir au four 30-35 min \u00e0 200\u00b0C, peau vers le haut, jusqu\u2019\u00e0 peau bien croustillante et jus clair.\n3. Cuire la patate douce et les haricots verts \u00e0 la vapeur en parallèle. Laisser reposer le poulet 3-5 min avant de servir pour que le jus se r\u00e9partisse.', t:40},
{id:'r-poulet-pates-tomate', n:'Poulet, pâtes, sauce tomate', cat:'dejeuner', ing:[{id:'poulet-cru',g:140},{id:'pates-cuites',g:220},{id:'coulistomate',g:100},{id:'parmesan',g:15}], steps:'1. Poêler le poulet coup\u00e9 en d\u00e9s \u00e0 feu vif 8 min jusqu\u2019\u00e0 bien color\u00e9.\n2. Ajouter le coulis, mijoter 5-8 min \u00e0 feu doux pour qu\u2019il \u00e9paississe l\u00e9g\u00e8rement et prenne le go\u00fbt du poulet.\n3. M\u00e9langer avec les p\u00e2tes chaudes, parsemer de parmesan.', t:25},
{id:'r-dinde-riz-legumes', n:'Dinde, riz, légumes sautés', cat:'dejeuner', ing:[{id:'dinde-cru',g:150},{id:'riz-basmati-cuit',g:200},{id:'poivron',g:80},{id:'courgette',g:80},{id:'huile-sesame',g:6}], steps:'1. Couper la dinde en fines lamelles (facilite une cuisson rapide et homog\u00e8ne).\n2. Chauffer l\u2019huile de s\u00e9same \u00e0 feu vif, saisir la dinde 3-4 min, r\u00e9server.\n3. Saisir les l\u00e9gumes 4-5 min dans la m\u00eame po\u00eale, remettre la dinde, m\u00e9langer 1-2 min. Servir sur le riz.', t:20},
{id:'r-poulet-sesame-soja', n:'Poulet sauté, riz, sésame et sauce soja', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'riz-basmati-cuit',g:200},{id:'huile-sesame',g:8},{id:'saucesoja',g:20},{id:'oignon',g:50}], steps:'1. Faire revenir l\u2019oignon \u00e9minc\u00e9 dans l\u2019huile de s\u00e9same 2-3 min, ajouter le poulet en morceaux, saisir 8-10 min \u00e0 feu vif jusqu\u2019\u00e0 bien color\u00e9.\n2. Baisser légèrement le feu, d\u00e9glacer \u00e0 la sauce soja en fin de cuisson en remuant bien pour enrober \u2014 elle br\u00fble vite si le feu est trop fort. Servir sur le riz.', t:20},
{id:'r-poulet-fajitas', n:'Poulet fajitas, poivrons, tortilla', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'pain-blanc',g:80},{id:'poivron',g:120},{id:'oignon',g:60},{id:'huile-olive',g:8}], steps:'1. Couper le poulet en lani\u00e8res, mariner rapidement avec cumin et paprika si dispo.\n2. Faire sauter \u00e0 feu vif 8-10 min avec le poivron et l\u2019oignon en lani\u00e8res, jusqu\u2019\u00e0 ce que tout soit bien color\u00e9 et légèrement caram\u00e9lis\u00e9 sur les bords.\n3. R\u00e9chauffer les tortillas \u00e0 la po\u00eale s\u00e8che avant de garnir.', t:20},
{id:'r-cuisse-poulet-pdt', n:'Cuisse de poulet rôtie, pommes de terre', cat:'dejeuner', ing:[{id:'poulet-cuisse-cru',g:200},{id:'pdt-cuite',g:250},{id:'haricotsverts',g:100}], steps:'1. Saler la cuisse, la rôtir au four 35 min \u00e0 200\u00b0C, peau vers le haut, jusqu\u2019\u00e0 peau croustillante et jus clair.\n2. R\u00e9chauffer les pommes de terre \u00e0 la po\u00eale avec un peu de mati\u00e8re grasse pour qu\u2019elles regagnent du croustillant plut\u00f4t que de rester molles.\n3. Cuire les haricots verts \u00e0 la vapeur 5 min.', t:40},
{id:'r-poulet-riz-cantonais', n:'Riz cantonais poulet, œuf, petits pois', cat:'dejeuner', ing:[{id:'poulet-cuit',g:120},{id:'riz-basmati-cuit',g:220},{id:'oeuf',g:55},{id:'petitspois',g:60},{id:'saucesoja',g:15}], steps:'1. Cuire l\u2019œuf brouill\u00e9 \u00e0 part \u00e0 feu doux (pas trop cuit, il finira de prendre en se m\u00e9langeant au riz chaud), r\u00e9server.\n2. Sauter le riz \u00e0 feu vif avec le poulet et les petits pois 5 min \u2014 utiliser du riz de la veille (plus sec) donne un meilleur r\u00e9sultat qu\u2019un riz tout juste cuit qui colle.\n3. Ajouter l\u2019œuf et la sauce soja, m\u00e9langer 1 min.', t:20},
{id:'r-poulet-houmous', n:'Poulet grillé, houmous, quinoa', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'houmous',g:60},{id:'quinoa-cuit',g:150},{id:'concombre',g:80}], steps:'1. Griller le poulet \u00e0 la po\u00eale 8-10 min \u00e0 feu moyen-vif jusqu\u2019\u00e0 bien color\u00e9 et cuit \u00e0 cœur.\n2. Servir sur le quinoa avec le houmous et le concombre en d\u00e9s, un filet d\u2019huile d\u2019olive et un peu de citron si dispo.', t:20},
{id:'r-formule-poulet-ratatouille', n:'Formule poulet + ratatouille (Rôtisserie)', cat:'dejeuner', ing:[{id:'poulet-roti',g:200},{id:'ratatouille',g:300}], steps:'Plat tout prêt (rôtisserie) \u2014 réchauffer si besoin et servir.', t:5},
{id:'r-demi-poulet-fermier', n:'1/2 poulet fermier rôti', cat:'dejeuner', ing:[{id:'poulet-roti',g:375}], steps:'Plat tout prêt (rôtisserie) \u2014 réchauffer si besoin.', t:5},
{id:'r-dinde-patates-douces', n:'Escalope de dinde, purée patate douce', cat:'dejeuner', ing:[{id:'dinde-cru',g:160},{id:'patatedouce-cuite',g:220},{id:'epinards',g:100}], steps:'1. Poêler l\u2019escalope \u00e0 feu moyen 5-6 min de chaque c\u00f4t\u00e9 jusqu\u2019\u00e0 cuisson compl\u00e8te (jus clair).\n2. \u00c9craser la patate douce cuite en pur\u00e9e, avec une noix de beurre si dispo pour l\u2019onctuosit\u00e9.\n3. Faire tomber les \u00e9pinards \u00e0 la po\u00eale 2 min avec une pointe d\u2019ail si dispo.', t:20},
{id:'r-poulet-tikka', n:'Poulet tikka masala, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'coulistomate',g:120},{id:'lait-coco',g:80},{id:'riz-basmati-cuit',g:200}], steps:'1. Saisir le poulet en morceaux \u00e0 feu vif 5 min avec des \u00e9pices (curcuma, garam masala, paprika) jusqu\u2019\u00e0 bien color\u00e9.\n2. Ajouter le coulis de tomate et le lait de coco, mijoter 12-15 min \u00e0 couvert \u00e0 feu doux jusqu\u2019\u00e0 l\u00e9g\u00e8re r\u00e9duction. Servir sur le riz.', t:30},
{id:'r-poulet-basquaise', n:'Poulet basquaise, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'poivron',g:120},{id:'tomate',g:100},{id:'riz-basmati-cuit',g:180}], steps:'1. Faire dorer le poulet \u00e0 feu vif 5-6 min sur toutes les faces.\n2. Ajouter poivrons et tomate coup\u00e9s, mijoter \u00e0 couvert 20 min \u00e0 feu doux jusqu\u2019\u00e0 ce que le poulet soit tr\u00e8s tendre et la sauce l\u00e9g\u00e8rement r\u00e9duite. Servir sur le riz.', t:30},
{id:'r-salade-cesar', n:'Salade César poulet', cat:'dejeuner', ing:[{id:'poulet-cuit',g:150},{id:'salade',g:80},{id:'parmesan',g:20},{id:'mayonnaise',g:15},{id:'pain-complet',g:30}], steps:'1. Faire griller les d\u00e9s de pain \u00e0 la po\u00eale avec un peu d\u2019huile jusqu\u2019\u00e0 croustillants \u2014 des vrais croutons maison changent tout par rapport \u00e0 du pain nature.\n2. M\u00e9langer la salade avec la mayonnaise (id\u00e9alement d\u00e9tendue d\u2019un peu de jus de citron et de parmesan r\u00e2p\u00e9 pour se rapprocher d\u2019une vraie sauce c\u00e9sar).\n3. Ajouter le poulet et les croutons juste avant de servir pour qu\u2019ils restent croquants.', t:10},
{id:'r-bowl-mediterraneen', n:'Bowl méditerranéen (poulet, feta, olives)', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'quinoa-cuit',g:150},{id:'feta',g:40},{id:'olives',g:20},{id:'concombre',g:80}], steps:'1. Griller le poulet \u00e0 la po\u00eale 8-10 min \u00e0 feu moyen-vif jusqu\u2019\u00e0 bien color\u00e9.\n2. Dresser sur le quinoa avec la feta en morceaux (pas trop \u00e9miett\u00e9e), les olives et le concombre en d\u00e9s. Un filet d\u2019huile d\u2019olive termine bien le plat.', t:20},
{id:'r-sandwich-poulet-avocat', n:'Sandwich poulet, avocat', cat:'dejeuner', ing:[{id:'poulet-cuit',g:130},{id:'pain-complet',g:80},{id:'avocat',g:60},{id:'salade',g:20}], steps:'1. \u00c9craser l\u2019avocat avec un peu de citron et de sel (\u00e7a l\u2019emp\u00eache de noircir et rel\u00e8ve son go\u00fbt).\n2. Tartiner le pain, garnir avec le poulet effiloch\u00e9 et la salade.', t:15},
{id:'r-chili-dinde', n:'Chili de dinde, haricots rouges', cat:'dejeuner', ing:[{id:'dinde-cru',g:150},{id:'haricotsrouges-cuits',g:180},{id:'coulistomate',g:120}], steps:'1. Faire revenir la dinde hach\u00e9e ou en d\u00e9s \u00e0 feu vif 5-6 min avec cumin et paprika jusqu\u2019\u00e0 bien color\u00e9e.\n2. Ajouter haricots rouges et coulis, mijoter 15 min \u00e0 feu doux \u00e0 d\u00e9couvert pour que \u00e7a \u00e9paississe.', t:30},
{id:'r-dinde-champignons-creme', n:'Escalope de dinde, champignons, crème légère', cat:'dejeuner', ing:[{id:'dinde-cru',g:160},{id:'champignons-cuits',g:150},{id:'cremelegere',g:40},{id:'riz-basmati-cuit',g:180}], steps:'1. Poêler l\u2019escalope 5-6 min de chaque c\u00f4t\u00e9 jusqu\u2019\u00e0 cuisson compl\u00e8te, r\u00e9server.\n2. Faire revenir les champignons dans la m\u00eame po\u00eale 4-5 min, ajouter la cr\u00e8me, remettre la dinde 1-2 min pour r\u00e9chauffer. Servir sur le riz.', t:20},

// --- VIANDE ROUGE ---
{id:'r-steak-riz-haricots', n:'Steak haché, riz, haricots verts', cat:'dejeuner', ing:[{id:'boeuf-hache5',g:150},{id:'riz-basmati-cuit',g:200},{id:'haricotsverts',g:120}], steps:'1. Sortir le steak du frigo quelques minutes avant cuisson, saler juste avant de le poser en po\u00eale.\n2. Poêler \u00e0 feu vif 3-4 min de chaque c\u00f4t\u00e9 sans \u00e9craser la viande \u00e0 la spatule (\u00e7a fait perdre le jus).\n3. Laisser reposer 1-2 min avant de servir. Servir avec le riz et les haricots verts réchauffés.', t:20},
{id:'r-chili-con-carne', n:'Chili con carne, riz', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:150},{id:'haricotsrouges-cuits',g:150},{id:'coulistomate',g:100},{id:'riz-basmati-cuit',g:150}], steps:'1. Faire revenir le bœuf hach\u00e9 \u00e0 feu vif 5-6 min avec cumin et paprika (et un peu de piment si aim\u00e9) jusqu\u2019\u00e0 bien color\u00e9.\n2. Ajouter haricots rouges et coulis de tomate, mijoter 15-20 min \u00e0 feu doux \u00e0 d\u00e9couvert pour que \u00e7a \u00e9paississe et que les saveurs se lient. Servir sur le riz.', t:30},
{id:'r-steak-patatedouce', n:'Steak, patate douce, salade', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:170},{id:'patatedouce-cuite',g:200},{id:'salade',g:50}], steps:'1. Sortir le steak du frigo 10 min avant cuisson, saler juste avant.\n2. Saisir 2-3 min de chaque c\u00f4t\u00e9 \u00e0 feu vif dans une po\u00eale bien chaude pour une belle cro\u00fbte.\n3. Laisser reposer 3 min hors du feu avant de trancher \u2014 le jus se redistribue et la viande reste juteuse. Servir avec la patate douce et la salade.', t:20},
{id:'r-boeuf-legumes-sautes', n:'Bœuf sauté, légumes, riz', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:150},{id:'poivron',g:100},{id:'oignon',g:60},{id:'riz-basmati-cuit',g:180},{id:'huile-sesame',g:6}], steps:'1. Couper le bœuf en fines lamelles contre le sens des fibres.\n2. Chauffer l\u2019huile de s\u00e9same jusqu\u2019\u00e0 fumante, saisir le bœuf 1-2 min \u00e0 feu tr\u00e8s vif, r\u00e9server.\n3. Saisir poivron et oignon 3-4 min dans la m\u00eame po\u00eale, remettre le bœuf, m\u00e9langer 1 min. Servir sur le riz.', t:20},
{id:'r-bolognaise', n:'Bolognaise, pâtes complètes', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:150},{id:'coulistomate',g:150},{id:'pates-cuites',g:220},{id:'parmesan',g:15}], steps:'1. Faire revenir le bœuf hach\u00e9 \u00e0 feu vif 5-6 min jusqu\u2019\u00e0 bien color\u00e9 (pas juste gris\u00e2tre \u2014 la coloration fait le go\u00fbt).\n2. Ajouter le coulis de tomate, saler, poivrer, mijoter 15-20 min \u00e0 feu doux \u00e0 d\u00e9couvert pour concentrer les saveurs.\n3. M\u00e9langer avec les p\u00e2tes chaudes, parsemer de parmesan.', t:30},
{id:'r-porc-pommesdeterre', n:'Filet de porc, pommes de terre, légumes', cat:'dejeuner', ing:[{id:'porc-filet',g:160},{id:'pdt-cuite',g:220},{id:'carotte',g:100}], steps:'1. Poêler le filet de porc \u00e0 feu moyen-vif 6-8 min de chaque c\u00f4t\u00e9 jusqu\u2019\u00e0 belle coloration et cuisson \u00e0 cœur (juste rosé au centre).\n2. Laisser reposer 2-3 min avant de trancher. Servir avec les pommes de terre et les carottes réchauffées ou vapeur.', t:20},
{id:'r-burger-maison', n:'Burger maison (steak, pain, fromage)', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:150},{id:'pain-burger',g:90},{id:'emmental',g:25},{id:'salade',g:20},{id:'ketchup',g:15}], steps:'1. Former un steak sans trop tasser, saler juste avant cuisson.\n2. Poêler \u00e0 feu vif 3-4 min de chaque c\u00f4t\u00e9, poser le fromage dessus dans la derni\u00e8re minute pour qu\u2019il fonde.\n3. Griller légèrement l\u2019int\u00e9rieur du pain \u00e0 la po\u00eale (\u00e9vite qu\u2019il d\u00e9trempe). Assembler avec salade et ketchup.', t:20},
{id:'r-boeuf-stroganoff', n:'Bœuf stroganoff, riz', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:150},{id:'champignons-cuits',g:120},{id:'cremelegere',g:50},{id:'riz-basmati-cuit',g:180}], steps:'1. Couper le bœuf en fines lani\u00e8res (contre le sens des fibres, \u00e7a le rend plus tendre).\n2. Saisir \u00e0 feu vif dans une po\u00eale tr\u00e8s chaude 2-3 min max en remuant \u2014 juste color\u00e9, pas cuit \u00e0 cœur. R\u00e9server aussit\u00f4t (il continuerait \u00e0 cuire et durcirait sinon).\n3. Dans la m\u00eame po\u00eale, faire revenir les champignons 4-5 min jusqu\u2019\u00e0 ce qu\u2019ils rendent leur eau et commencent \u00e0 dorer.\n4. Baisser le feu, ajouter la cr\u00e8me, m\u00e9langer et laisser \u00e9paissir l\u00e9g\u00e8rement 1-2 min \u2014 ne pas laisser bouillir fort, \u00e7a ferait grainer la cr\u00e8me.\n5. Remettre le bœuf 1-2 min juste pour r\u00e9chauffer (jamais plus, sinon il devient caoutchouteux). Servir sur le riz.', t:20},
{id:'r-boeuf-champignons-riz', n:'Poêlée de bœuf, champignons, riz', cat:'dejeuner', ing:[{id:'boeuf-hache5',g:150},{id:'champignons-cuits',g:150},{id:'riz-basmati-cuit',g:180},{id:'huile-olive',g:6}], steps:'1. Faire revenir le bœuf hach\u00e9 \u00e0 feu vif 4-5 min jusqu\u2019\u00e0 bien color\u00e9, r\u00e9server.\n2. Faire dorer les champignons dans la m\u00eame po\u00eale 4-5 min (ils rendent leur eau puis dorent \u2014 patienter jusqu\u2019\u00e0 cette 2e phase).\n3. Remettre le bœuf, m\u00e9langer 1-2 min. Servir sur le riz.', t:20},
{id:'r-porc-riz-sauce-soja', n:'Filet de porc, riz, sauce soja', cat:'dejeuner', ing:[{id:'porc-filet',g:160},{id:'riz-basmati-cuit',g:200},{id:'saucesoja',g:20},{id:'gingembre',g:5}], steps:'1. Poêler le porc en lamelles \u00e0 feu vif avec le gingembre r\u00e2p\u00e9 6-8 min jusqu\u2019\u00e0 bien color\u00e9.\n2. Baisser le feu, d\u00e9glacer \u00e0 la sauce soja en fin de cuisson en remuant bien pour enrober sans laisser br\u00fbler. Servir sur le riz.', t:20},

// --- POISSON ---
{id:'r-saumon-riz-brocoli', n:'Saumon, riz, brocoli', cat:'dejeuner', ing:[{id:'saumon-cru',g:150},{id:'riz-basmati-cuit',g:180},{id:'brocoli',g:150}], steps:'1. S\u00e9cher le saumon, saler.\n2. Poêler c\u00f4t\u00e9 peau en premier 4-5 min \u00e0 feu moyen sans bouger, jusqu\u2019\u00e0 peau croustillante, puis retourner 2-3 min.\n3. Cuire le brocoli \u00e0 la vapeur 5-6 min \u2014 il doit rester ferme et vert vif. Servir avec le riz.', t:20},
{id:'r-cabillaud-legumes-vapeur', n:'Cabillaud, légumes vapeur, pommes de terre', cat:'dejeuner', ing:[{id:'cabillaud-cru',g:180},{id:'pdt-cuite',g:200},{id:'courgette',g:120}], steps:'1. S\u00e9cher le cabillaud avec du papier absorbant, saler.\n2. Cuire \u00e0 la vapeur ou au four 10-12 min jusqu\u2019\u00e0 ce qu\u2019il s\u2019effeuille facilement \u00e0 la fourchette (pas plus, il devient sec).\n3. Cuire la courgette \u00e0 la vapeur, r\u00e9chauffer les pommes de terre. Un filet d\u2019huile d\u2019olive et de citron sur le poisson termine bien le plat.', t:20},
{id:'r-thon-pates-tomate', n:'Thon, pâtes, sauce tomate', cat:'dejeuner', ing:[{id:'thon-boite',g:140},{id:'pates-cuites',g:220},{id:'coulistomate',g:100}], steps:'1. Chauffer le coulis de tomate \u00e0 feu doux, ajouter le thon \u00e9miett\u00e9 en fin de cuisson seulement (2-3 min) pour qu\u2019il ne devienne pas sec et filandreux.\n2. M\u00e9langer avec les p\u00e2tes chaudes.', t:10},
{id:'r-salade-thon-oeuf', n:'Salade thon, œuf dur, tomate', cat:'dejeuner', ing:[{id:'thon-boite',g:120},{id:'oeuf',g:110},{id:'tomate',g:100},{id:'salade',g:50},{id:'huile-olive',g:8}], steps:'1. Cuire l\u2019œuf dur 9-10 min, le plonger imm\u00e9diatement dans l\u2019eau froide pour arr\u00eater la cuisson et faciliter l\u2019\u00e9calage.\n2. M\u00e9langer tous les ingr\u00e9dients avec un filet d\u2019huile, sel, poivre.', t:15},
{id:'r-saumon-quinoa-avocat', n:'Saumon, quinoa, avocat', cat:'dejeuner', ing:[{id:'saumon-cru',g:150},{id:'quinoa-cuit',g:150},{id:'avocat',g:60}], steps:'1. Poêler le saumon c\u00f4t\u00e9 peau en premier 4-5 min, retourner 2-3 min \u2014 la chair doit rester légèrement rosée \u00e0 cœur.\n2. Servir sur le quinoa avec l\u2019avocat en tranches et un filet de citron si dispo.', t:20},
{id:'r-poke-bowl-thon', n:'Poke bowl thon, riz, avocat, edamame', cat:'dejeuner', ing:[{id:'thon-cru',g:150},{id:'riz-basmati-cuit',g:180},{id:'avocat',g:60},{id:'petitspois',g:60},{id:'saucesoja',g:15}], steps:'1. Utiliser du thon de qualit\u00e9 sushi/consommation crue si possible. Couper en d\u00e9s r\u00e9guliers.\n2. Mariner rapidement (5 min max) dans la sauce soja \u2014 trop longtemps et le thon commence \u00e0 \"cuire\" au contact de l\u2019acidit\u00e9.\n3. Dresser sur le riz avec l\u2019avocat et les petits pois.', t:15},
{id:'r-crevettes-riz-saute', n:'Crevettes sautées, riz, légumes', cat:'dejeuner', ing:[{id:'crevettes-cuites',g:180},{id:'riz-basmati-cuit',g:200},{id:'poivron',g:80},{id:'huile-sesame',g:8},{id:'saucesoja',g:15}], steps:'1. Faire sauter le poivron dans l\u2019huile de s\u00e9same \u00e0 feu vif 3-4 min.\n2. Ajouter les crevettes 2-3 min seulement pour les r\u00e9chauffer (elles sont d\u00e9j\u00e0 cuites, trop de temps les rend caoutchouteuses).\n3. Ajouter le riz, d\u00e9glacer \u00e0 la sauce soja, m\u00e9langer 1-2 min \u00e0 feu vif.', t:20},
{id:'r-saumon-teriyaki', n:'Saumon teriyaki, riz, brocoli', cat:'dejeuner', ing:[{id:'saumon-cru',g:160},{id:'saucesoja',g:20},{id:'miel',g:10},{id:'riz-basmati-cuit',g:180},{id:'brocoli',g:120}], steps:'1. S\u00e9cher le saumon avec du papier absorbant, saler l\u00e9g\u00e8rement (la sauce soja apportera d\u00e9j\u00e0 du sel).\n2. Poêler c\u00f4t\u00e9 peau en premier 3-4 min \u00e0 feu moyen sans bouger, jusqu\u2019\u00e0 ce que la peau soit croustillante.\n3. Retourner, cuire 2-3 min de l\u2019autre c\u00f4t\u00e9 \u2014 la chair doit rester l\u00e9g\u00e8rement rosée \u00e0 cœur si aim\u00e9e ainsi.\n4. Baisser le feu, verser le m\u00e9lange sauce soja-miel dans la po\u00eale, laisser r\u00e9duire 1 min en nappant le poisson \u00e0 la cuill\u00e8re jusqu\u2019\u00e0 ce que \u00e7a devienne sirupeux \u2014 surveiller de pr\u00e8s, le miel br\u00fble vite.\n5. Servir avec le riz et le brocoli cuit \u00e0 la vapeur 5-6 min.', t:20},
{id:'r-cabillaud-citron', n:'Cabillaud, riz, sauce citron', cat:'dejeuner', ing:[{id:'cabillaud-cru',g:180},{id:'riz-basmati-cuit',g:180},{id:'citron',g:20},{id:'huile-olive',g:8}], steps:'1. S\u00e9cher le cabillaud, saler.\n2. Poêler 4-5 min de chaque c\u00f4t\u00e9 \u00e0 feu moyen avec un filet d\u2019huile, arroser de jus de citron en fin de cuisson.\n3. Servir avec le riz \u2014 la chair doit s\u2019effeuiller facilement \u00e0 la fourchette.', t:20},
{id:'r-pates-saumon-creme', n:'Pâtes au saumon, crème légère', cat:'dejeuner', ing:[{id:'saumon-cru',g:130},{id:'pates-cuites',g:220},{id:'cremelegere',g:60},{id:'epinards',g:60}], steps:'1. Poêler le saumon émietté 4-5 min avec les épinards jusqu\u2019\u00e0 cuisson du poisson et \u00e9pinards fl\u00e9tris.\n2. Ajouter la cr\u00e8me, chauffer 2 min \u00e0 feu doux sans bouillir (\u00e7a la ferait trancher). M\u00e9langer avec les p\u00e2tes chaudes.', t:20},
{id:'r-pates-thon-olives', n:'Pâtes au thon, olives, tomates', cat:'dejeuner', ing:[{id:'thon-boite',g:140},{id:'pates-cuites',g:200},{id:'olives',g:20},{id:'tomate',g:100}], steps:'1. M\u00e9langer le thon \u00e9miett\u00e9, les olives et la tomate coup\u00e9e avec les p\u00e2tes tièdes. Un filet d\u2019huile d\u2019olive et un peu de basilic frais si dispo relèvent bien l\u2019ensemble.', t:10},
{id:'r-salade-pates-thon', n:'Salade de pâtes, thon, tomates', cat:'dejeuner', ing:[{id:'thon-boite',g:120},{id:'pates-cuites',g:180},{id:'tomate',g:100},{id:'olives',g:15},{id:'huile-olive',g:8}], steps:'1. M\u00e9langer tous les ingr\u00e9dients froids avec un filet d\u2019huile, sel, poivre \u2014 pr\u00e9parer un peu \u00e0 l\u2019avance et laisser au frigo 15-20 min permet aux saveurs de mieux se lier.', t:10},
{id:'r-gratin-poisson', n:'Gratin de poisson, pommes de terre', cat:'dejeuner', ing:[{id:'cabillaud-cru',g:170},{id:'pdt-cuite',g:200},{id:'cremelegere',g:50},{id:'emmental',g:20}], steps:'1. Pr\u00e9chauffer le four \u00e0 200\u00b0C.\n2. Couper les pommes de terre en tranches fines et r\u00e9guli\u00e8res, en tapisser le fond d\u2019un plat beurr\u00e9.\n3. D\u00e9poser le poisson coup\u00e9 en morceaux par-dessus, saler, poivrer.\n4. Napper de cr\u00e8me, parsemer de fromage r\u00e2p\u00e9.\n5. Four 20-25 min jusqu\u2019\u00e0 ce que le dessus soit dor\u00e9 et que le poisson soit cuit \u00e0 cœur (il doit s\u2019effeuiller facilement \u00e0 la fourchette).', t:30},
{id:'r-wrap-thon-avocat', n:'Wrap thon, avocat, salade', cat:'dejeuner', ing:[{id:'thon-boite',g:120},{id:'tortilla',g:60},{id:'avocat',g:60},{id:'salade',g:30}], steps:'1. \u00c9craser l\u2019avocat avec un peu de citron et de sel.\n2. Garnir la tortilla avec le thon \u00e9goutt\u00e9, l\u2019avocat \u00e9cras\u00e9 et la salade, rouler serr\u00e9.', t:15},

// --- VÉGÉ / LÉGUMINEUSES ---
{id:'r-dahl-lentilles', n:'Dahl de lentilles, riz', cat:'dejeuner', ing:[{id:'lentilles-cuites',g:250},{id:'lait-coco',g:80},{id:'riz-basmati-cuit',g:180},{id:'oignon',g:50}], steps:'1. Faire revenir l\u2019oignon \u00e9minc\u00e9 \u00e0 feu doux 6-8 min jusqu\u2019\u00e0 fondant, avec des \u00e9pices (curcuma, cumin) 30 sec pour les r\u00e9veiller.\n2. Ajouter les lentilles et le lait de coco, mijoter 10 min \u00e0 feu doux en \u00e9crasant l\u00e9g\u00e8rement une partie des lentilles pour \u00e9paissir naturellement. Servir sur le riz.', t:30},
{id:'r-curry-poischiches', n:'Curry de pois chiches, riz', cat:'dejeuner', ing:[{id:'poischiches-cuits',g:250},{id:'lait-coco',g:100},{id:'riz-basmati-cuit',g:180},{id:'tomate',g:80}], steps:'1. Faire chauffer la tomate coup\u00e9e avec des \u00e9pices (curcuma, cumin, coriandre) 2-3 min pour les r\u00e9veiller.\n2. Ajouter pois chiches et lait de coco, mijoter 12-15 min \u00e0 feu doux jusqu\u2019\u00e0 l\u00e9g\u00e8re r\u00e9duction. Servir sur le riz.', t:30},
{id:'r-tofu-legumes-riz', n:'Tofu sauté, légumes, riz', cat:'dejeuner', ing:[{id:'tofu',g:200},{id:'poivron',g:100},{id:'brocoli',g:100},{id:'riz-basmati-cuit',g:180},{id:'saucesoja',g:15}], steps:'1. S\u00e9cher le tofu en d\u00e9s avec du papier absorbant (\u00e7a l\u2019aide \u00e0 dorer plut\u00f4t qu\u2019\u00e0 bouillir), saisir \u00e0 feu vif 5-6 min jusqu\u2019\u00e0 cro\u00fbte dor\u00e9e, r\u00e9server.\n2. Faire sauter les l\u00e9gumes 4-5 min dans la m\u00eame po\u00eale, remettre le tofu, d\u00e9glacer \u00e0 la sauce soja. Servir sur le riz.', t:20},
{id:'r-salade-quinoa-poischiches', n:'Salade quinoa, pois chiches, feta', cat:'dejeuner', ing:[{id:'quinoa-cuit',g:180},{id:'poischiches-cuits',g:150},{id:'tomate',g:100},{id:'huile-olive',g:10}], steps:'1. M\u00e9langer tous les ingr\u00e9dients froids avec un filet d\u2019huile, sel, poivre, et un peu de citron si dispo pour la fraicheur.', t:10},
{id:'r-chili-vege', n:'Chili végétarien, haricots rouges', cat:'dejeuner', ing:[{id:'haricotsrouges-cuits',g:250},{id:'coulistomate',g:150},{id:'oignon',g:60},{id:'riz-basmati-cuit',g:150}], steps:'1. Faire revenir l\u2019oignon 5-6 min \u00e0 feu doux avec cumin et paprika.\n2. Ajouter haricots rouges et coulis, mijoter 15 min \u00e0 feu doux \u00e0 d\u00e9couvert pour que \u00e7a \u00e9paississe. Servir sur le riz.', t:30},
{id:'r-oeufs-lentilles', n:'Œufs, lentilles, épinards', cat:'dejeuner', ing:[{id:'oeuf',g:110},{id:'lentilles-cuites',g:200},{id:'epinards',g:100},{id:'huile-olive',g:8}], steps:'1. Faire tomber les \u00e9pinards \u00e0 la po\u00eale 2 min avec un peu d\u2019ail si dispo.\n2. Ajouter les lentilles pour r\u00e9chauffer.\n3. Cuire les œufs au plat ou poch\u00e9s \u00e0 part, avec le jaune encore coulant, et les d\u00e9poser dessus.', t:20},
{id:'r-soupe-lentillescorail', n:'Soupe de lentilles corail, riz', cat:'dejeuner', ing:[{id:'lentillescorail-cuites',g:300},{id:'lait-coco',g:80},{id:'riz-basmati-cuit',g:120}], steps:'1. Chauffer les lentilles corail avec le lait de coco et des \u00e9pices (curcuma, cumin) 5-8 min \u00e0 feu doux.\n2. Mixer si texture soupe souhait\u00e9e. Servir avec un peu de riz.', t:15},
{id:'r-buddhabowl', n:'Buddha bowl (quinoa, pois chiches, avocat)', cat:'dejeuner', ing:[{id:'quinoa-cuit',g:150},{id:'poischiches-cuits',g:150},{id:'avocat',g:70},{id:'carotte',g:60}], steps:'1. Dresser tous les ingr\u00e9dients c\u00f4te \u00e0 c\u00f4te en sections distinctes dans un bol, la carotte r\u00e2p\u00e9e crue.\n2. Un filet d\u2019huile d\u2019olive et un peu de citron termine bien l\u2019ensemble.', t:15},
{id:'r-curry-legumes-tofu', n:'Curry de légumes, tofu, riz', cat:'dejeuner', ing:[{id:'tofu',g:180},{id:'poivron',g:100},{id:'choufleur',g:100},{id:'lait-coco',g:100},{id:'riz-basmati-cuit',g:180}], steps:'1. Saisir le tofu s\u00e9ch\u00e9 en d\u00e9s 4-5 min \u00e0 feu vif jusqu\u2019\u00e0 dor\u00e9, r\u00e9server.\n2. Faire revenir les l\u00e9gumes 4-5 min, ajouter le lait de coco et des \u00e9pices, mijoter 12-15 min. Remettre le tofu en fin de cuisson. Servir sur le riz.', t:30},
{id:'r-falafel-salade', n:'Galettes de pois chiches (falafel), salade', cat:'dejeuner', ing:[{id:'poischiches-cuits',g:220},{id:'farine',g:20},{id:'salade',g:60},{id:'huile-olive',g:10}], steps:'1. Mixer les pois chiches avec la farine, ail et \u00e9pices (cumin, coriandre) jusqu\u2019\u00e0 p\u00e2te \u00e9paisse mais pas trop lisse (garder un peu de texture).\n2. Former des galettes, cuire \u00e0 la po\u00eale dans l\u2019huile 4-5 min de chaque c\u00f4t\u00e9 \u00e0 feu moyen jusqu\u2019\u00e0 bien dor\u00e9es et croustillantes. Servir avec la salade.', t:20},
{id:'r-tofu-riz-cantonais', n:'Riz cantonais tofu, œuf, petits pois', cat:'dejeuner', ing:[{id:'tofu',g:150},{id:'riz-basmati-cuit',g:220},{id:'oeuf',g:55},{id:'petitspois',g:60},{id:'saucesoja',g:15}], steps:'1. Cuire l\u2019œuf brouillé \u00e0 part \u00e0 feu doux, r\u00e9server.\n2. Saisir le tofu en d\u00e9s \u00e0 feu vif jusqu\u2019\u00e0 dor\u00e9, ajouter le riz et les petits pois, saut\u00e9r 5 min. Ajouter l\u2019œuf et la sauce soja.', t:20},
{id:'r-salade-feta-poischiches', n:'Salade feta, pois chiches, tomates', cat:'dejeuner', ing:[{id:'feta',g:60},{id:'poischiches-cuits',g:180},{id:'tomate',g:120},{id:'olives',g:15},{id:'huile-olive',g:10}], steps:'1. M\u00e9langer tous les ingr\u00e9dients froids avec un filet d\u2019huile, sel, poivre \u2014 laisser reposer 10 min au frais avant de servir si possible.', t:10},

// --- ŒUFS ---
{id:'r-riz-oeufs-sesame-soja', n:'Riz, œufs, huile de sésame, sauce soja', cat:'dejeuner', ing:[{id:'riz-basmati-cuit',g:250},{id:'oeuf',g:220},{id:'huile-sesame',g:5},{id:'saucesoja',g:25}], steps:'1. Battre les œufs, les brouiller dans l\u2019huile de s\u00e9same \u00e0 feu doux-moyen en remuant r\u00e9guli\u00e8rement pour une texture cr\u00e9meuse plut\u00f4t que sèche.\n2. Ajouter le riz chaud, m\u00e9langer 1-2 min \u00e0 feu vif, arroser de sauce soja en fin de cuisson.', t:20},
{id:'r-omelette-jambon-fromage', n:'Omelette jambon, fromage', cat:'dejeuner', ing:[{id:'oeuf',g:165},{id:'jambonblanc',g:50},{id:'emmental',g:25}], steps:'1. Battre les œufs avec sel et poivre, verser en po\u00eale chaude légèrement huil\u00e9e.\n2. Laisser prendre sur les bords, ramener vers le centre \u00e0 la spatule pendant que l\u2019œuf liquide comble les vides.\n3. Ajouter jambon coup\u00e9 et fromage r\u00e2p\u00e9 sur une moiti\u00e9 quand le dessus est encore l\u00e9g\u00e8rement baveux, replier.', t:20},
{id:'r-oeufs-avocat-toast', n:'Œufs brouillés, avocat, toast complet', cat:'dejeuner', ing:[{id:'oeuf',g:165},{id:'avocat',g:80},{id:'pain-complet',g:70}], steps:'1. Cuire les œufs brouill\u00e9s \u00e0 feu doux en remuant r\u00e9guli\u00e8rement \u2014 les retirer du feu quand ils sont encore l\u00e9g\u00e8rement baveux, ils finissent de cuire hors du feu.\n2. \u00c9craser l\u2019avocat avec un peu de sel et de citron si dispo. Servir sur le pain grill\u00e9.', t:15},
{id:'r-omelette-champignons', n:'Omelette champignons, fromage', cat:'dejeuner', ing:[{id:'oeuf',g:165},{id:'champignons-cuits',g:100},{id:'emmental',g:25}], steps:'1. Faire revenir les champignons \u00e0 feu vif 3-4 min jusqu\u2019\u00e0 ce qu\u2019ils rendent leur eau et commencent \u00e0 dorer.\n2. Verser les œufs battus, laisser prendre sur les bords, ajouter le fromage, replier quand le centre est encore l\u00e9g\u00e8rement baveux.', t:20},

// --- COLLATIONS / POST-TRAINING ---
{id:'c-shaker-whey', n:'Shaker whey seul', cat:'collation', ing:[{id:'whey-hsn',g:1}], steps:'1. Mélanger la dose de whey avec de l’eau ou du lait dans un shaker, bien secouer pour éviter les grumeaux.', t:6},
{id:'c-shaker-banane', n:'Shaker whey, banane', cat:'collation', ing:[{id:'whey-hsn',g:1},{id:'banane',g:100}], steps:'1. Mixer la whey avec la banane et un peu d’eau ou de lait jusqu’à texture lisse.', t:6},
{id:'c-yaourt-whey', n:'Yaourt grec, whey', cat:'collation', ing:[{id:'yaourtgrec',g:150},{id:'whey-hsn',g:0.5}], steps:'1. Mélanger la demi-dose de whey directement dans le yaourt jusqu’à dissolution complète.', t:6},
{id:'c-skyr-fruits', n:'Skyr, fruits rouges', cat:'collation', ing:[{id:'skyr',g:200},{id:'fraises',g:100}], steps:'1. Couper les fraises et les mélanger au skyr.', t:6},
{id:'c-fromageblanc-miel-amandes', n:'Fromage blanc, miel, amandes', cat:'collation', ing:[{id:'fromageblanc0',g:200},{id:'miel',g:10},{id:'amandes',g:15}], steps:'1. Verser le miel sur le fromage blanc, parsemer d’amandes concassées.', t:6},
{id:'c-toast-beurrecacahuete', n:'Toast, beurre de cacahuète, banane', cat:'collation', ing:[{id:'pain-complet',g:50},{id:'beurrecacahuete',g:20},{id:'banane',g:80}], steps:'1. Griller le pain, tartiner de beurre de cacahuète encore chaud (il s’étale mieux), ajouter la banane en rondelles.', t:6},
{id:'c-pomme-amandes', n:'Pomme, amandes', cat:'collation', ing:[{id:'pomme',g:150},{id:'amandes',g:20}], steps:'1. À consommer tel quel.', t:2},
{id:'c-oeufs-durs', n:'2 œufs durs', cat:'collation', ing:[{id:'oeuf',g:110}], steps:'1. Cuire les œufs 9-10 min dans l’eau bouillante, les plonger immédiatement dans l’eau froide pour arrêter la cuisson et faciliter l’écalage.', t:6},
{id:'c-jambon-fromage-roule', n:'Roulé jambon-fromage', cat:'collation', ing:[{id:'jambonblanc',g:60},{id:'emmental',g:30}], steps:'1. Rouler une tranche de fromage dans une tranche de jambon.', t:6},
{id:'c-cottage-fruits', n:'Cottage cheese, ananas', cat:'collation', ing:[{id:'cottage',g:200},{id:'ananas',g:100}], steps:'1. Couper l’ananas en dés et mélanger avec le cottage cheese.', t:6},
{id:'c-houmous-crudites', n:'Houmous, bâtonnets de crudités', cat:'collation', ing:[{id:'houmous',g:100},{id:'carotte',g:100},{id:'concombre',g:100}], steps:'1. Couper carotte et concombre en bâtonnets, tremper dans le houmous.', t:6},
{id:'c-noix-fruits-secs', n:'Mélange noix, amandes, cajou', cat:'collation', ing:[{id:'amandes',g:15},{id:'noix',g:10},{id:'cajou',g:10}], steps:'1. À consommer tel quel.', t:2},
{id:'c-fromagefrais-crudites', n:'Fromage frais, bâtonnets de concombre', cat:'collation', ing:[{id:'fromagefrais',g:60},{id:'concombre',g:100}], steps:'1. Couper le concombre en bâtonnets, tremper dans le fromage frais.', t:6},
{id:'c-banane-beurrecacahuete', n:'Banane, beurre de cacahuète', cat:'collation', ing:[{id:'banane',g:100},{id:'beurrecacahuete',g:20}], steps:'1. Tartiner la banane coupée en deux de beurre de cacahuète.', t:6},
{id:'c-thon-galettes-riz', n:'Thon, galettes de riz', cat:'collation', ing:[{id:'thon-boite',g:100},{id:'riz-blanc-cuit',g:60}], steps:'1. Égoutter le thon, servir sur ou à côté des galettes de riz.', t:6},
{id:'c-fromageblanc-cacao', n:'Fromage blanc, cacao, banane', cat:'collation', ing:[{id:'fromageblanc0',g:180},{id:'cacao',g:8},{id:'banane',g:80}], steps:'1. Mélanger le cacao dans le fromage blanc jusqu’à dissolution, ajouter la banane coupée.', t:6},
{id:'c-jambondinde-roule', n:'Roulé jambon de dinde, fromage frais', cat:'collation', ing:[{id:'jambondinde',g:60},{id:'fromagefrais',g:30}], steps:'1. Tartiner la tranche de jambon de dinde de fromage frais et rouler.', t:6},
{id:'c-orange-amandes', n:'Orange, amandes', cat:'collation', ing:[{id:'orange',g:150},{id:'amandes',g:15}], steps:'1. À consommer tel quel.', t:2},
{id:'c-barre-cereales-maison', n:'Barre de c\u00e9r\u00e9ales maison', cat:'collation', ing:[{id:'avoine',g:40},{id:'miel',g:15},{id:'amandes',g:15},{id:'dattes',g:20}], steps:'1. Mélanger tous les ingrédients, presser fermement dans un moule (ça aide les barres à tenir une fois découpées).\n2. Four 15 min à 160°C. Laisser refroidir complètement avant de découper.', t:20},
{id:'c-chips-patatedouce', n:'Chips de patate douce au four', cat:'collation', ing:[{id:'patatedouce-crue',g:150},{id:'huile-olive',g:8}], steps:'1. Couper la patate douce en tranches très fines et régulières, enduire d’huile.\n2. Four 20-25 min à 200°C en retournant à mi-cuisson jusqu’à bords dorés et croustillants.', t:30},
{id:'c-popcorn', n:'Pop-corn nature', cat:'collation', ing:[{id:'popcorn-nature',g:30}], steps:'1. À consommer tel quel, ou faire éclater au micro-ondes/poêle sans matière grasse ajoutée.', t:5},
{id:'c-edamame', n:'Edamame vapeur, sel', cat:'collation', ing:[{id:'edamame',g:150}], steps:'1. Cuire à la vapeur ou à l’eau bouillante 4-5 min, saler encore chauds (le sel adhère mieux).', t:8},
{id:'c-fromageblanc-granola-miel', n:'Fromage blanc, granola, miel', cat:'collation', ing:[{id:'fromageblanc0',g:180},{id:'granola',g:30},{id:'miel',g:10}], steps:'1. Mélanger le fromage blanc avec le miel, parsemer de granola juste avant de servir pour garder le croquant.', t:3},
{id:'c-wrap-thon-mini', n:'Mini wrap au thon', cat:'collation', ing:[{id:'thon-boite',g:80},{id:'tortilla',g:40},{id:'salade',g:20}], steps:'1. Garnir la tortilla de thon égoutté et de salade, rouler serré.', t:5},
{id:'c-smoothie-mangue', n:'Smoothie prot\u00e9in\u00e9 mangue', cat:'collation', ing:[{id:'mangue',g:150},{id:'lait-demi',g:150},{id:'whey-hsn',g:1}], steps:'1. Mixer tous les ingrédients ensemble jusqu’à texture lisse.', t:4},
{id:'c-toast-tomate-mozza', n:'Toast tomate, mozzarella', cat:'collation', ing:[{id:'pain-complet',g:50},{id:'tomate',g:80},{id:'mozzarella',g:40}], steps:'1. Disposer tomate et mozzarella en tranches sur le pain grillé, un filet d’huile d’olive et d’origan si dispo.', t:5},
{id:'c-yaourt-fruitssecs-miel', n:'Yaourt, fruits secs, miel', cat:'collation', ing:[{id:'yaourtgrec',g:170},{id:'noix',g:15},{id:'miel',g:10}], steps:'1. Mélanger le yaourt avec les noix concassées et le miel.', t:3},
{id:'c-courgette-houmous', n:'B\u00e2tonnets de courgette, houmous', cat:'collation', ing:[{id:'courgette',g:150},{id:'houmous',g:80}], steps:'1. Couper la courgette en bâtonnets, tremper dans le houmous.', t:5},
{id:'c-boule-energie-dattes', n:'Boules d\u2019\u00e9nergie dattes-amandes', cat:'collation', ing:[{id:'dattes',g:60},{id:'amandes',g:30},{id:'cacao',g:8}], steps:'1. Mixer les dattes dénoyautées avec les amandes et le cacao jusqu’à pâte homogène qui se tient.\n2. Former des boules à la main, réserver au frigo pour qu’elles raffermissent.', t:10},
{id:'c-fromagefrais-radis', n:'Fromage frais, radis', cat:'collation', ing:[{id:'fromagefrais',g:60},{id:'radis',g:100}], steps:'1. Tremper les radis entiers dans le fromage frais.', t:3},
{id:'c-skyr-granola-banane', n:'Skyr, granola, banane', cat:'collation', ing:[{id:'skyr',g:180},{id:'granola',g:25},{id:'banane',g:80}], steps:'1. Mélanger le skyr avec la banane coupée, parsemer de granola juste avant de servir.', t:4},
{id:'c-oeuf-mimosa', n:'Œuf mimosa l\u00e9ger', cat:'collation', ing:[{id:'oeuf',g:110},{id:'fromageblanc0',g:30}], steps:'1. Cuire l’œuf dur 9-10 min, refroidir à l’eau froide, couper en deux.\n2. Mélanger le jaune avec le fromage blanc jusqu’à texture lisse, remplir les blancs.', t:12},
{id:'c-biscuits-fromageblanc', n:'Biscuits secs, fromage blanc', cat:'collation', ing:[{id:'biscuits-secs',g:30},{id:'fromageblanc0',g:150}], steps:'1. À consommer ensemble, ou tremper les biscuits dans le fromage blanc.', t:2},
{id:'c-thon-biscottes', n:'Thon, biscottes', cat:'collation', ing:[{id:'thon-boite',g:100},{id:'pain-complet',g:40}], steps:'1. Étaler le thon égoutté sur les biscottes ou tartines grillées.', t:3},
{id:'c-compote-amandes', n:'Compote, amandes', cat:'collation', ing:[{id:'compote',g:120},{id:'amandes',g:15}], steps:'1. À consommer ensemble.', t:2},

// --- DESSERTS PROTÉINÉS ---
{id:'d-pancakes-proteines', n:'Pancakes protéinés', cat:'dessert', ing:[{id:'avoine',g:50},{id:'oeuf',g:110},{id:'banane',g:80},{id:'whey-hsn',g:0.5}], steps:'1. Mixer tous les ingrédients jusqu’à pâte lisse.\n2. Cuire par petites louches 2 min de chaque côté à feu moyen, retourner dès que des bulles apparaissent en surface.', t:8},
{id:'d-mugcake', n:'Mug cake protéiné cacao', cat:'dessert', ing:[{id:'avoine',g:40},{id:'oeuf',g:55},{id:'cacao',g:10},{id:'whey-hsn',g:0.5},{id:'lait-demi',g:60}], steps:'1. M\u00e9langer tous les ingr\u00e9dients directement dans le mug \u00e0 la fourchette, jusqu\u2019\u00e0 p\u00e2te sans grumeaux.\n2. Micro-ondes \u00e0 pleine puissance par s\u00e9quences de 30 sec en v\u00e9rifiant entre chaque \u2014 \u00e7a monte vite et peut d\u00e9border ou s\u00e9cher si on laisse tourner d\u2019un coup.\n3. Compter 1min30 \u00e0 2 min au total selon la puissance du four. Il est pr\u00eat quand le dessus est pris mais encore moelleux au toucher (un cure-dent doit ressortir avec quelques miettes humides, pas sec).\n4. Laisser reposer 1 min avant de manger \u2014 il continue de cuire l\u00e9g\u00e8rement en sortant.', t:6},
{id:'d-skyr-chocolat', n:'Skyr, cacao, miel', cat:'dessert', ing:[{id:'skyr',g:200},{id:'cacao',g:8},{id:'miel',g:10}], steps:'1. Mélanger le cacao et le miel directement dans le skyr jusqu’à dissolution complète.', t:8},
{id:'d-compote-fromageblanc', n:'Fromage blanc, compote, chocolat noir', cat:'dessert', ing:[{id:'fromageblanc0',g:150},{id:'compote',g:100},{id:'chocolatnoir',g:10}], steps:'1. Superposer fromage blanc et compote, râper le chocolat noir par-dessus juste avant de servir.', t:8},
{id:'d-yaourt-chocolat-noisette', n:'Yaourt grec, pâte à tartiner', cat:'dessert', ing:[{id:'yaourtgrec',g:150},{id:'nutella',g:15}], steps:'1. Faire fondre légèrement la pâte à tartiner (quelques secondes micro-ondes) pour qu’elle s’étale mieux.\n2. La marbrer dans le yaourt sans trop mélanger, pour un effet marbré.', t:6},
{id:'d-glace-protein-banane', n:'Nice cream banane (banane glacée mixée)', cat:'dessert', ing:[{id:'banane',g:200},{id:'lait-demi',g:40}], steps:'1. Congeler la banane coupée en rondelles au moins 3h (étalée sur une plaque pour qu’elle ne colle pas en bloc).\n2. Mixer avec le lait jusqu’à texture glace onctueuse — racler les bords du bol si besoin pour bien tout incorporer.', t:8},
{id:'d-cookie-proteine', n:'Cookie protéiné maison (avoine, whey)', cat:'dessert', ing:[{id:'avoine',g:40},{id:'whey-hsn',g:1},{id:'beurrecacahuete',g:15},{id:'miel',g:10}], steps:'1. Mélanger tous les ingrédients en pâte homogène, former des cookies pas trop épais (ils cuisent mieux).\n2. Four 10-12 min à 180°C — les sortir encore un peu mous au centre, ils durcissent en refroidissant.', t:20},
{id:'d-chocolat-amandes', n:'Carré de chocolat noir, amandes', cat:'dessert', ing:[{id:'chocolatnoir',g:20},{id:'amandes',g:15}], steps:'1. À consommer tel quel.', t:8},
{id:'d-tiramisu-leger', n:'Tiramisu l\u00e9ger', cat:'dessert', ing:[{id:'mascarpone',g:80},{id:'boudoirs',g:40},{id:'cafe-expresso',g:60},{id:'cacao',g:5}], steps:'1. Pr\u00e9parer le caf\u00e9 et le laisser tiédir \u2014 trop chaud, il d\u00e9trempe les boudoirs.\n2. Tremper chaque boudoir 1 seconde par face seulement (pas plus, sinon il devient p\u00e2teux et s\u2019effondre), les disposer au fond du plat.\n3. Lisser le mascarpone \u00e0 la fourchette pour qu\u2019il s\u2019\u00e9tale facilement, \u00e9taler une couche sur les boudoirs.\n4. R\u00e9p\u00e9ter (boudoirs tremp\u00e9s, mascarpone) selon la taille du plat, finir par une couche de mascarpone.\n5. Saupoudrer de cacao juste avant de servir (pas avant, il s\u2019humidifie sinon). Frigo au moins 2h, id\u00e9alement une nuit pour que les saveurs se lient.', t:15},
{id:'d-cheesecake-proteine', n:'Cheesecake prot\u00e9in\u00e9', cat:'dessert', ing:[{id:'fromagefrais',g:200},{id:'biscuits-secs',g:40},{id:'oeuf',g:55},{id:'sucre',g:15}], steps:'1. \u00c9craser finement les biscuits (sachet + rouleau \u00e0 p\u00e2tisserie, ou mixeur), tasser au fond d\u2019un moule avec le dos d\u2019une cuill\u00e8re.\n2. M\u00e9langer le fromage frais, l\u2019œuf et le sucre au fouet jusqu\u2019\u00e0 texture lisse sans grumeaux \u2014 ne pas trop battre pour \u00e9viter d\u2019incorporer de l\u2019air (\u00e7a ferait craqueler en refroidissant).\n3. Verser sur le fond de biscuits, four 25-30 min \u00e0 160\u00b0C (basse temp\u00e9rature = cuisson douce, essentiel pour la texture).\n4. Il est cuit quand les bords sont pris mais que le centre tremble encore l\u00e9g\u00e8rement quand on secoue le moule \u2014 il finira de prendre en refroidissant.\n5. Laisser refroidir compl\u00e8tement \u00e0 temp\u00e9rature ambiante avant de mettre au frigo au moins 2h. Ne jamais d\u00e9mouler chaud.', t:40},
{id:'d-crumble-pommes', n:'Crumble aux pommes', cat:'dessert', ing:[{id:'pomme',g:200},{id:'farine',g:50},{id:'beurre',g:30},{id:'sucre',g:20}], steps:'1. Couper les pommes en d\u00e9s, les r\u00e9partir dans un plat \u00e0 gratin (ajouter un peu de cannelle si dispo).\n2. Sortir le beurre du frigo juste avant usage \u2014 il doit rester froid pour un crumble qui croustille.\n3. M\u00e9langer farine, beurre en d\u00e9s et sucre du bout des doigts, en frottant rapidement, jusqu\u2019\u00e0 obtenir un sable grossier avec de petits morceaux (ne pas chercher une p\u00e2te lisse).\n4. R\u00e9partir cette pâte sabl\u00e9e sur les pommes sans tasser \u2014 l\u2019air entre les morceaux est ce qui rend le dessus croustillant.\n5. Four 25-30 min \u00e0 180\u00b0C jusqu\u2019\u00e0 ce que le dessus soit dor\u00e9 et les pommes bouillonnent sur les bords.', t:35},
{id:'d-riz-au-lait', n:'Riz au lait', cat:'dessert', ing:[{id:'riz-blanc-cru',g:60},{id:'lait-demi',g:300},{id:'sucre',g:20}], steps:'1. Porter le lait \u00e0 fr\u00e9missement avec le sucre (pas \u00e0 gros bouillon, \u00e7a attacherait).\n2. Ajouter le riz cru, baisser \u00e0 feu tr\u00e8s doux.\n3. Cuire 25-30 min en remuant toutes les 3-4 min pour \u00e9viter que \u00e7a accroche au fond \u2014 le riz doit rester \u00e0 peine fr\u00e9missant, jamais bouillir fort.\n4. Il est pr\u00eat quand les grains sont fondants et le liquide a \u00e9pais devient cr\u00e9meux (il \u00e9paissira encore un peu en refroidissant).\n5. Servir ti\u00e8de ou froid, avec une touche de cannelle ou vanille si dispo.', t:35},
{id:'d-brownie-proteine', n:'Brownie prot\u00e9in\u00e9', cat:'dessert', ing:[{id:'chocolatnoir',g:40},{id:'oeuf',g:110},{id:'whey-hsn',g:1},{id:'beurrecacahuete',g:20}], steps:'1. Faire fondre le chocolat au bain-marie ou par courtes s\u00e9quences de 20 sec au micro-ondes, en remuant entre chaque \u2014 il br\u00fble vite s\u2019il est laiss\u00e9 trop longtemps.\n2. Laisser tiédir 1-2 min (sinon il cuit les œufs au contact).\n3. M\u00e9langer avec les œufs battus, la whey et le beurre de cacahu\u00e8te jusqu\u2019\u00e0 p\u00e2te homog\u00e8ne.\n4. Verser dans un petit moule beurr\u00e9, four 15-18 min \u00e0 170\u00b0C.\n5. Un brownie r\u00e9ussi reste fondant au centre \u2014 un cure-dent plant\u00e9 doit ressortir avec quelques miettes humides, pas sec. Le sortir un peu avant si en doute, il continue \u00e0 cuire en refroidissant.', t:22},
{id:'d-pannacotta-legere', n:'Panna cotta l\u00e9g\u00e8re', cat:'dessert', ing:[{id:'cremelegere',g:150},{id:'lait-demi',g:80},{id:'sucre',g:20}], steps:'1. Faire ramollir la g\u00e9latine (2 feuilles) dans l\u2019eau froide 5 min.\n2. Chauffer cr\u00e8me, lait et sucre \u00e0 feu doux jusqu\u2019\u00e0 juste avant l\u2019\u00e9bullition (des petites bulles sur les bords, pas un bouillon) \u2014 bouillir ferait tourner la cr\u00e8me.\n3. Retirer du feu, essorer la g\u00e9latine et l\u2019incorporer en fouettant jusqu\u2019\u00e0 dissolution compl\u00e8te.\n4. Verser dans des ramequins, laisser tiédir 10 min \u00e0 temp\u00e9rature ambiante avant de mettre au frigo.\n5. Frigo au moins 3-4h, id\u00e9alement une nuit \u2014 la prise est plus lente qu\u2019on ne pense. V\u00e9rifier en inclinant l\u00e9g\u00e8rement le ramequin.', t:15},
{id:'d-salade-fruits', n:'Salade de fruits frais', cat:'dessert', ing:[{id:'pomme',g:100},{id:'orange',g:100},{id:'kiwi',g:80},{id:'raisin',g:80}], steps:'1. Couper tous les fruits en morceaux réguliers, mélanger juste avant de servir pour éviter que les fruits les plus fragiles (banane, kiwi) ne s’oxydent.', t:8},
{id:'d-flan', n:'Flan p\u00e2tissier', cat:'dessert', ing:[{id:'oeuf',g:165},{id:'lait-entier',g:300},{id:'sucre',g:40},{id:'farine',g:30}], steps:'1. Fouetter les œufs avec le sucre jusqu\u2019\u00e0 blanchiment l\u00e9ger, ajouter la farine en pluie pour \u00e9viter les grumeaux.\n2. Faire chauffer le lait presque \u00e0 \u00e9bullition, puis le verser en filet sur le m\u00e9lange œufs-sucre-farine tout en fouettant sans arr\u00eater (verser trop vite ou trop chaud cuirait les œufs en grumeaux).\n3. Reverser le tout dans la casserole, chauffer \u00e0 feu doux 2-3 min en remuant jusqu\u2019\u00e0 l\u00e9ger \u00e9paississement (\u00e7a finira de cuire au four).\n4. Verser dans un moule beurr\u00e9, four 35-40 min \u00e0 180\u00b0C jusqu\u2019\u00e0 ce que le dessus soit dor\u00e9 et le centre encore l\u00e9g\u00e8rement tremblotant.\n5. Laisser refroidir compl\u00e8tement (le flan continue de se raffermir en refroidissant) avant de d\u00e9mouler et de mettre au frigo.', t:50},
