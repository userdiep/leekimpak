<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F3F2EE; --text:#181917; --text-dim:#8B8A83;
  --accent:#2E4A34; --accent-soft:#E7ECE4; --protein:#9C6B32; --protein-soft:#F2E9DA;
  --danger:#AE4B3E; --danger-soft:#F5E7E4; --line:#E5E3DC; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:82px; min-height:100vh;}
h1,h2,h3{font-family:'Fraunces',serif; font-weight:500; margin:0; letter-spacing:-0.01em;}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums;}
.wrap{max-width:560px; margin:0 auto; padding:0 18px;}
a{color:inherit;}
svg{width:1em; height:1em; display:block; flex-shrink:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* header */
.topbar{padding:22px 0 14px;}
.topbar .date{color:var(--text-dim); font-size:13px; margin-bottom:2px;}
.topbar h1{font-size:26px;}

/* dashboard */
.metric-row{display:flex; gap:12px; margin:18px 0;}
.metric{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:16px 16px 14px;}
.metric .label{color:var(--text-dim); font-size:12px; text-transform:none; margin-bottom:8px;}
.metric .value{font-size:22px; font-weight:600;}
.metric .value .sub{font-size:13px; color:var(--text-dim); font-weight:400;}
.bar-track{height:5px; background:var(--surface2); border-radius:3px; margin-top:10px; overflow:hidden; position:relative;}
.bar-fill{height:100%; border-radius:3px; transition:width .3s ease;}
.bar-fill.kcal{background:var(--accent);}
.bar-fill.prot{background:var(--protein);}
.bar-fill.over{background:var(--danger);}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px;}
.section-title h2{font-size:16px; font-weight:500;}
.section-title .hint{font-size:12px; color:var(--text-dim);}

.weekbars{display:flex; gap:6px; align-items:flex-end; height:64px; margin:8px 0 4px;}
.weekbars .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%;}
.weekbars .stick{width:100%; max-width:22px; border-radius:2px 2px 1px 1px; background:var(--surface2); position:relative;}
.weekbars .stick .fill{position:absolute; bottom:0; left:0; right:0; border-radius:2px 2px 1px 1px; background:var(--accent);}
.weekbars .day{font-size:10px; color:var(--text-dim);}

.entry{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);}
.entry:last-child{border-bottom:none;}
.entry .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.entry .dot.recipe{background:var(--accent);}
.entry .dot.ingredient{background:var(--protein);}
.entry .dot.supplement{background:#7C6A93;}
.entry .dot.custom{background:var(--text-dim);}
.entry .info{flex:1; min-width:0;}
.entry .info .name{font-size:14.5px; font-weight:500;}
.entry .info .qty{font-size:12px; color:var(--text-dim); margin-top:1px;}
.entry .macros{text-align:right; font-size:12.5px; color:var(--text-dim); flex-shrink:0;}
.entry .macros .kc{color:var(--text); font-weight:600;}
.entry .del{color:var(--text-dim); background:none; border:none; padding:4px 0 4px 10px; font-size:18px; line-height:1;}
.empty{color:var(--text-dim); font-size:13.5px; padding:20px 0; text-align:center;}

.fab-row{display:flex; gap:10px; margin-top:14px;}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:2px; padding:13px 16px; font-size:14.5px; font-weight:500; text-align:center; flex:1;}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
.btn.ghost{background:none; border-color:transparent;}
.btn.danger{color:var(--danger); border-color:var(--line);}
.btn.small{padding:9px 12px; font-size:13px; flex:none;}
.btn.full{width:100%;}

/* tab bar */
.tabbar{position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.94); backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
.tabbar button{flex:1; background:none; border:none; color:var(--text-dim); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0;}
.tabbar button.active{color:var(--accent);}
.tabbar svg{width:21px; height:21px;}

/* recipe library */
.searchbar{display:flex; gap:8px; margin:16px 0 6px;}
.searchbar input{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:11px 14px; color:var(--text); font-size:14.5px;}
.searchbar input::placeholder{color:var(--text-dim);}
.chiprow{display:flex; gap:7px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; background:none; border:1px solid var(--line); color:var(--text-dim); padding:7px 13px; border-radius:100px; font-size:13px; white-space:nowrap;}
.chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

.recipe-card{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); gap:10px;}
.recipe-card .name{font-size:15px; font-weight:500;}
.recipe-card .tag{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
.recipe-card .m{text-align:right; font-size:12px; color:var(--text-dim); flex-shrink:0;}
.recipe-card .m .kc{font-size:14.5px; color:var(--accent); font-weight:600; display:block;}

/* detail / editor sheets */
.sheet-header{display:flex; align-items:center; justify-content:space-between; padding:18px 0 6px;}
.sheet-header .back{color:var(--text-dim); font-size:14px; background:none; border:none; padding:6px 0;}
.field{margin:16px 0;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px;}
.field input, .field select{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:12px 14px; color:var(--text); font-size:15px;}
.ing-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.ing-row .n{flex:1; font-size:14.5px;}
.ing-row .g{width:64px; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:8px 8px; color:var(--text); font-size:14px; text-align:center;}
.ing-row .u{font-size:12px; color:var(--text-dim); width:16px;}
.ing-row .rm{color:var(--text-dim); background:none; border:none; font-size:17px; padding:4px 2px;}
.macro-preview{display:flex; gap:10px; background:var(--surface2); border-radius:2px; padding:16px; margin:14px 0;}
.macro-preview .m{flex:1; text-align:center;}
.macro-preview .m .v{font-size:17px; font-weight:600;}
.macro-preview .m .l{font-size:10.5px; color:var(--text-dim); margin-top:2px;}
.autocomplete{position:relative;}
.ac-list{position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:2px; max-height:230px; overflow-y:auto; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.06);}
.ac-item{padding:11px 14px; font-size:14px; border-bottom:1px solid var(--line);}
.ac-item:last-child{border-bottom:none;}
.ac-item .k{color:var(--text-dim); font-size:11.5px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(20,20,18,.4); z-index:40; display:flex; align-items:flex-end;}
.modal{background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:4px 18px 24px; border-top:1px solid var(--line);}
.modal-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:10px auto 4px;}

.settings-row{display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid var(--line);}
.settings-row .l{font-size:14.5px;}
.settings-row .l .s{display:block; font-size:12px; color:var(--text-dim); margin-top:2px;}
.settings-row input[type=number]{width:84px; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:9px 10px; color:var(--text); text-align:right; font-size:15px;}

.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:32px; height:32px; border-radius:50%; background:var(--surface2); border:1px solid var(--line); color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center;}
.stepper .v{min-width:44px; text-align:center; font-size:15px; font-weight:600;}

.toast{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:11px 18px; border-radius:100px; font-size:13.5px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.time-badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--text-dim);}
.time-badge svg{width:12px; height:12px;}
.person-pills{display:flex; gap:8px; margin:10px 0;}
.person-pill{flex:1; border:1px solid var(--line); border-radius:100px; padding:9px 10px; text-align:center; font-size:13.5px; color:var(--text-dim); background:none;}
.person-pill.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}
.person-switch{display:flex; gap:6px; margin-bottom:4px;}
.person-switch button{flex:1; padding:8px 10px; border-radius:100px; border:1px solid var(--line); background:none; color:var(--text-dim); font-size:13px;}
.person-switch button.active{background:var(--text); color:#fff; border-color:var(--text);}
.roulette-wheel{text-align:center; padding:30px 10px; font-family:'Fraunces',serif; font-size:22px; min-height:100px; display:flex; align-items:center; justify-content:center;}
</style>
</head>

{id:'d-cheesecake-proteine', n:'Cheesecake prot\u00e9in\u00e9', cat:'dessert', ing:[{id:'fromagefrais',g:200},{id:'biscuits-secs',g:40},{id:'oeuf',g:55},{id:'sucre',g:15}], steps:'\u00c9craser les biscuits pour le fond. M\u00e9langer fromage frais, œuf et sucre, verser dessus. Four 25-30 min \u00e0 160\u00b0C, laisser refroidir avant de servir.', t:40},
{id:'d-crumble-pommes', n:'Crumble aux pommes', cat:'dessert', ing:[{id:'pomme',g:200},{id:'farine',g:50},{id:'beurre',g:30},{id:'sucre',g:20}], steps:'Couper les pommes en d\u00e9s dans un plat. M\u00e9langer farine, beurre et sucre du bout des doigts en sable grossier, r\u00e9partir dessus. Four 25-30 min \u00e0 180\u00b0C.', t:35},
{id:'d-riz-au-lait', n:'Riz au lait', cat:'dessert', ing:[{id:'riz-blanc-cru',g:60},{id:'lait-demi',g:300},{id:'sucre',g:20}], steps:'Cuire le riz dans le lait sucr\u00e9 \u00e0 feu doux 25-30 min en remuant r\u00e9guli\u00e8rement jusqu\u2019\u00e0 texture cr\u00e9meuse.', t:35},
{id:'d-brownie-proteine', n:'Brownie prot\u00e9in\u00e9', cat:'dessert', ing:[{id:'chocolatnoir',g:40},{id:'oeuf',g:110},{id:'whey-hsn',g:1},{id:'beurrecacahuete',g:20}], steps:'Faire fondre le chocolat. M\u00e9langer avec les œufs, la whey et le beurre de cacahu\u00e8te. Four 15-18 min \u00e0 170\u00b0C dans un petit moule.', t:22},
{id:'d-pannacotta-legere', n:'Panna cotta l\u00e9g\u00e8re', cat:'dessert', ing:[{id:'cremelegere',g:150},{id:'lait-demi',g:80},{id:'sucre',g:20}], steps:'Chauffer cr\u00e8me, lait et sucre sans bouillir. Ajouter de la g\u00e9latine (non compt\u00e9e), verser dans des ramequins, frigo au moins 3h.', t:15},
{id:'d-salade-fruits', n:'Salade de fruits frais', cat:'dessert', ing:[{id:'pomme',g:100},{id:'orange',g:100},{id:'kiwi',g:80},{id:'raisin',g:80}], steps:'Couper tous les fruits en morceaux, m\u00e9langer.', t:8},
{id:'d-flan', n:'Flan p\u00e2tissier', cat:'dessert', ing:[{id:'oeuf',g:165},{id:'lait-entier',g:300},{id:'sucre',g:40},{id:'farine',g:30}], steps:'M\u00e9langer œufs, sucre et farine, d\u00e9layer avec le lait chaud. Verser dans un moule, four 35-40 min \u00e0 180\u00b0C. Laisser refroidir.', t:50},
{id:'d-tarte-pommes', n:'Tarte aux pommes (part)', cat:'dessert', ing:[{id:'pate-brisee-crue',g:100},{id:'pomme',g:200},{id:'sucre',g:20}], steps:'Foncer un moule avec la p\u00e2te, disposer les pommes en lamelles, saupoudrer de sucre. Four 30-35 min \u00e0 190\u00b0C.', t:45},
{id:'d-mousse-chocolat-legere', n:'Mousse au chocolat l\u00e9g\u00e8re', cat:'dessert', ing:[{id:'chocolatnoir',g:40},{id:'blanc-oeuf',g:120},{id:'sucre',g:10}], steps:'Faire fondre le chocolat. Monter les blancs en neige avec le sucre, incorporer d\u00e9licatement au chocolat fondu. Frigo au moins 2h.', t:20},
{id:'d-clafoutis-cerises', n:'Clafoutis aux cerises', cat:'dessert', ing:[{id:'cerises',g:200},{id:'oeuf',g:110},{id:'farine',g:40},{id:'lait-demi',g:150},{id:'sucre',g:25}], steps:'Disposer les cerises dans un plat beurr\u00e9. M\u00e9langer œufs, farine, lait et sucre, verser dessus. Four 30-35 min \u00e0 180\u00b0C.', t:45},
{id:'d-bananabread', n:'Banana bread (part)', cat:'dessert', ing:[{id:'banane',g:200},{id:'farine',g:100},{id:'oeuf',g:55},{id:'sucre',g:30},{id:'beurre',g:30}], steps:'\u00c9craser les bananes, m\u00e9langer avec les autres ingr\u00e9dients. Verser dans un moule \u00e0 cake, four 40-45 min \u00e0 180\u00b0C.', t:55},
{id:'d-yaourt-glace-maison', n:'Yaourt glac\u00e9 maison', cat:'dessert', ing:[{id:'yaourtgrec',g:200},{id:'miel',g:20},{id:'fraises',g:80}], steps:'Mixer le yaourt avec le miel et les fraises, verser dans un bac et placer au cong\u00e9lateur au moins 4h en remuant une fois \u00e0 mi-prise.', t:15},
{id:'d-sorbet-mangue', n:'Sorbet mangue maison', cat:'dessert', ing:[{id:'mangue',g:250},{id:'sucre',g:20},{id:'citron',g:10}], steps:'Mixer la mangue avec le sucre et le jus de citron. Verser dans un bac, cong\u00e9lateur au moins 4h en remuant \u00e0 mi-prise.', t:10},
{id:'d-muffin-chocolat', n:'Muffin au chocolat', cat:'dessert', ing:[{id:'farine',g:60},{id:'oeuf',g:55},{id:'chocolatnoir',g:30},{id:'sucre',g:25},{id:'beurre',g:20}], steps:'M\u00e9langer tous les ingr\u00e9dients, verser dans un moule \u00e0 muffin. Four 18-20 min \u00e0 180\u00b0C.', t:28},

// --- ITALIEN ---
{id:'r-lasagnes', n:'Lasagnes bolognaise maison', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:180},{id:'coulistomate',g:200},{id:'pates-lasagne-crues',g:120},{id:'bechamel',g:150},{id:'emmental',g:60}], steps:'Pr\u00e9parer la bolognaise (bœuf hach\u00e9 revenu, coulis de tomate, mijoter 15 min). Monter en couches dans un plat : p\u00e2tes, bolognaise, b\u00e9chamel, r\u00e9p\u00e9ter, finir par le fromage. Four 35-40 min \u00e0 200\u00b0C.', t:55},
{id:'r-spaghetti-carbonara', n:'Spaghetti carbonara', cat:'dejeuner', ing:[{id:'pates-cuites',g:250},{id:'lardons',g:100},{id:'oeuf',g:110},{id:'parmesan',g:30}], steps:'Cuire les p\u00e2tes. Faire dorer les lardons \u00e0 sec. Hors du feu, m\u00e9langer les p\u00e2tes chaudes avec les œufs battus, le parmesan et les lardons \u2014 la chaleur des p\u00e2tes cuit la sauce sans faire d\u2019œuf brouill\u00e9. Poivrer g\u00e9n\u00e9reusement.', t:20},
{id:'r-spaghetti-bolognaise', n:'Spaghetti bolognaise', cat:'dejeuner', ing:[{id:'pates-cuites',g:250},{id:'boeuf-hache15',g:170},{id:'coulistomate',g:180},{id:'oignon',g:50},{id:'parmesan',g:15}], steps:'Faire revenir l\u2019oignon puis le bœuf hach\u00e9, ajouter le coulis de tomate, mijoter 20 min. Servir sur les spaghetti avec le parmesan.', t:30},
{id:'r-risotto-poulet', n:'Risotto au poulet', cat:'dejeuner', ing:[{id:'riz-blanc-cru',g:90},{id:'poulet-cru',g:150},{id:'parmesan',g:20},{id:'oignon',g:40},{id:'beurre',g:10}], steps:'Faire revenir l\u2019oignon et le riz cru 2 min. Ajouter du bouillon louche par louche en remuant 18-20 min jusqu\u2019\u00e0 cuisson cr\u00e9meuse. Ajouter le poulet poêl\u00e9 \u00e0 part, le parmesan et le beurre en fin de cuisson.', t:35},
{id:'r-risotto-champignons', n:'Risotto aux champignons', cat:'dejeuner', ing:[{id:'riz-blanc-cru',g:90},{id:'champignons-cuits',g:150},{id:'parmesan',g:25},{id:'oignon',g:40},{id:'beurre',g:10}], steps:'Faire revenir l\u2019oignon et le riz cru 2 min. Ajouter du bouillon louche par louche 18-20 min en remuant. Ajouter les champignons, le parmesan et le beurre en fin de cuisson.', t:30},
{id:'r-pizza-maison', n:'Pizza maison jambon-fromage', cat:'dejeuner', ing:[{id:'pate-pizza-crue',g:200},{id:'coulistomate',g:80},{id:'mozzarella',g:100},{id:'jambonblanc',g:60}], steps:'\u00c9taler la p\u00e2te, tartiner de coulis de tomate. Garnir de mozzarella et de jambon. Four 10-12 min \u00e0 220-250\u00b0C.', t:25},
{id:'r-gnocchis-tomate-parmesan', n:'Gnocchis, sauce tomate, parmesan', cat:'dejeuner', ing:[{id:'gnocchis-crus',g:300},{id:'coulistomate',g:150},{id:'parmesan',g:20},{id:'huile-olive',g:6}], steps:'Cuire les gnocchis 2-3 min dans l\u2019eau bouillante jusqu\u2019\u00e0 ce qu\u2019ils remontent. Chauffer le coulis de tomate, m\u00e9langer, parsemer de parmesan.', t:15},
{id:'r-penne-arrabbiata', n:'Penne all\u2019arrabbiata', cat:'dejeuner', ing:[{id:'pates-cuites',g:250},{id:'coulistomate',g:180},{id:'ail',g:8},{id:'huile-olive',g:10},{id:'parmesan',g:15}], steps:'Faire revenir l\u2019ail dans l\u2019huile avec du piment, ajouter le coulis de tomate, mijoter 10 min. M\u00e9langer avec les p\u00e2tes, parsemer de parmesan.', t:20},

// --- JAPONAIS / ASIATIQUE ---
{id:'r-chirashi-saumon', n:'Chirashi saumon', cat:'dejeuner', ing:[{id:'riz-sushi-cuit',g:250},{id:'saumon-cru',g:150},{id:'avocat',g:60},{id:'gari',g:15},{id:'saucesoja',g:15}], steps:'Napper le riz \u00e0 sushi de tranches fines de saumon cru et d\u2019avocat. Servir avec le gari et la sauce soja \u00e0 part pour tremper.', t:15},
{id:'r-sushi-bowl-thon', n:'Sushi bowl thon', cat:'dejeuner', ing:[{id:'riz-sushi-cuit',g:220},{id:'thon-cru',g:150},{id:'avocat',g:60},{id:'algue-nori',g:5},{id:'saucesoja',g:15}], steps:'Couper le thon cru en d\u00e9s, dresser sur le riz avec l\u2019avocat, \u00e9mietter l\u2019algue nori dessus. Arroser de sauce soja.', t:12},
{id:'r-poke-bowl-saumon', n:'Poke bowl saumon', cat:'dejeuner', ing:[{id:'saumon-cru',g:150},{id:'riz-sushi-cuit',g:220},{id:'avocat',g:60},{id:'petitspois',g:50},{id:'saucesoja',g:15}], steps:'Couper le saumon cru en d\u00e9s, mariner rapidement dans la sauce soja. Dresser sur le riz avec avocat et petits pois.', t:15},
{id:'r-ramen-poulet', n:'Ramen au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'nouilles-udon-cuites',g:200},{id:'oeuf',g:55},{id:'saucesoja',g:20},{id:'champignons-cuits',g:80}], steps:'Poêler le poulet en lamelles. Pr\u00e9parer un bouillon avec la sauce soja et les champignons, y plonger les nouilles 2-3 min. Ajouter le poulet et un œuf mollet en topping.', t:25},
{id:'r-padthai-poulet', n:'Pad tha\u00ef au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'nouilles-chinoises-cuites',g:200},{id:'oeuf',g:55},{id:'cacahuetes',g:20},{id:'saucesoja',g:15}], steps:'Poêler le poulet en lamelles, pousser sur le c\u00f4t\u00e9, casser l\u2019œuf dans la poêle et brouiller. Ajouter les nouilles et la sauce soja, m\u00e9langer 3-4 min. Parsemer de cacahu\u00e8tes concass\u00e9es.', t:20},
{id:'r-boeuf-nouilles-sautees', n:'Nouilles saut\u00e9es au bœuf', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:150},{id:'nouilles-chinoises-cuites',g:200},{id:'poivron',g:80},{id:'huile-sesame',g:8},{id:'saucesoja',g:20}], steps:'Faire saut\u00e9r le bœuf en lamelles \u00e0 feu vif 2-3 min, r\u00e9server. Saisir le poivron, ajouter les nouilles et la sauce soja, remettre le bœuf, m\u00e9langer 2 min.', t:18},
{id:'r-curry-vert-poulet', n:'Curry vert tha\u00ef au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'pate-curry-verte',g:30},{id:'lait-coco',g:150},{id:'riz-basmati-cuit',g:200},{id:'poivron',g:80}], steps:'Faire revenir la p\u00e2te de curry 1 min, ajouter le poulet en morceaux, saisir. Verser le lait de coco et le poivron, mijoter 12-15 min. Servir sur le riz.', t:25},

// --- FRANÇAIS ---
{id:'r-hachis-parmentier', n:'Hachis parmentier', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:180},{id:'pdt-cuite',g:300},{id:'lait-demi',g:40},{id:'emmental',g:30}], steps:'Faire revenir le bœuf hach\u00e9. \u00c9craser les pommes de terre en pur\u00e9e avec le lait. Monter en couches (viande puis pur\u00e9e) dans un plat, parsemer de fromage. Four 20 min \u00e0 200\u00b0C (gratiner en fin de cuisson).', t:40},
{id:'r-blanquette-veau', n:'Blanquette de veau, riz', cat:'dejeuner', ing:[{id:'veau-escalope-crue',g:180},{id:'carotte',g:100},{id:'cremelegere',g:60},{id:'riz-basmati-cuit',g:180}], steps:'Faire mijoter le veau en morceaux avec les carottes dans un bouillon 40-45 min. Lier avec la cr\u00e8me en fin de cuisson. Servir avec le riz.', t:55},
{id:'r-pot-au-feu', n:'Pot-au-feu', cat:'dejeuner', ing:[{id:'boeuf-rumsteck-cru',g:200},{id:'carotte',g:150},{id:'poireau',g:100},{id:'pdt-cuite',g:200}], steps:'Faire mijoter le bœuf dans un grand volume d\u2019eau avec les l\u00e9gumes 2h \u00e0 feu doux, \u00e9cumer r\u00e9guli\u00e8rement. Servir la viande et les l\u00e9gumes avec un peu de bouillon.', t:130},
{id:'r-quiche-lorraine', n:'Quiche lorraine, salade', cat:'dejeuner', ing:[{id:'pate-brisee-crue',g:150},{id:'oeuf',g:165},{id:'lardons',g:100},{id:'cremeepaisse',g:100},{id:'salade',g:50}], steps:'Foncer un moule avec la p\u00e2te. M\u00e9langer œufs, cr\u00e8me et lardons poêl\u00e9s, verser sur la p\u00e2te. Four 30-35 min \u00e0 190\u00b0C. Servir avec la salade.', t:45},
{id:'r-tartiflette', n:'Tartiflette', cat:'dejeuner', ing:[{id:'pdt-cuite',g:300},{id:'lardons',g:100},{id:'oignon',g:60},{id:'cremeepaisse',g:80},{id:'emmental',g:80}], steps:'Faire revenir lardons et oignon. M\u00e9langer avec les pommes de terre en tranches et la cr\u00e8me dans un plat, couvrir de fromage. Four 20-25 min \u00e0 200\u00b0C.', t:40},

// --- MEXICAIN ---
{id:'r-tacos-boeuf', n:'Tacos au bœuf', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:170},{id:'tortilla',g:80},{id:'salade',g:30},{id:'tomate',g:60},{id:'emmental',g:30}], steps:'Faire revenir le bœuf hach\u00e9 avec des \u00e9pices tex-mex 8 min. Garnir les tortillas chaudes avec la viande, salade, tomate et fromage.', t:18},
{id:'r-burrito-bowl-poulet', n:'Burrito bowl poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'riz-blanc-cuit',g:200},{id:'haricotsrouges-cuits',g:120},{id:'avocat',g:60},{id:'tomate',g:80}], steps:'Poêler le poulet en d\u00e9s. Dresser le riz en bol avec le poulet, les haricots rouges, l\u2019avocat et la tomate coup\u00e9e.', t:20},
{id:'r-quesadillas-poulet', n:'Quesadillas poulet, fromage', cat:'dejeuner', ing:[{id:'poulet-cuit',g:130},{id:'tortilla',g:120},{id:'emmental',g:60},{id:'poivron',g:60}], steps:'Garnir une tortilla de poulet effiloch\u00e9, fromage et poivron, refermer avec une seconde tortilla. Cuire 2-3 min de chaque c\u00f4t\u00e9 \u00e0 la po\u00eale jusqu\u2019\u00e0 ce que le fromage fonde.', t:15},

// --- AUTRES ---
{id:'r-couscous-poulet-merguez', n:'Couscous poulet, merguez', cat:'dejeuner', ing:[{id:'poulet-cru',g:120},{id:'merguez-crue',g:100},{id:'semoule-cuite',g:220},{id:'carotte',g:100},{id:'poischiches-cuits',g:100}], steps:'Faire mijoter le poulet, la merguez et les l\u00e9gumes dans un bouillon \u00e9pic\u00e9 25-30 min. Servir sur la semoule avec les pois chiches.', t:40},
{id:'r-paella-poulet-fruitsdemer', n:'Paella poulet, fruits de mer', cat:'dejeuner', ing:[{id:'poulet-cru',g:130},{id:'crevettes-cuites',g:100},{id:'moules-cuites',g:100},{id:'riz-blanc-cru',g:100},{id:'poivron',g:80}], steps:'Faire dorer le poulet, ajouter le riz cru et le poivron, mouiller avec du bouillon safran\u00e9. Cuire 18-20 min sans remuer, ajouter crevettes et moules en fin de cuisson.', t:35},
{id:'r-tzatziki-poulet-grec', n:'Poulet grec, tzatziki, pain pita', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'tzatziki',g:60},{id:'pain-blanc',g:70},{id:'tomate',g:60},{id:'salade',g:30}], steps:'Mariner puis griller le poulet 8-10 min. Garnir le pain pita avec le poulet, le tzatziki, la tomate et la salade.', t:20},

// --- INDIEN ---
{id:'r-poulet-korma', n:'Poulet korma, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'lait-coco',g:100},{id:'yaourtgrec',g:40},{id:'riz-basmati-cuit',g:200},{id:'oignon',g:50}], steps:'Faire revenir l\u2019oignon, ajouter le poulet et saisir. Verser lait de coco et yaourt, mijoter 15-18 min \u00e0 couvert. Servir sur le riz.', t:30},
{id:'r-biryani-poulet', n:'Biryani au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'riz-basmati-cru',g:90},{id:'yaourtgrec',g:50},{id:'oignon',g:60}], steps:'Mariner le poulet dans le yaourt et les \u00e9pices. Faire revenir l\u2019oignon, ajouter le poulet et saisir. Ajouter le riz cru et l\u2019eau, cuire \u00e0 couvert 18-20 min.', t:35},
{id:'r-saag-paneer', n:'Saag paneer (\u00e9pinards, paneer)', cat:'dejeuner', ing:[{id:'paneer',g:150},{id:'epinards',g:250},{id:'cremelegere',g:50},{id:'riz-basmati-cuit',g:180}], steps:'Faire tomber les \u00e9pinards \u00e0 la po\u00eale, mixer grossi\u00e8rement. Ajouter le paneer en d\u00e9s et la cr\u00e8me, chauffer 5 min. Servir sur le riz.', t:20},
{id:'r-chicken-tikka', n:'Chicken tikka, naan', cat:'dejeuner', ing:[{id:'poulet-cru',g:170},{id:'yaourtgrec',g:60},{id:'naan',g:90},{id:'salade',g:30}], steps:'Mariner le poulet dans le yaourt et les \u00e9pices tandoori au moins 20 min. Griller 10-12 min. Servir avec le naan tied\u00e8 et la salade.', t:25},
{id:'r-dahl-epice-paneer', n:'Dahl de lentilles \u00e9pic\u00e9, paneer', cat:'dejeuner', ing:[{id:'lentilles-cuites',g:220},{id:'paneer',g:100},{id:'lait-coco',g:60},{id:'riz-basmati-cuit',g:150}], steps:'Chauffer les lentilles avec le lait de coco et les \u00e9pices 8-10 min. Ajouter le paneer en d\u00e9s en fin de cuisson. Servir sur le riz.', t:20},

// --- CHINOIS ---
{id:'r-poulet-ananas', n:'Poulet \u00e0 l\u2019ananas, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'ananas',g:120},{id:'poivron',g:80},{id:'saucesoja',g:15},{id:'riz-basmati-cuit',g:200}], steps:'Saisir le poulet en morceaux 6-8 min. Ajouter le poivron et l\u2019ananas coup\u00e9s, la sauce soja, saut\u00e9r 5 min. Servir sur le riz.', t:20},
{id:'r-boeuf-huitres', n:'Bœuf sauce aux hu\u00eetres, br\u00f4coli', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:150},{id:'brocoli',g:150},{id:'saucesoja',g:15},{id:'riz-basmati-cuit',g:180}], steps:'Saisir le bœuf en lamelles \u00e0 feu vif 2-3 min, r\u00e9server. Faire sauter le brocoli, remettre le bœuf avec la sauce soja. Servir sur le riz.', t:18},
{id:'r-porc-caramel', n:'Porc au caramel (asiatique), riz', cat:'dejeuner', ing:[{id:'porc-filet',g:170},{id:'saucesoja',g:20},{id:'miel',g:15},{id:'riz-basmati-cuit',g:200}], steps:'Faire dorer le porc en cubes. Ajouter sauce soja et miel, laisser caram\u00e9liser \u00e0 feu doux 10 min en remuant. Servir sur le riz.', t:25},
{id:'r-riz-cantonais-classique', n:'Riz cantonais classique', cat:'dejeuner', ing:[{id:'riz-basmati-cuit',g:250},{id:'jambonblanc',g:80},{id:'oeuf',g:55},{id:'petitspois',g:60},{id:'saucesoja',g:15}], steps:'Faire cuire l\u2019œuf brouill\u00e9 \u00e0 part. Sauter le riz avec le jambon en d\u00e9s et les petits pois, ajouter l\u2019œuf et la sauce soja.', t:15},

/* ============================= ÉTAT & PERSISTANCE ============================= */
const LS_KEY = 'nutri-app-state-v1';
function defaultState(){
  return {
    people: [{id:'moi', name:'Moi', kcalTarget:1800, proteinTarget:170, weight:null, weightLog:[]}],
    customIngredients: [],
    customSupplements: [],
    customRecipes: [],
    recipeOverrides: {},
    log: []
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const d = defaultState();
      const merged = Object.assign({}, d, parsed);
      if((!parsed.people || parsed.people.length===0) && parsed.settings){
        merged.people = [{id:'moi', name:'Moi', kcalTarget:parsed.settings.kcalTarget||1800, proteinTarget:parsed.settings.proteinTarget||170, weight:parsed.settings.weight||null, weightLog:parsed.settings.weightLog||[]}];
      }
      if(!merged.people || merged.people.length===0) merged.people = d.people;
      const firstId = merged.people[0].id;
      merged.log = (merged.log||[]).map(e => e.person ? e : Object.assign({}, e, {person: firstId}));
      delete merged.settings;
      return merged;
    }
  }catch(e){}
  return defaultState();
}
let STATE = loadState();
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){} }
function getPerson(id){ return STATE.people.find(p=>p.id===id) || STATE.people[0]; }
function activePerson(){ return getPerson(VIEW.activePersonId || STATE.people[0].id); }

/* ============================= HELPERS DE DONNÉES ============================= */
function allIngredients(){ return INGREDIENTS.concat(STATE.customIngredients); }
function allSupplements(){ return SUPPLEMENTS_BASE.concat(STATE.customSupplements); }
function allRecipes(){
  const base = RECIPES.map(r => STATE.recipeOverrides[r.id] ? Object.assign({}, r, STATE.recipeOverrides[r.id], {isOverridden:true}) : r);
  return base.concat(STATE.customRecipes.map(r=>Object.assign({}, r, {isCustom:true})));
}
function findIngredient(id){ return allIngredients().find(i=>i.id===id); }
function findSupplement(id){ return allSupplements().find(i=>i.id===id); }
function findRecipe(id){ return allRecipes().find(i=>i.id===id); }
function isBuiltInRecipe(id){ return RECIPES.some(r=>r.id===id); }

function macrosFromRef(ref){
  const ing = findIngredient(ref.id);
  if(ing){
    const f = ref.g/100;
    return {k:ing.k*f, p:ing.p*f, c:ing.c*f, f:ing.f*f};
  }
  const sup = findSupplement(ref.id);
  if(sup){
    const f = ref.g;
    return {k:sup.k*f, p:sup.p*f, c:sup.c*f, f:sup.f*f};
  }
  return {k:0,p:0,c:0,f:0};
}
function computeRecipeMacros(recipe){
  const tot = {k:0,p:0,c:0,f:0};
  (recipe.ing||[]).forEach(ref=>{
    const m = macrosFromRef(ref);
    tot.k+=m.k; tot.p+=m.p; tot.c+=m.c; tot.f+=m.f;
  });
  return tot;
}
function round(n){ return Math.round(n*10)/10; }
function r0(n){ return Math.round(n); }

/* Macros pour une entrée du journal */
function macrosForEntry(e){
  if(e.kind==='recipe'){
    let m;
    if(e.ingSnapshot){ m = computeRecipeMacros({ing:e.ingSnapshot}); }
    else { const rec = findRecipe(e.refId); if(!rec) return {k:0,p:0,c:0,f:0}; m = computeRecipeMacros(rec); }
    return {k:m.k*e.qty, p:m.p*e.qty, c:m.c*e.qty, f:m.f*e.qty};
  }
  if(e.kind==='ingredient'){
    const ing = findIngredient(e.refId);
    if(!ing) return {k:0,p:0,c:0,f:0};
    const f = e.qty/100;
    return {k:ing.k*f, p:ing.p*f, c:ing.c*f, f:ing.f*f};
  }
  if(e.kind==='supplement'){
    const sup = findSupplement(e.refId);
    if(!sup) return {k:0,p:0,c:0,f:0};
    return {k:sup.k*e.qty, p:sup.p*e.qty, c:sup.c*e.qty, f:sup.f*e.qty};
  }
  if(e.kind==='custom'){
    return {k:(e.macros.k||0)*e.qty, p:(e.macros.p||0)*e.qty, c:(e.macros.c||0)*e.qty, f:(e.macros.f||0)*e.qty};
  }
  return {k:0,p:0,c:0,f:0};
}
function entryLabel(e){
  if(e.kind==='recipe'){ const r=findRecipe(e.refId); return {name: r?r.n:'(recette supprimée)', qty: (e.qty===1?'1 portion':round(e.qty)+' portions')}; }
  if(e.kind==='ingredient'){ const i=findIngredient(e.refId); return {name: i?i.n:'(aliment supprimé)', qty: r0(e.qty)+' g'}; }
  if(e.kind==='supplement'){ const s=findSupplement(e.refId); return {name: s?s.n.split(' — ')[0]:'(complément supprimé)', qty: (e.qty===1?'1 dose':round(e.qty)+' doses')}; }
  if(e.kind==='custom'){ return {name: e.name, qty: 'saisie libre'}; }
  return {name:'?', qty:''};
}
function dotClass(kind){ return kind; }

/* ============================= DATES ============================= */
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
function humanDate(dateStr){
  const t = todayStr(); const y = addDays(t,-1);
  if(dateStr===t) return "Aujourd\u2019hui";
  if(dateStr===y) return 'Hier';
  const d = new Date(dateStr+'T00:00:00');
  const s = d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function dayLetter(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{weekday:'narrow'}).toUpperCase();
}

function entriesForDate(dateStr, personId){
  const pid = personId || activePerson().id;
  return STATE.log.filter(e=>e.date===dateStr && (e.person||STATE.people[0].id)===pid);
}
function totalsForDate(dateStr, personId){
  const tot = {k:0,p:0,c:0,f:0};
  entriesForDate(dateStr, personId).forEach(e=>{ const m=macrosForEntry(e); tot.k+=m.k; tot.p+=m.p; tot.c+=m.c; tot.f+=m.f; });
  return tot;
}
function last7Days(fromDate){
  const days = [];
  for(let i=6;i>=0;i--) days.push(addDays(fromDate,-i));
  return days;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ============================= VUE : AUJOURD\u2019HUI ============================= */
function renderToday(){
  const date = VIEW.currentDate;
  const person = activePerson();
  const tot = totalsForDate(date, person.id);
  const kcalPct = Math.min(100, (tot.k/person.kcalTarget)*100);
  const protPct = Math.min(100, (tot.p/person.proteinTarget)*100);
  const kcalOver = tot.k > person.kcalTarget * 1.05;
  const days = last7Days(date);
  const weekTotals = days.map(d=>totalsForDate(d, person.id).k);
  const maxWeek = Math.max(person.kcalTarget, ...weekTotals, 1);
  const avg7 = weekTotals.reduce((a,b)=>a+b,0)/7;
  const entries = entriesForDate(date, person.id).slice().sort((a,b)=>b.ts-a.ts);

  let entriesHtml = '';
  if(entries.length===0){
    entriesHtml = '<div class="empty">Rien de logg\u00e9 pour l\u2019instant.</div>';
  } else {
    entriesHtml = entries.map(e=>{
      const m = macrosForEntry(e);
      const lbl = entryLabel(e);
      return '<div class="entry">'
        + '<div class="dot '+dotClass(e.kind)+'"></div>'
        + '<div class="info"><div class="name">'+esc(lbl.name)+'</div><div class="qty">'+esc(lbl.qty)+'</div></div>'
        + '<div class="macros"><span class="kc num">'+r0(m.k)+' kcal</span><br>'+round(m.p)+' g prot</div>'
        + '<button class="del" onclick="deleteEntry(\''+e.id+'\')">\u00d7</button>'
        + '</div>';
    }).join('');
  }

  const weekHtml = days.map((d,i)=>{
    const v = weekTotals[i];
    const h = Math.max(4, (v/maxWeek)*64);
    const isToday = d===date;
    return '<div class="col"><div class="stick" style="height:'+64+'px"><div class="fill" style="height:'+h+'px; opacity:'+(isToday?1:0.55)+'"></div></div><div class="day" style="'+(isToday?'color:var(--accent)':'')+'">'+dayLetter(d)+'</div></div>';
  }).join('');

  const personSwitch = STATE.people.length>1 ? '<div class="person-switch">'+STATE.people.map(p=>'<button class="'+(p.id===person.id?'active':'')+'" onclick="setActivePerson(\''+p.id+'\')">'+esc(p.name)+'</button>').join('')+'</div>' : '';

  return '<div class="wrap">'
    + '<div class="topbar">'
    + personSwitch
    + '<div style="display:flex; align-items:center; justify-content:space-between;">'
    + '<button class="btn small ghost" onclick="navDay(-1)" style="padding:6px 10px;">'+ICONS.chevL+'</button>'
    + '<div style="text-align:center;"><div class="date">Journal</div><h1 style="font-size:20px;">'+humanDate(date)+'</h1></div>'
    + '<button class="btn small ghost" onclick="navDay(1)" style="padding:6px 10px; opacity:'+(date>=todayStr()?'.3':'1')+';" '+(date>=todayStr()?'disabled':'')+'>'+ICONS.chevR+'</button>'
    + '</div></div>'

    + '<div class="metric-row">'
    + '<div class="metric"><div class="label">Calories</div><div class="value num">'+r0(tot.k)+'<span class="sub"> / '+person.kcalTarget+'</span></div>'
    + '<div class="bar-track"><div class="bar-fill '+(kcalOver?'over':'kcal')+'" style="width:'+kcalPct+'%"></div></div>'
    + '<div style="font-size:11px; color:var(--text-dim); margin-top:6px;">reste '+r0(Math.max(0,person.kcalTarget-tot.k))+' kcal</div></div>'
    + '<div class="metric"><div class="label">Prot\u00e9ines</div><div class="value num">'+round(tot.p)+'<span class="sub"> / '+person.proteinTarget+' g</span></div>'
    + '<div class="bar-track"><div class="bar-fill prot" style="width:'+protPct+'%"></div></div>'
    + '<div style="font-size:11px; color:var(--text-dim); margin-top:6px;">reste '+round(Math.max(0,person.proteinTarget-tot.p))+' g</div></div>'
    + '</div>'

    + '<button class="btn primary full" onclick="openAddPicker()">+ Ajouter une entr\u00e9e</button>'

    + '<div class="section-title"><h2>Moyenne 7 jours</h2><span class="hint num">'+r0(avg7)+' kcal/j</span></div>'
    + '<div class="weekbars">'+weekHtml+'</div>'

    + '<div class="section-title"><h2>Journal du jour</h2></div>'
    + entriesHtml

    + '</div>';
}

const CATS = [['all','Toutes'],['petit-dej','Petit-d\u00e9j'],['dejeuner','D\u00e9jeuner / D\u00eener'],['collation','Collation'],['dessert','Dessert']];

  const q = VIEW.recipeSearch.toLowerCase();
  let list = allRecipes();
  if(VIEW.recipeCat!=='all') list = list.filter(r=>r.cat===VIEW.recipeCat);
  if(q) list = list.filter(r=>r.n.toLowerCase().includes(q));
  list = list.slice().sort((a,b)=>a.n.localeCompare(b.n,'fr'));

  const chips = CATS.map(([id,label])=>'<button class="chip '+(VIEW.recipeCat===id?'active':'')+'" onclick="setRecipeCat(\''+id+'\')">'+label+'</button>').join('');

  const cards = list.map(r=>{
    const m = computeRecipeMacros(r);
    const catLabel = (CATS.find(c=>c[0]===r.cat)||['',''])[1];

      + '<div><div class="name">'+esc(r.n)+'</div><div class="tag">'+catLabel+timeTag+(r.isCustom?' \u00b7 perso':(r.isOverridden?' \u00b7 modifi\u00e9e':''))+'</div></div>'
      + '<div class="m"><span class="kc num">'+r0(m.k)+' kcal</span>'+round(m.p)+' g prot</div>'
      + '</div>';
  }).join('') || '<div class="empty">Aucune recette ne correspond.</div>';

  return '<div class="wrap">'
    + '<div class="topbar"><div class="date">'+allRecipes().length+' recettes</div><h1>Recettes</h1></div>'
    + '<div class="searchbar"><input placeholder="Rechercher une recette\u2026" value="'+esc(VIEW.recipeSearch)+'" oninput="onRecipeSearch(this.value)"></div>'
    + '<div class="chiprow">'+chips+'</div>'
    + '<div class="fab-row" style="margin:16px 0 6px;">'
    + '<button class="btn primary" onclick="openRecipeEditor(null)">+ Nouvelle recette</button>'
    + '<button class="btn" onclick="openRoulette()">'+ICONS.dice+' Roulette</button>'
    + '</div>'
    + '<div style="margin-top:10px;">'+cards+'</div>'
    + '</div>';

function openRecipeDetail(id){

function renderSettings(){
  const peopleHtml = STATE.people.map((p,i)=>{
    const wlog = (p.weightLog||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,4);
    const wlogHtml = wlog.length ? wlog.map(w=>'<div class="entry"><div class="info"><div class="name num">'+w.value+' kg</div><div class="qty">'+humanDate(w.date)+'</div></div></div>').join('') : '<div class="empty">Aucun poids enregistr\u00e9.</div>';
    return '<div class="section-title"><h2>'+esc(p.name)+'</h2>'+(STATE.people.length>1?'<span class="hint" onclick="removePerson(\''+p.id+'\')" style="cursor:pointer;">Supprimer</span>':'')+'</div>'
      + '<div class="settings-row"><div class="l">Nom</div><input value="'+esc(p.name)+'" style="width:140px;" onchange="updatePerson(\''+p.id+'\',\'name\',this.value)"></div>'
      + '<div class="settings-row"><div class="l">Calories cible<span class="s">kcal / jour</span></div><input type="number" value="'+p.kcalTarget+'" onchange="updatePerson(\''+p.id+'\',\'kcalTarget\',this.value)"></div>'
      + '<div class="settings-row"><div class="l">Prot\u00e9ines cible<span class="s">g / jour</span></div><input type="number" value="'+p.proteinTarget+'" onchange="updatePerson(\''+p.id+'\',\'proteinTarget\',this.value)"></div>'
      + '<div class="settings-row"><div class="l">Poids actuel<span class="s">kg</span></div><input type="number" step="0.1" placeholder="'+(p.weight||'--')+'" onchange="logWeight(\''+p.id+'\', this.value)"></div>'
      + wlogHtml;
  }).join('<div style="height:8px;"></div>');

  return '<div class="wrap">'
    + '<div class="topbar"><h1>R\u00e9glages</h1></div>'

    + peopleHtml

    + (STATE.people.length<2 ? '<button class="btn full" style="margin-top:22px;" onclick="addPerson()">+ Ajouter une personne (ex. ta copine)</button>' : '')

    + '<div class="section-title"><h2>Donn\u00e9es</h2></div>'
    + '<div class="fab-row">'
    + '<button class="btn" onclick="openExport()">Exporter (sauvegarde)</button>'
    + '<button class="btn" onclick="openImport()">Importer</button>'
    + '</div>'
    + '<button class="btn danger full" style="margin-top:10px;" onclick="confirmReset()">R\u00e9initialiser toutes les donn\u00e9es</button>'
    + '<p style="color:var(--text-dim); font-size:12px; margin-top:26px; line-height:1.5;">Les donn\u00e9es sont stock\u00e9es uniquement sur cet appareil (localStorage). Utilise l\u2019export pour en garder une copie ou passer d\u2019un appareil \u00e0 l\u2019autre.</p>'
    + '</div>';
}
function updatePerson(id, key, val){
  const p = getPerson(id);
  if(!p) return;
  if(key==='name'){ if(val.trim()) p.name = val.trim(); }
  else { const n = parseFloat(val); if(!isNaN(n) && n>0) p[key]=n; }
  saveState(); render();
}
function addPerson(){
  const id = 'p'+Date.now().toString(36);
  STATE.people.push({id, name:'Copine', kcalTarget:2000, proteinTarget:120, weight:null, weightLog:[]});
  saveState(); render(); toast('Personne ajout\u00e9e \u2014 modifie son nom et ses cibles');
}
function removePerson(id){
  if(STATE.people.length<2) return;
  STATE.people = STATE.people.filter(p=>p.id!==id);
  STATE.log = STATE.log.filter(e=>e.person!==id);
  if(VIEW.activePersonId===id) VIEW.activePersonId = STATE.people[0].id;
  saveState(); render(); toast('Personne supprim\u00e9e');
}
function logWeight(personId, val){
  const n = parseFloat(val);
  if(isNaN(n) || n<=0) return;
  const p = getPerson(personId);
  p.weight = n;
  p.weightLog = p.weightLog || [];
  p.weightLog.push({date: todayStr(), value:n, ts:Date.now()});
  saveState(); render(); toast('Poids enregistr\u00e9');
}
function confirmReset(){
  VIEW.modal = {type:'confirm-reset'};
  render();
}
function replaceState(newState){
  Object.keys(STATE).forEach(k=>delete STATE[k]);
  Object.assign(STATE, newState);
}
function doReset(){
  replaceState(defaultState());
  saveState();
  VIEW.modal = null;
  render();
  toast('Donn\u00e9es r\u00e9initialis\u00e9es');
}
function openExport(){ VIEW.modal={type:'export'}; render(); }
function openImport(){ VIEW.modal={type:'import'}; render(); }
function doImport(){
  const ta = document.getElementById('import-ta');
  try{
    const parsed = JSON.parse(ta.value);
    replaceState(Object.assign(defaultState(), parsed));
    saveState();
    VIEW.modal = null;
    render();
    toast('Donn\u00e9es import\u00e9es');
  }catch(e){
    toast('JSON invalide');
  }
}

/* ============================= MODALES ============================= */
function closeModal(){ VIEW.modal=null; render(); }
function stop(ev){ ev.stopPropagation(); }
function openAddPicker(){ resetLogFor(); VIEW.modal={type:'add'}; render(); }

function renderModal(){
  const root = document.getElementById('modal-root');
  const m = VIEW.modal;
  let inner = '';
  if(m.type==='add') inner = modalAdd();
  else if(m.type==='recipe-detail') inner = modalRecipeDetail(m);
  else if(m.type==='recipe-editor') inner = modalRecipeEditor();
  else if(m.type==='ingredient-picker') inner = modalIngredientPicker(m);
  else if(m.type==='log-ingredient-qty') inner = modalLogIngredientQty(m);
  else if(m.type==='new-ingredient') inner = modalNewIngredient(m);
  else if(m.type==='custom-entry') inner = modalCustomEntry(m);
  else if(m.type==='supplement-editor') inner = modalSupplementEditor(m);
  else if(m.type==='confirm-reset') inner = modalConfirmReset();
  else if(m.type==='export') inner = modalExport();
  else if(m.type==='import') inner = modalImport();
  else if(m.type==='roulette') inner = modalRoulette(m);
  root.innerHTML = '<div class="modal-backdrop" onclick="closeModal()"><div class="modal" onclick="stop(event)"><div class="modal-handle"></div>'+inner+'</div></div>';
}

function modalRecipeDetail(){
  const da = VIEW.detailAdjust;
  const r = findRecipe(da.recipeId);
  if(!r) return '<div class="empty">Recette introuvable.</div>';
  const tot = computeRecipeMacros({ing: da.ing});
  const servings = da.servings||1;

  let rows;
  if(da.adjusting){
    rows = da.ing.map((ref,i)=>{
      const ing = findIngredient(ref.id); const sup = !ing?findSupplement(ref.id):null; const item = ing||sup;
      const label = item ? item.n : '(?)';
      return '<div class="ing-row"><div class="n">'+esc(label)+'</div>'
        + '<input class="g" type="number" step="'+(ing?'1':'0.5')+'" value="'+ref.g+'" onchange="updateDetailIngQty('+i+', this.value)">'
        + '<div class="u">'+(ing?'g':'d')+'</div>'
        + '<button class="rm" onclick="removeDetailIngredient('+i+')">\u00d7</button></div>';
    }).join('') || '<div class="empty">Plus aucun ingr\u00e9dient \u2014 ajoutes-en un.</div>';
    rows += '<button class="btn full" style="margin-top:10px;" onclick="addIngredientToDetail()">+ Ajouter un ingr\u00e9dient</button>';
  } else {
    rows = da.ing.map(ref=>{
      const ing = findIngredient(ref.id);
      const sup = !ing ? findSupplement(ref.id) : null;
      const item = ing||sup;
      if(!item) return '';
      const mm = macrosFromRef(ref);
      const qtyLabel = ing ? ref.g+' g' : (ref.g===1?'1 dose':round(ref.g)+' doses');
      return '<div class="ing-row"><div class="n">'+esc(item.n)+'</div><div style="font-size:12px; color:var(--text-dim); width:70px; text-align:right;">'+qtyLabel+'</div><div style="font-size:12px; color:var(--text-dim); width:60px; text-align:right;" class="num">'+r0(mm.k)+' kcal</div></div>';
    }).join('');
  }
  const catLabel = (CATS.find(c=>c[0]===r.cat)||['',''])[1];
  const changed = JSON.stringify(da.ing)!==JSON.stringify(r.ing);
  const stepsHtml = r.steps ? '<div class="section-title" style="margin-top:22px;"><h2 style="font-size:15px;">Pr\u00e9paration</h2></div><p style="font-size:14px; line-height:1.55; color:var(--text);">'+esc(r.steps)+'</p>' : '';
  const person = activePerson();
  const timeHtml = r.t ? ' \u00b7 <span class="time-badge">'+ICONS.clock+r.t+' min</span>' : '';

  return '<div class="sheet-header"><button class="back" onclick="closeModal()">\u2039 Fermer</button>'
    + '<button class="back" onclick="toggleAdjust()">'+(da.adjusting?'Termin\u00e9':'Ajuster les ingr\u00e9dients')+'</button></div>'
    + '<h2 style="font-size:21px; margin-bottom:4px;">'+esc(r.n)+'</h2>'
    + '<div style="color:var(--text-dim); font-size:13px; margin-bottom:14px; display:flex; align-items:center; gap:4px;">'+catLabel+timeHtml+(changed?' \u00b7 ingr\u00e9dients modifi\u00e9s pour cette fois':'')+'</div>'
    + '<div>'+rows+'</div>'
    + '<div class="macro-preview">'
    + '<div class="m"><div class="v num">'+r0(tot.k)+'</div><div class="l">kcal</div></div>'
    + '<div class="m"><div class="v num">'+round(tot.p)+'</div><div class="l">prot (g)</div></div>'
    + '<div class="m"><div class="v num">'+round(tot.c)+'</div><div class="l">gluc (g)</div></div>'
    + '<div class="m"><div class="v num">'+round(tot.f)+'</div><div class="l">lip (g)</div></div>'
    + '</div>'
    + '<div class="field"><label>Portions</label><div class="stepper">'
    + '<button onclick="stepServings(-0.5)">\u2212</button><div class="v num">'+servings+'</div><button onclick="stepServings(0.5)">+</button>'
    + '</div></div>'
    + '<div class="field"><label>Ajuster \u00e0 un objectif calorique</label><div class="fab-row">'
    + '<button class="btn small" onclick="scaleRecipeToTarget('+person.kcalTarget+')">Objectif ('+person.kcalTarget+')</button>'
    + '<button class="btn small" onclick="scaleRecipeToTarget('+r0(person.kcalTarget/2)+')">Moiti\u00e9 ('+r0(person.kcalTarget/2)+')</button>'
    + '</div><input type="number" placeholder="Ou viser X kcal pr\u00e9cis\u00e9ment" style="margin-top:8px;" onchange="scaleRecipeToTarget(parseFloat(this.value)||0)"></div>'
    + personPillsField()
    + '<button class="btn primary full" onclick="logRecipe()">Ajouter au journal \u2014 '+r0(tot.k*servings)+' kcal</button>'
    + '<div class="fab-row" style="margin-top:10px;">'
    + '<button class="btn" onclick="openRecipeEditor(\''+r.id+'\')">'+(changed?'Enregistrer ces changements':'Modifier la recette')+'</button>'
    + (r.isCustom ? '<button class="btn danger" onclick="deleteCustomRecipe(\''+r.id+'\')">Supprimer</button>' : (r.isOverridden ? '<button class="btn" onclick="resetRecipeOverride(\''+r.id+'\')">R\u00e9initialiser</button>' : ''))
    + '</div>'
    + stepsHtml;
}
function scaleRecipeToTarget(targetKcal){
  const da = VIEW.detailAdjust;
  const base = computeRecipeMacros({ing: da.ing});
  if(base.k<=0 || !targetKcal || targetKcal<=0) return;
  da.servings = Math.max(0.25, round(targetKcal / base.k));
  render();
}
function toggleAdjust(){ VIEW.detailAdjust.adjusting = !VIEW.detailAdjust.adjusting; render(); }
function updateDetailIngQty(i, val){
  const n = parseFloat(val);
  if(!isNaN(n) && n>=0) VIEW.detailAdjust.ing[i].g = n;
  render();
}
function removeDetailIngredient(i){ VIEW.detailAdjust.ing.splice(i,1); render(); }
function addIngredientToDetail(){ VIEW.modal = {type:'ingredient-picker', context:'detail-adjust', search:''}; render(); }
function stepServings(d){
  VIEW.detailAdjust.servings = Math.max(0.25, round((VIEW.detailAdjust.servings||1)+d));
  render();
}
function logRecipe(){
  const da = VIEW.detailAdjust;
  const people = VIEW.logFor && VIEW.logFor.length ? VIEW.logFor : [activePerson().id];
  people.forEach(pid=>{
    STATE.log.push({id:'e'+Date.now()+Math.random().toString(36).slice(2,6)+pid, date:VIEW.currentDate, ts:Date.now(), kind:'recipe', refId:da.recipeId, qty:da.servings, ingSnapshot: JSON.parse(JSON.stringify(da.ing)), person:pid});
  });
  saveState();
  VIEW.modal=null; VIEW.detailAdjust=null;
  toast('Ajout\u00e9 au journal');
  if(VIEW.tab==='today') render(); else { VIEW.tab='today'; render(); }
}
function deleteCustomRecipe(id){
  STATE.customRecipes = STATE.customRecipes.filter(r=>r.id!==id);

  VIEW.modal=null; render(); toast('Recette supprim\u00e9e');
}
function resetRecipeOverride(id){

  saveState();

}

    + '<div class="m"><div class="v num">'+round(tot.c)+'</div><div class="l">gluc (g)</div></div>'

function updateEditorIngQty(i, val){
  const n = parseFloat(val);
  if(!isNaN(n) && n>=0) VIEW.editorDraft.ing[i].g = n;
  render();
}
function removeEditorIngredient(i){ VIEW.editorDraft.ing.splice(i,1); render(); }
function saveRecipeDraft(){
  const d = VIEW.editorDraft;
  if(!d.n.trim()){ toast('Donne un nom \u00e0 la recette'); return; }
  if(d.ing.length===0){ toast('Ajoute au moins un ingr\u00e9dient'); return; }
  if(d.id){
    const idx = STATE.customRecipes.findIndex(r=>r.id===d.id);
    if(idx>=0) STATE.customRecipes[idx] = {id:d.id, n:d.n, cat:d.cat, steps:d.steps||'', t:d.t||10, ing:d.ing};
  } else if(d.baseId){
    STATE.recipeOverrides[d.baseId] = {n:d.n, cat:d.cat, steps:d.steps||'', t:d.t||10, ing:d.ing};
  } else {
    const slug = 'custom-'+d.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Date.now().toString(36);
    STATE.customRecipes.push({id:slug, n:d.n, cat:d.cat, steps:d.steps||'', t:d.t||10, ing:d.ing});
  }
  saveState();
  VIEW.modal=null; VIEW.editorDraft=null;
  toast('Recette enregistr\u00e9e');
  switchTab('recipes');
}

function openIngredientPicker(context){ VIEW.modal={type:'ingredient-picker', context, search:''}; render(); setTimeout(()=>{ const el=document.getElementById('ing-search'); if(el) el.focus(); },30); }
function modalIngredientPicker(m){

function onIngSearch(v){ VIEW.modal.search=v; render(); const el=document.getElementById('ing-search'); if(el){ el.focus(); el.setSelectionRange(v.length,v.length); } }
function pickIngredient(id){
  const context = VIEW.modal.context;
  if(context==='editor'){
    VIEW.editorDraft.ing.push({id, g:100});
    VIEW.modal={type:'recipe-editor'};

    VIEW.detailAdjust.ing.push({id, g:100});
    VIEW.modal={type:'recipe-detail'};
    render();
  } else if(context==='log-ingredient'){
    VIEW.modal={type:'log-ingredient-qty', id, qty:100};
    render();
  }
}
function modalLogIngredientQty(m){

  if(m.mode===undefined) m.mode = 'g';
  if(m.pieces===undefined) m.pieces = 1;
  const grams = m.mode==='unit' ? m.pieces*ing.uw : m.qty;
  const factor = grams/100;
  const toggle = hasUnit ? '<div class="person-switch" style="margin-bottom:16px;"><button class="'+(m.mode==='g'?'active':'')+'" onclick="setIngQtyMode(\'g\')">Grammes</button><button class="'+(m.mode==='unit'?'active':'')+'" onclick="setIngQtyMode(\'unit\')">Nombre</button></div>' : '';
  const qtyField = m.mode==='unit'
    ? '<div class="field"><label>Nombre de '+esc(ing.ul)+'(s)</label><input type="number" step="0.5" value="'+m.pieces+'" onchange="VIEW.modal.pieces=parseFloat(this.value)||0; render();"></div><p style="color:var(--text-dim); font-size:12px; margin-top:-10px;">\u2248 '+ing.uw+' g / '+esc(ing.ul)+' \u2014 soit '+r0(grams)+' g au total</p>'
    : '<div class="field"><label>Quantit\u00e9 (g)</label><input type="number" value="'+m.qty+'" onchange="VIEW.modal.qty=parseFloat(this.value)||0; render();"></div>';
  return '<div class="sheet-header"><h2 style="font-size:16px;">'+esc(ing.n)+'</h2><button class="back" onclick="closeModal()">Fermer</button></div>'
    + toggle
    + qtyField
    + '<div class="macro-preview">'
    + '<div class="m"><div class="v num">'+r0(ing.k*factor)+'</div><div class="l">kcal</div></div>'
    + '<div class="m"><div class="v num">'+round(ing.p*factor)+'</div><div class="l">prot (g)</div></div>'
    + '<div class="m"><div class="v num">'+round(ing.c*factor)+'</div><div class="l">gluc (g)</div></div>'
    + '<div class="m"><div class="v num">'+round(ing.f*factor)+'</div><div class="l">lip (g)</div></div>'
    + '</div>'
    + personPillsField()
    + '<button class="btn primary full" onclick="logIngredient(\''+m.id+'\', '+grams+')">Ajouter au journal</button>';
}
function setIngQtyMode(mode){ VIEW.modal.mode = mode; render(); }
function logIngredient(id, grams){
  const people = VIEW.logFor && VIEW.logFor.length ? VIEW.logFor : [activePerson().id];
  people.forEach(pid=>{
    STATE.log.push({id:'e'+Date.now()+Math.random().toString(36).slice(2,6)+pid, date:VIEW.currentDate, ts:Date.now(), kind:'ingredient', refId:id, qty:grams, person:pid});

  saveState();
  VIEW.modal=null;
  toast('Ajout\u00e9 au journal');

  VIEW.modal = {type:'new-ingredient', pendingContext:context, draft:{n:'',k:'',p:'',c:'',f:''}};
  render();

function modalNewIngredient(m){

    + '<div class="metric-row">'
    + '<div class="field" style="flex:1; margin:0;"><label>Kcal</label><input type="number" value="'+d.k+'" onchange="VIEW.modal.draft.k=this.value"></div>'
    + '<div class="field" style="flex:1; margin:0;"><label>Prot (g)</label><input type="number" value="'+d.p+'" onchange="VIEW.modal.draft.p=this.value"></div>'

function openRoulette(){ VIEW.modal={type:'roulette', cat:'all', mealsLeft:null, result:null}; render(); }
function roulettePool(m){
  let pool = allRecipes();
  if(m.cat!=='all') pool = pool.filter(r=>r.cat===m.cat);
  if(m.mealsLeft){
    const remaining = Math.max(0, activePerson().kcalTarget - totalsForDate(VIEW.currentDate).k);
    const target = remaining / m.mealsLeft;
    if(target > 0){
      pool = pool.slice().sort((a,b)=> Math.abs(computeRecipeMacros(a).k - target) - Math.abs(computeRecipeMacros(b).k - target));
      const keep = Math.max(5, Math.ceil(pool.length * 0.25));
      pool = pool.slice(0, keep);
    }
  }
  return pool;
}
function rouletteTarget(m){
  if(!m.mealsLeft) return null;
  const remaining = Math.max(0, activePerson().kcalTarget - totalsForDate(VIEW.currentDate).k);
  return remaining / m.mealsLeft;
}
function setRouletteCat(cat){ VIEW.modal.cat=cat; VIEW.modal.result=null; render(); }
function setRouletteMeals(n){ VIEW.modal.mealsLeft = (VIEW.modal.mealsLeft===n ? null : n); VIEW.modal.result=null; render(); }
function modalRoulette(m){
  const pool = roulettePool(m);
  const target = rouletteTarget(m);
  const chips = CATS.map(([id,label])=>'<button class="chip '+(m.cat===id?'active':'')+'" onclick="setRouletteCat(\''+id+'\')">'+label+'</button>').join('');
  const display = m.result ? m.result.n : (pool.length ? 'Pr\u00eat \u00e0 tourner\u00a0?' : 'Aucune recette dans ce filtre');
  const resultActions = m.result
    ? '<div style="text-align:center; color:var(--text-dim); font-size:13px; margin:-6px 0 16px;">'+r0(computeRecipeMacros(m.result).k)+' kcal \u00b7 '+(m.result.t||'?')+' min</div>'
      + '<div class="fab-row"><button class="btn" onclick="spinRoulette()">Relancer</button><button class="btn primary" onclick="closeModal(); openRecipeDetail(\''+m.result.id+'\')">Voir la recette</button></div>'
    : '<button id="roulette-spin-btn" class="btn primary full" onclick="spinRoulette()" '+(pool.length?'':'disabled')+'>Lancer la roulette</button>';
  const targetHint = target ? '<p style="color:var(--text-dim); font-size:12px; margin:-2px 0 4px;">Cible par repas \u2248 '+r0(target)+' kcal \u2014 la roulette privil\u00e9gie les recettes qui s\u2019en rapprochent.</p>' : '';

  return '<div class="sheet-header"><h2 style="font-size:16px;">Roulette</h2><button class="back" onclick="closeModal()">Fermer</button></div>'
    + '<div class="chiprow">'+chips+'</div>'
    + '<div class="field" style="margin:12px 0 4px;"><label>Repas restants aujourd\u2019hui</label><div class="person-pills">'
    + '<button class="person-pill '+(m.mealsLeft===1?'active':'')+'" onclick="setRouletteMeals(1)">Plus qu\u20191</button>'
    + '<button class="person-pill '+(m.mealsLeft===2?'active':'')+'" onclick="setRouletteMeals(2)">Encore 2</button>'
    + '</div></div>'
    + targetHint
    + '<div class="roulette-wheel" id="roulette-display">'+esc(display)+'</div>'
    + resultActions;
}
function spinRoulette(){
  const m = VIEW.modal;
  const pool = roulettePool(m);
  if(pool.length===0){ toast('Aucune recette ne correspond \u00e0 ce filtre'); return; }
  const el = document.getElementById('roulette-display');
  const btn = document.getElementById('roulette-spin-btn');
  if(btn) btn.disabled = true;
  let i=0; const total = 16 + Math.floor(Math.random()*8);
  const iv = setInterval(()=>{
    const r = pool[Math.floor(Math.random()*pool.length)];
    if(el) el.textContent = r.n;
    i++;
    if(i>=total){
      clearInterval(iv);
      m.result = pool[Math.floor(Math.random()*pool.length)];
      render();
    }
  }, 80);
}
