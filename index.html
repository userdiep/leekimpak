{id:'d-tarte-pommes', n:'Tarte aux pommes (part)', cat:'dessert', ing:[{id:'pate-brisee-crue',g:100},{id:'pomme',g:200},{id:'sucre',g:20}], steps:'1. Foncer un moule avec la p\u00e2te (\u00e9tal\u00e9e si en boule), piquer le fond \u00e0 la fourchette pour \u00e9viter qu\u2019il gonfle.\n2. \u00c9plucher et couper les pommes en lamelles fines et r\u00e9guli\u00e8res \u2014 plus elles sont fines, plus elles cuisent uniform\u00e9ment.\n3. Disposer en rosace ou en rang\u00e9es serr\u00e9es sur la p\u00e2te, saupoudrer de sucre.\n4. Four 30-35 min \u00e0 190\u00b0C jusqu\u2019\u00e0 ce que la p\u00e2te soit dor\u00e9e sur les bords et les pommes l\u00e9g\u00e8rement caram\u00e9lis\u00e9es.\n5. Si le dessus dore trop vite avant que la p\u00e2te soit cuite, couvrir d\u2019un papier aluminium pour la fin de cuisson.', t:45},
{id:'d-mousse-chocolat-legere', n:'Mousse au chocolat l\u00e9g\u00e8re', cat:'dessert', ing:[{id:'chocolatnoir',g:40},{id:'blanc-oeuf',g:120},{id:'sucre',g:10}], steps:'1. Faire fondre le chocolat doucement (bain-marie ou micro-ondes par s\u00e9quences courtes), laisser tiédir \u00e0 temp\u00e9rature ambiante \u2014 s\u2019il est trop chaud, il fera retomber les blancs.\n2. Monter les blancs en neige ferme avec une pinc\u00e9e de sel, en ajoutant le sucre en pluie \u00e0 mi-parcours pour les stabiliser. Ils sont pr\u00eats quand ils forment un bec rigide sur le fouet.\n3. Incorporer une petite cuill\u00e9r\u00e9e de blancs au chocolat pour le d\u00e9tendre (\u00e7a facilite le m\u00e9lange).\n4. Ajouter le reste des blancs en 2-3 fois, \u00e0 la spatule, en soulevant la masse délicatement de bas en haut \u2014 ne jamais remuer en rond, \u00e7a ferait retomber la mousse.\n5. R\u00e9partir dans des verrines, frigo au moins 2h avant de servir.', t:20},
{id:'d-clafoutis-cerises', n:'Clafoutis aux cerises', cat:'dessert', ing:[{id:'cerises',g:200},{id:'oeuf',g:110},{id:'farine',g:40},{id:'lait-demi',g:150},{id:'sucre',g:25}], steps:'1. Beurrer un plat \u00e0 gratin, y disposer les cerises en une couche r\u00e9guli\u00e8re.\n2. Fouetter les œufs avec le sucre jusqu\u2019\u00e0 l\u00e9g\u00e8re mousse, incorporer la farine en pluie pour \u00e9viter les grumeaux.\n3. D\u00e9layer progressivement avec le lait tout en fouettant, jusqu\u2019\u00e0 obtenir une p\u00e2te fluide sans grumeaux.\n4. Verser sur les cerises, four 30-35 min \u00e0 180\u00b0C jusqu\u2019\u00e0 ce que le dessus soit dor\u00e9 et gonfl\u00e9.\n5. Il retombe l\u00e9g\u00e8rement en refroidissant, c\u2019est normal. Se mange ti\u00e8de ou froid.', t:45},
{id:'d-bananabread', n:'Banana bread (part)', cat:'dessert', ing:[{id:'banane',g:200},{id:'farine',g:100},{id:'oeuf',g:55},{id:'sucre',g:30},{id:'beurre',g:30}], steps:'1. \u00c9craser les bananes bien m\u00fbres (tachet\u00e9es de noir id\u00e9alement) \u00e0 la fourchette jusqu\u2019\u00e0 pur\u00e9e grossi\u00e8re.\n2. M\u00e9langer avec le beurre fondu, l\u2019œuf et le sucre.\n3. Ajouter la farine en pluie et m\u00e9langer juste assez pour l\u2019incorporer \u2014 trop remuer rend le cake dense et caoutchouteux.\n4. Verser dans un moule \u00e0 cake beurr\u00e9, four 40-45 min \u00e0 180\u00b0C.\n5. V\u00e9rifier la cuisson avec un couteau plant\u00e9 au centre : il doit ressortir propre. Si le dessus dore trop vite, couvrir d\u2019alu pour la fin. Laisser tiédir avant de d\u00e9mouler.', t:55},
{id:'d-yaourt-glace-maison', n:'Yaourt glac\u00e9 maison', cat:'dessert', ing:[{id:'yaourtgrec',g:200},{id:'miel',g:20},{id:'fraises',g:80}], steps:'1. Mixer le yaourt avec le miel et les fraises jusqu’à texture lisse.\n2. Verser dans un bac, congélateur au moins 4h en remuant une fois à mi-prise pour éviter les cristaux de glace.', t:15},
{id:'d-sorbet-mangue', n:'Sorbet mangue maison', cat:'dessert', ing:[{id:'mangue',g:250},{id:'sucre',g:20},{id:'citron',g:10}], steps:'1. Mixer la mangue avec le sucre et le jus de citron jusqu’à texture lisse.\n2. Verser dans un bac, congélateur au moins 4h en remuant à mi-prise.', t:10},
{id:'d-muffin-chocolat', n:'Muffin au chocolat', cat:'dessert', ing:[{id:'farine',g:60},{id:'oeuf',g:55},{id:'chocolatnoir',g:30},{id:'sucre',g:25},{id:'beurre',g:20}], steps:'1. Faire fondre le beurre et le chocolat ensemble doucement (bain-marie ou micro-ondes par s\u00e9quences courtes).\n2. Fouetter l\u2019œuf avec le sucre, incorporer le m\u00e9lange beurre-chocolat tiédi.\n3. Ajouter la farine en pluie, m\u00e9langer juste assez pour l\u2019incorporer (ne pas trop battre, \u00e7a durcit la mie).\n4. R\u00e9partir dans des moules \u00e0 muffin (remplir aux 2/3 seulement, \u00e7a gonfle).\n5. Four 18-20 min \u00e0 180\u00b0C. V\u00e9rifier avec un cure-dent qui doit ressortir avec quelques miettes humides.', t:28},

// --- ITALIEN ---
{id:'r-lasagnes', n:'Lasagnes bolognaise maison', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:180},{id:'coulistomate',g:200},{id:'pates-lasagne-crues',g:120},{id:'bechamel',g:150},{id:'emmental',g:60}], steps:'1. Faire revenir le bœuf hach\u00e9 5 min \u00e0 feu moyen-vif jusqu\u2019\u00e0 ce qu\u2019il ne soit plus rose, ajouter le coulis de tomate, saler, poivrer, mijoter 15 min \u00e0 d\u00e9couvert pour que \u00e7a \u00e9paississe (une bolognaise trop liquide d\u00e9trempe les lasagnes).\n2. Pr\u00e9chauffer le four \u00e0 200\u00b0C. Si les p\u00e2tes ne sont pas pr\u00e9-cuites, v\u00e9rifier l\u2019emballage \u2014 certaines n\u00e9cessitent un passage rapide \u00e0 l\u2019eau bouillante avant montage.\n3. Dans un plat, alterner : une fine couche de b\u00e9chamel au fond (\u00e9vite que \u00e7a accroche), une couche de p\u00e2tes, une couche de bolognaise, un peu de b\u00e9chamel. R\u00e9p\u00e9ter 2-3 fois.\n4. Finir imp\u00e9rativement par de la b\u00e9chamel puis le fromage r\u00e2p\u00e9 \u2014 les p\u00e2tes du dessus doivent \u00eatre recouvertes, sinon elles restent dures et cassantes.\n5. Four 35-40 min \u00e0 200\u00b0C jusqu\u2019\u00e0 ce que le dessus soit bien dor\u00e9. Planter un couteau au centre : il doit s\u2019enfoncer sans r\u00e9sistance (signe que les p\u00e2tes sont cuites). Laisser reposer 5 min avant de couper.', t:55},
{id:'r-spaghetti-carbonara', n:'Spaghetti carbonara', cat:'dejeuner', ing:[{id:'pates-cuites',g:250},{id:'lardons',g:100},{id:'oeuf',g:110},{id:'parmesan',g:30}], steps:'1. Cuire les p\u00e2tes dans l\u2019eau bouillante sal\u00e9e, garder une louche d\u2019eau de cuisson avant de les \u00e9goutter.\n2. Pendant ce temps, faire dorer les lardons \u00e0 sec (sans mati\u00e8re grasse) dans une po\u00eale 5-6 min jusqu\u2019\u00e0 ce qu\u2019ils croustillent.\n3. Dans un bol, battre les œufs avec le parmesan r\u00e2p\u00e9 et du poivre \u2014 c\u2019est la base de la sauce, elle ne cuit jamais directement sur le feu.\n4. Retirer la po\u00eale du feu (important : trop chaude, elle ferait brouiller les œufs). Verser les p\u00e2tes chaudes \u00e9gout\u00e9es dans la po\u00eale avec les lardons.\n5. Verser le m\u00e9lange œufs-parmesan sur les p\u00e2tes hors du feu, remuer vite \u2014 la chaleur r\u00e9siduelle des p\u00e2tes cuit la sauce en cr\u00e8me onctueuse. Ajouter un peu d\u2019eau de cuisson si trop \u00e9pais. Servir imm\u00e9diatement, poivre g\u00e9n\u00e9reusement.', t:20},
{id:'r-spaghetti-bolognaise', n:'Spaghetti bolognaise', cat:'dejeuner', ing:[{id:'pates-cuites',g:250},{id:'boeuf-hache15',g:170},{id:'coulistomate',g:180},{id:'oignon',g:50},{id:'parmesan',g:15}], steps:'1. Faire revenir l\u2019oignon \u00e9minc\u00e9 5-6 min \u00e0 feu doux jusqu\u2019\u00e0 fondant.\n2. Ajouter le bœuf hach\u00e9, monter \u00e0 feu vif, bien le colorer avant d\u2019ajouter le coulis (une viande grise sans coloration manque de go\u00fbt).\n3. Mijoter 20 min \u00e0 feu doux \u00e0 d\u00e9couvert pour concentrer les saveurs. Servir sur les spaghetti avec le parmesan.', t:30},
{id:'r-risotto-poulet', n:'Risotto au poulet', cat:'dejeuner', ing:[{id:'riz-blanc-cru',g:90},{id:'poulet-cru',g:150},{id:'parmesan',g:20},{id:'oignon',g:40},{id:'beurre',g:10}], steps:'1. Faire chauffer un bouillon (eau + cube) \u00e0 part, le garder frémissant sur feu doux \u2014 un bouillon froid casse la cuisson du riz.\n2. Faire revenir l\u2019oignon \u00e9minc\u00e9 dans un peu de beurre 2-3 min, ajouter le riz cru et remuer 1-2 min jusqu\u2019\u00e0 ce que les grains deviennent translucides sur les bords.\n3. Ajouter le bouillon chaud louche par louche, en attendant que chaque louche soit presque enti\u00e8rement absorb\u00e9e avant d\u2019ajouter la suivante, en remuant r\u00e9guli\u00e8rement. Compter 18-20 min au total.\n4. Pendant ce temps, poêler le poulet en morceaux \u00e0 part 8-10 min.\n5. Le riz est pr\u00eat quand il est cr\u00e9meux autour mais encore l\u00e9g\u00e8rement ferme \u00e0 cœur (al dente). Retirer du feu, incorporer le beurre restant et le parmesan pour la brillance (la \"mantecatura\"), puis le poulet. Servir aussit\u00f4t \u2014 le risotto n\u2019attend pas.', t:35},
{id:'r-risotto-champignons', n:'Risotto aux champignons', cat:'dejeuner', ing:[{id:'riz-blanc-cru',g:90},{id:'champignons-cuits',g:150},{id:'parmesan',g:25},{id:'oignon',g:40},{id:'beurre',g:10}], steps:'1. Faire chauffer un bouillon \u00e0 part, le garder fr\u00e9missant sur feu doux pendant toute la cuisson.\n2. Faire revenir l\u2019oignon dans un peu de beurre 2-3 min, ajouter le riz cru, remuer 1-2 min jusqu\u2019\u00e0 ce qu\u2019il devienne translucide sur les bords.\n3. Ajouter le bouillon chaud louche par louche, en attendant l\u2019absorption quasi compl\u00e8te entre chaque ajout, en remuant r\u00e9guli\u00e8rement 18-20 min.\n4. \u00c0 mi-cuisson, ajouter les champignons po\u00ealés pour qu\u2019ils infusent leur go\u00fbt dans le riz.\n5. Le riz doit rester cr\u00e9meux et l\u00e9g\u00e8rement ferme \u00e0 cœur. Retirer du feu, incorporer le beurre et le parmesan hors du feu en remuant vivement pour la texture on-descence. Servir imm\u00e9diatement.', t:30},
{id:'r-pizza-maison', n:'Pizza maison jambon-fromage', cat:'dejeuner', ing:[{id:'pate-pizza-crue',g:200},{id:'coulistomate',g:80},{id:'mozzarella',g:100},{id:'jambonblanc',g:60}], steps:'1. Pr\u00e9chauffer le four \u00e0 sa temp\u00e9rature maximale (220-250\u00b0C) au moins 15 min \u00e0 l\u2019avance avec la plaque \u00e0 l\u2019int\u00e9rieur \u2014 une plaque d\u00e9j\u00e0 chaude donne une base croustillante.\n2. \u00c9taler la p\u00e2te sur un plan fariné, du centre vers les bords, en laissant les bords l\u00e9g\u00e8rement plus \u00e9pais.\n3. Tartiner de coulis de tomate en fine couche \u2014 trop de sauce d\u00e9trempe la p\u00e2te.\n4. R\u00e9partir la mozzarella (\u00e9goutt\u00e9e si fraîche, sinon elle rend trop d\u2019eau) et le jambon.\n5. Glisser sur la plaque chaude, cuire 10-12 min jusqu\u2019\u00e0 ce que les bords soient bien dor\u00e9s et le fromage l\u00e9g\u00e8rement color\u00e9.', t:25},
{id:'r-gnocchis-tomate-parmesan', n:'Gnocchis, sauce tomate, parmesan', cat:'dejeuner', ing:[{id:'gnocchis-crus',g:300},{id:'coulistomate',g:150},{id:'parmesan',g:20},{id:'huile-olive',g:6}], steps:'1. Porter une grande casserole d\u2019eau sal\u00e9e \u00e0 franche \u00e9bullition (les gnocchis ont besoin de beaucoup d\u2019eau qui bout vraiment).\n2. Y plonger les gnocchis, ne pas remuer imm\u00e9diatement pour \u00e9viter qu\u2019ils collent au fond.\n3. Ils sont cuits d\u00e8s qu\u2019ils remontent \u00e0 la surface \u2014 en g\u00e9n\u00e9ral 2-3 min, pas plus (ils deviennent p\u00e2teux si on les laisse trop longtemps). Les \u00e9goutter aussit\u00f4t.\n4. Chauffer le coulis de tomate \u00e0 part avec l\u2019huile, saler, poivrer.\n5. M\u00e9langer d\u00e9licatement les gnocchis dans la sauce chaude (pas trop remuer pour ne pas les casser), parsemer de parmesan.', t:15},
{id:'r-penne-arrabbiata', n:'Penne all\u2019arrabbiata', cat:'dejeuner', ing:[{id:'pates-cuites',g:250},{id:'coulistomate',g:180},{id:'ail',g:8},{id:'huile-olive',g:10},{id:'parmesan',g:15}], steps:'1. Faire revenir l\u2019ail \u00e9minc\u00e9 dans l\u2019huile \u00e0 feu doux avec du piment 1 min \u2014 juste assez pour parfumer l\u2019huile, sans le laisser br\u00fbler (\u00e7a le rend amer).\n2. Ajouter le coulis de tomate, mijoter 10 min \u00e0 feu doux. M\u00e9langer avec les p\u00e2tes chaudes, parsemer de parmesan.', t:20},

// --- JAPONAIS / ASIATIQUE ---
{id:'r-chirashi-saumon', n:'Chirashi saumon', cat:'dejeuner', ing:[{id:'riz-sushi-cuit',g:250},{id:'saumon-cru',g:150},{id:'avocat',g:60},{id:'gari',g:15},{id:'saucesoja',g:15}], steps:'1. Important : n\u2019utiliser que du saumon vendu explicitement pour consommation crue (\"qualit\u00e9 sushi/sashimi\", souvent surgel\u00e9 \u00e0 -20\u00b0C au pr\u00e9alable par le poissonnier) \u2014 un saumon cru classique n\u2019offre pas les m\u00eames garanties sanitaires.\n2. Avec un couteau bien aiguis\u00e9, trancher le saumon finement en biais, dans le sens contraire des fibres.\n3. \u00c9taler le riz \u00e0 sushi ti\u00e8de ou \u00e0 temp\u00e9rature ambiante dans un bol (jamais chaud, \u00e7a cuirait le poisson au contact).\n4. Disposer les tranches de saumon et d\u2019avocat harmonieusement dessus.\n5. Servir avec le gari et la sauce soja \u00e0 part, pour tremper au moment de manger.', t:15},
{id:'r-sushi-bowl-thon', n:'Sushi bowl thon', cat:'dejeuner', ing:[{id:'riz-sushi-cuit',g:220},{id:'thon-cru',g:150},{id:'avocat',g:60},{id:'algue-nori',g:5},{id:'saucesoja',g:15}], steps:'1. Utiliser un thon de qualit\u00e9 sushi si possible, le couper en d\u00e9s r\u00e9guliers au couteau bien aiguis\u00e9.\n2. Dresser sur le riz tiède avec l\u2019avocat en tranches, \u00e9mietter l\u2019algue nori dessus juste avant de servir (elle ramollit si ajout\u00e9e trop t\u00f4t). Arroser de sauce soja.', t:12},
{id:'r-poke-bowl-saumon', n:'Poke bowl saumon', cat:'dejeuner', ing:[{id:'saumon-cru',g:150},{id:'riz-sushi-cuit',g:220},{id:'avocat',g:60},{id:'petitspois',g:50},{id:'saucesoja',g:15}], steps:'1. Couper le saumon cru en d\u00e9s r\u00e9guliers, mariner 5 min max dans la sauce soja (pas plus, l\u2019acidit\u00e9 commencerait \u00e0 le \"cuire\").\n2. Dresser sur le riz avec avocat et petits pois en sections distinctes.', t:15},
{id:'r-ramen-poulet', n:'Ramen au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'nouilles-udon-cuites',g:200},{id:'oeuf',g:55},{id:'saucesoja',g:20},{id:'champignons-cuits',g:80}], steps:'1. Pour un œuf mollet digne d\u2019un ramen : cuire l\u2019œuf 6 min30 pile dans l\u2019eau bouillante, puis le plonger imm\u00e9diatement dans l\u2019eau glac\u00e9e pour stopper la cuisson \u2014 le jaune doit rester coulant.\n2. Poêler le poulet en lamelles 6-8 min \u00e0 feu vif jusqu\u2019\u00e0 belle coloration.\n3. Pr\u00e9parer un bouillon avec la sauce soja, les champignons et un peu de gingembre r\u00e2p\u00e9 si dispo, laisser infuser 10 min \u00e0 feu doux.\n4. Plonger les nouilles dans le bouillon chaud 2-3 min.\n5. Dresser : nouilles et bouillon, poulet, œuf coup\u00e9 en deux, un peu d\u2019oignon nouveau ou de coriandre fra\u00eeche si dispo pour la fraicheur finale.', t:25},
{id:'r-padthai-poulet', n:'Pad tha\u00ef au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'nouilles-chinoises-cuites',g:200},{id:'oeuf',g:55},{id:'cacahuetes',g:20},{id:'saucesoja',g:15}], steps:'1. Poêler le poulet en lamelles \u00e0 feu vif 6-8 min jusqu\u2019\u00e0 coloration, pousser sur le c\u00f4t\u00e9 de la po\u00eale.\n2. Casser l\u2019œuf dans l\u2019espace libre, le brouiller rapidement puis m\u00e9langer avec le poulet.\n3. Ajouter les nouilles et la sauce soja (id\u00e9alement avec un peu de jus de citron vert et une pointe de sucre pour l\u2019\u00e9quilibre sucr\u00e9-sal\u00e9-acide typique du plat), m\u00e9langer 3-4 min \u00e0 feu vif sans cesser de remuer.\n4. Parsemer de cacahu\u00e8tes concass\u00e9es juste avant de servir pour garder leur croquant.', t:20},
{id:'r-boeuf-nouilles-sautees', n:'Nouilles saut\u00e9es au bœuf', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:150},{id:'nouilles-chinoises-cuites',g:200},{id:'poivron',g:80},{id:'huile-sesame',g:8},{id:'saucesoja',g:20}], steps:'1. Couper le bœuf en fines lani\u00e8res contre le sens des fibres.\n2. Chauffer l\u2019huile de s\u00e9same jusqu\u2019\u00e0 ce qu\u2019elle fume l\u00e9g\u00e8rement, saisir le bœuf 1-2 min \u00e0 feu tr\u00e8s vif sans trop remuer (pour qu\u2019il caram\u00e9lise au lieu de bouillir), r\u00e9server.\n3. Saisir le poivron 2-3 min dans la m\u00eame po\u00eale.\n4. Ajouter les nouilles et la sauce soja, remettre le bœuf, m\u00e9langer vivement 2 min \u00e0 feu vif jusqu\u2019\u00e0 ce que tout soit chaud et bien enrob\u00e9.', t:18},
{id:'r-curry-vert-poulet', n:'Curry vert tha\u00ef au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'pate-curry-verte',g:30},{id:'lait-coco',g:150},{id:'riz-basmati-cuit',g:200},{id:'poivron',g:80}], steps:'1. Faire revenir la p\u00e2te de curry 1-2 min \u00e0 feu moyen dans un peu d\u2019huile jusqu\u2019\u00e0 ce qu\u2019elle embaume \u2014 cette \u00e9tape de \"r\u00e9veil\" des \u00e9pices dans la graisse est essentielle, ne pas la sauter.\n2. Ajouter le poulet en morceaux, bien l\u2019enrober de p\u00e2te, saisir 3-4 min.\n3. Verser le lait de coco progressivement en remuant pour \u00e9viter les grumeaux, ajouter le poivron.\n4. Mijoter 12-15 min \u00e0 feu doux \u00e0 d\u00e9couvert jusqu\u2019\u00e0 l\u00e9g\u00e8re r\u00e9duction. Servir sur le riz, avec du basilic thai frais si dispo.', t:25},

// --- FRANÇAIS ---
{id:'r-hachis-parmentier', n:'Hachis parmentier', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:180},{id:'pdt-cuite',g:300},{id:'lait-demi',g:40},{id:'emmental',g:30}], steps:'1. Faire revenir le bœuf hach\u00e9 5-6 min \u00e0 feu moyen-vif jusqu\u2019\u00e0 coloration, saler, poivrer, \u00e9goutter l\u2019exc\u00e8s de gras.\n2. \u00c9craser les pommes de terre chaudes en pur\u00e9e avec le lait, jusqu\u2019\u00e0 texture lisse (\u00e9craser des pommes de terre froides donne une pur\u00e9e collante).\n3. Pr\u00e9chauffer le four \u00e0 200\u00b0C.\n4. Dans un plat, \u00e9taler la viande en couche uniforme, recouvrir enti\u00e8rement de pur\u00e9e (\u00e7a emp\u00eache la viande de dessécher), lisser \u00e0 la fourchette pour cr\u00e9er des sillons qui doreront bien.\n5. Parsemer de fromage, four 20 min \u00e0 200\u00b0C, puis 3-5 min de grill en surveillant pour bien gratiner le dessus.', t:40},
{id:'r-blanquette-veau', n:'Blanquette de veau, riz', cat:'dejeuner', ing:[{id:'veau-escalope-crue',g:180},{id:'carotte',g:100},{id:'cremelegere',g:60},{id:'riz-basmati-cuit',g:180}], steps:'1. Couper le veau en morceaux, le mettre dans une casserole avec les carottes et couvrir d\u2019eau ou de bouillon.\n2. Porter \u00e0 fr\u00e9missement (pas un gros bouillon), \u00e9cumer la mousse grise qui remonte en surface les premi\u00e8res minutes \u2014 c\u2019est ce qui rend le bouillon trouble sinon.\n3. Laisser mijoter \u00e0 couvert et \u00e0 feu tr\u00e8s doux 40-45 min jusqu\u2019\u00e0 ce que le veau soit fondant \u00e0 la fourchette.\n4. Retirer la viande et les carottes, r\u00e9server. Faire r\u00e9duire le bouillon 2-3 min \u00e0 feu vif si trop liquide.\n5. Baisser le feu, incorporer la cr\u00e8me hors du gros bouillon (\u00e7a \u00e9viterait qu\u2019elle tranche), remettre viande et carottes 2 min pour r\u00e9chauffer. Servir avec le riz.', t:55},
{id:'r-pot-au-feu', n:'Pot-au-feu', cat:'dejeuner', ing:[{id:'boeuf-rumsteck-cru',g:200},{id:'carotte',g:150},{id:'poireau',g:100},{id:'pdt-cuite',g:200}], steps:'1. Mettre le bœuf dans une grande marmite, couvrir largement d\u2019eau froide (partir d\u2019eau froide, pas chaude, donne un bouillon plus clair).\n2. Porter \u00e0 \u00e9bullition, puis \u00e9cumer soigneusement la mousse grise qui remonte pendant les 10-15 premi\u00e8res minutes \u2014 c\u2019est cette \u00e9tape qui rend le bouillon limpide.\n3. Baisser \u00e0 feu tr\u00e8s doux (l\u00e9ger fr\u00e9missement, pas un bouillon franc), couvrir partiellement, laisser cuire 1h30 avant d\u2019ajouter les l\u00e9gumes.\n4. Ajouter carottes et poireaux, poursuivre la cuisson 30-40 min jusqu\u2019\u00e0 ce que la viande soit fondante \u00e0 la fourchette.\n5. Servir la viande et les l\u00e9gumes avec un peu de bouillon chaud, moutarde et cornichons \u00e0 c\u00f4t\u00e9 si envie.', t:130},
{id:'r-quiche-lorraine', n:'Quiche lorraine, salade', cat:'dejeuner', ing:[{id:'pate-brisee-crue',g:150},{id:'oeuf',g:165},{id:'lardons',g:100},{id:'cremeepaisse',g:100},{id:'salade',g:50}], steps:'1. Foncer un moule avec la p\u00e2te, piquer le fond \u00e0 la fourchette pour \u00e9viter qu\u2019il ne gonfle \u00e0 la cuisson.\n2. Faire dorer les lardons \u00e0 sec 3-4 min, \u00e9goutter l\u2019exc\u00e8s de gras.\n3. Battre les œufs avec la cr\u00e8me, saler l\u00e9g\u00e8rement (les lardons sont d\u00e9j\u00e0 sal\u00e9s), poivrer.\n4. R\u00e9partir les lardons sur le fond de p\u00e2te, verser l\u2019appareil œufs-cr\u00e8me par-dessus.\n5. Four 30-35 min \u00e0 190\u00b0C jusqu\u2019\u00e0 ce que le dessus soit dor\u00e9 et \u00e0 peine tremblotant au centre. Laisser reposer 5 min avant de couper \u2014 \u00e7a se tient mieux. Servir avec la salade.', t:45},
{id:'r-tartiflette', n:'Tartiflette', cat:'dejeuner', ing:[{id:'pdt-cuite',g:300},{id:'lardons',g:100},{id:'oignon',g:60},{id:'cremeepaisse',g:80},{id:'emmental',g:80}], steps:'1. Faire revenir les lardons et l\u2019oignon \u00e9minc\u00e9 5-6 min \u00e0 feu moyen jusqu\u2019\u00e0 coloration.\n2. Pr\u00e9chauffer le four \u00e0 200\u00b0C.\n3. Couper les pommes de terre en tranches, les m\u00e9langer avec les lardons-oignons et la cr\u00e8me dans un plat, saler légèrement (les lardons et le fromage sont d\u00e9j\u00e0 sal\u00e9s), poivrer.\n4. Couvrir enti\u00e8rement de fromage r\u00e2p\u00e9 (ou de tranches si type reblochon).\n5. Four 20-25 min jusqu\u2019\u00e0 ce que le dessus soit bien gratin\u00e9 et bouillonnant sur les bords.', t:40},

// --- MEXICAIN ---
{id:'r-tacos-boeuf', n:'Tacos au bœuf', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:170},{id:'tortilla',g:80},{id:'salade',g:30},{id:'tomate',g:60},{id:'emmental',g:30}], steps:'1. Faire revenir le bœuf hach\u00e9 \u00e0 feu vif 6-8 min avec des \u00e9pices tex-mex (cumin, paprika, un peu de piment) jusqu\u2019\u00e0 bien color\u00e9 et l\u00e9g\u00e8rement croustillant sur les bords \u2014 c\u2019est cette caram\u00e9lisation qui fait le go\u00fbt.\n2. R\u00e9chauffer les tortillas quelques secondes \u00e0 la po\u00eale s\u00e8che (\u00e7a les rend plus souples et parfum\u00e9es qu\u2019utilis\u00e9es froides).\n3. Garnir avec la viande, salade, tomate en d\u00e9s et fromage r\u00e2p\u00e9. Un filet de citron vert ou de sauce piquante si dispo r\u00e9veille bien l\u2019ensemble.', t:18},
{id:'r-burrito-bowl-poulet', n:'Burrito bowl poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'riz-blanc-cuit',g:200},{id:'haricotsrouges-cuits',g:120},{id:'avocat',g:60},{id:'tomate',g:80}], steps:'1. Poêler le poulet en d\u00e9s \u00e0 feu vif avec un peu de cumin et de paprika 8-10 min jusqu\u2019\u00e0 belle coloration.\n2. R\u00e9chauffer les haricots rouges avec un peu de leur jus.\n3. Dresser le riz en bol, r\u00e9partir poulet, haricots, avocat en tranches et tomate en d\u00e9s en sections distinctes plut\u00f4t que m\u00e9lang\u00e9es \u2014 \u00e7a garde chaque \u00e9l\u00e9ment lisible en bouche. Un filet de citron vert termine bien le plat.', t:20},
{id:'r-quesadillas-poulet', n:'Quesadillas poulet, fromage', cat:'dejeuner', ing:[{id:'poulet-cuit',g:130},{id:'tortilla',g:120},{id:'emmental',g:60},{id:'poivron',g:60}], steps:'1. Faire revenir le poivron en lani\u00e8res 3-4 min pour l\u2019attendrir avant de garnir (cru, il resterait trop croquant \u00e0 la cuisson courte de la quesadilla).\n2. Garnir une tortilla de poulet effiloch\u00e9, fromage r\u00e2p\u00e9 et poivron, refermer avec une seconde tortilla.\n3. Cuire \u00e0 la po\u00eale \u00e0 feu moyen 2-3 min de chaque c\u00f4t\u00e9 en pressant légèrement \u00e0 la spatule \u2014 le fromage doit fondre avant que la tortilla ne br\u00fble. D\u00e9couper en quartiers pour servir.', t:15},

// --- AUTRES ---
{id:'r-couscous-poulet-merguez', n:'Couscous poulet, merguez', cat:'dejeuner', ing:[{id:'poulet-cru',g:120},{id:'merguez-crue',g:100},{id:'semoule-cuite',g:220},{id:'carotte',g:100},{id:'poischiches-cuits',g:100}], steps:'1. Faire dorer le poulet et les carottes dans un peu d\u2019huile avec des \u00e9pices \u00e0 couscous (cumin, coriandre, un peu de harissa si aim\u00e9) 5-6 min.\n2. Couvrir de bouillon, ajouter les pois chiches, mijoter 25-30 min \u00e0 feu doux jusqu\u2019\u00e0 ce que le poulet soit tr\u00e8s tendre.\n3. Griller la merguez \u00e0 part \u00e0 la po\u00eale 10-12 min (la cuire s\u00e9par\u00e9ment \u00e9vite qu\u2019elle ne rende trop de gras dans le bouillon).\n4. Servir la semoule nap\u00e9e du bouillon chaud, avec le poulet, les pois chiches et la merguez \u00e0 c\u00f4t\u00e9.', t:40},
{id:'r-paella-poulet-fruitsdemer', n:'Paella poulet, fruits de mer', cat:'dejeuner', ing:[{id:'poulet-cru',g:130},{id:'crevettes-cuites',g:100},{id:'moules-cuites',g:100},{id:'riz-blanc-cru',g:100},{id:'poivron',g:80}], steps:'1. Faire dorer le poulet en morceaux dans une grande po\u00eale ou paell\u00e9ra 6-8 min.\n2. Ajouter le poivron, saisir 2-3 min.\n3. Ajouter le riz cru, remuer 1 min pour l\u2019enrober, puis mouiller avec le bouillon chaud safran\u00e9 (environ le double du volume de riz).\n4. \u00c9tape cl\u00e9 : \u00e0 partir de maintenant, **ne plus remuer** \u2014 c\u2019est ce qui laisse se former le \"socarrat\", la fine cro\u00fbte caram\u00e9lis\u00e9e au fond qui fait le go\u00fbt de la paella. Cuire \u00e0 feu moyen puis doux, 18-20 min \u00e0 d\u00e9couvert.\n5. Ajouter crevettes et moules d\u00e9j\u00e0 cuites dans les 3-4 derni\u00e8res minutes juste pour r\u00e9chauffer. Laisser reposer 5 min hors du feu, couvert d\u2019un torchon, avant de servir.', t:35},
{id:'r-tzatziki-poulet-grec', n:'Poulet grec, tzatziki, pain pita', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'tzatziki',g:60},{id:'pain-blanc',g:70},{id:'tomate',g:60},{id:'salade',g:30}], steps:'1. Mariner le poulet en morceaux dans un peu d\u2019huile d\u2019olive, jus de citron, origan et ail si dispo \u2014 au moins 15-20 min.\n2. Griller \u00e0 feu vif 8-10 min jusqu\u2019\u00e0 belle coloration et cuisson compl\u00e8te \u00e0 cœur.\n3. R\u00e9chauffer le pain pita quelques secondes \u00e0 la po\u00eale ou au grille-pain pour qu\u2019il soit souple.\n4. Garnir avec le poulet, le tzatziki, la tomate et la salade.', t:20},

// --- INDIEN ---
{id:'r-poulet-korma', n:'Poulet korma, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'lait-coco',g:100},{id:'yaourtgrec',g:40},{id:'riz-basmati-cuit',g:200},{id:'oignon',g:50}], steps:'1. Faire revenir l\u2019oignon \u00e9minc\u00e9 finement \u00e0 feu doux 8-10 min jusqu\u2019\u00e0 ce qu\u2019il soit fondant et l\u00e9g\u00e8rement dor\u00e9 \u2014 c\u2019est cette base longuement cuite qui donne sa douceur au korma, ne pas pr\u00e9cipiter cette \u00e9tape.\n2. Ajouter des \u00e9pices (curcuma, cumin, coriandre en poudre) 30 sec pour les r\u00e9veiller dans la graisse, puis le poulet, saisir 3-4 min.\n3. Verser le lait de coco, mijoter 10 min \u00e0 couvert.\n4. Retirer du feu avant d\u2019incorporer le yaourt (le faire bouillir le ferait trancher), remuer.\n5. Servir sur le riz.', t:30},
{id:'r-biryani-poulet', n:'Biryani au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'riz-basmati-cru',g:90},{id:'yaourtgrec',g:50},{id:'oignon',g:60}], steps:'1. Mariner le poulet dans le yaourt et les \u00e9pices (curcuma, cumin, garam masala) au moins 20 min, id\u00e9alement plus longtemps.\n2. Faire dorer l\u2019oignon \u00e9minc\u00e9 \u00e0 feu moyen jusqu\u2019\u00e0 belle coloration dor\u00e9e (\u00e7a parfume toute la base) \u2014 r\u00e9server une partie pour la d\u00e9coration finale si souhait\u00e9.\n3. Ajouter le poulet marin\u00e9, saisir 5-6 min jusqu\u2019\u00e0 ce qu\u2019il soit color\u00e9.\n4. Ajouter le riz cru et l\u2019eau (environ 1,5x le volume de riz), saler.\n5. Porter \u00e0 \u00e9bullition puis couvrir herm\u00e9tiquement et baisser \u00e0 feu tr\u00e8s doux, cuire 18-20 min sans soulever le couvercle (la vapeur emprisonn\u00e9e cuit le riz par le haut). Laisser reposer 5 min avant d\u2019ouvrir et de m\u00e9langer d\u00e9licatement.', t:35},
{id:'r-saag-paneer', n:'Saag paneer (\u00e9pinards, paneer)', cat:'dejeuner', ing:[{id:'paneer',g:150},{id:'epinards',g:250},{id:'cremelegere',g:50},{id:'riz-basmati-cuit',g:180}], steps:'1. Faire tomber les \u00e9pinards \u00e0 la po\u00eale 3-4 min avec de l\u2019ail et du gingembre si dispo \u2014 c\u2019est ce duo qui fait tout le parfum du plat.\n2. Mixer grossi\u00e8rement (pas totalement lisse, on veut garder un peu de texture).\n3. Faire dorer le paneer en d\u00e9s \u00e0 part 3-4 min dans une po\u00eale s\u00e8che ou l\u00e9g\u00e8rement huil\u00e9e jusqu\u2019\u00e0 ce qu\u2019il forme une lég\u00e8re cro\u00fbte dor\u00e9e \u2014 \u00e7a lui donne du caract\u00e8re face aux \u00e9pinards.\n4. R\u00e9unir \u00e9pinards, paneer dor\u00e9 et cr\u00e8me, chauffer 3-5 min \u00e0 feu doux. Servir sur le riz.', t:20},
{id:'r-chicken-tikka', n:'Chicken tikka, naan', cat:'dejeuner', ing:[{id:'poulet-cru',g:170},{id:'yaourtgrec',g:60},{id:'naan',g:90},{id:'salade',g:30}], steps:'1. Mariner le poulet en morceaux dans le yaourt avec des \u00e9pices tandoori (ou \u00e0 d\u00e9faut curcuma, paprika, cumin, un peu de jus de citron) \u2014 le yaourt attendrit la viande en plus de la parfumer. Au moins 20 min, id\u00e9alement plusieurs heures ou une nuit.\n2. Griller \u00e0 feu vif (po\u00eale bien chaude ou four/grill) 10-12 min en retournant, jusqu\u2019\u00e0 obtenir de belles marques color\u00e9es par endroits \u2014 c\u2019est cette coloration qui fait le go\u00fbt caract\u00e9ristique du tikka.\n3. R\u00e9chauffer le naan quelques instants (po\u00eale s\u00e8che ou grille-pain). Servir avec la salade.', t:25},
{id:'r-dahl-epice-paneer', n:'Dahl de lentilles \u00e9pic\u00e9, paneer', cat:'dejeuner', ing:[{id:'lentilles-cuites',g:220},{id:'paneer',g:100},{id:'lait-coco',g:60},{id:'riz-basmati-cuit',g:150}], steps:'1. Faire dorer le paneer en d\u00e9s \u00e0 part 3-4 min dans une po\u00eale jusqu\u2019\u00e0 l\u00e9g\u00e8re cro\u00fbte, r\u00e9server (\u00e7a lui donne une meilleure tenue que de le jeter cru dans le dahl).\n2. Chauffer les lentilles avec le lait de coco et des \u00e9pices (curcuma, cumin) 8-10 min \u00e0 feu doux.\n3. Ajouter le paneer dor\u00e9 en fin de cuisson juste pour r\u00e9chauffer. Servir sur le riz.', t:20},

// --- CHINOIS ---
{id:'r-poulet-ananas', n:'Poulet \u00e0 l\u2019ananas, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'ananas',g:120},{id:'poivron',g:80},{id:'saucesoja',g:15},{id:'riz-basmati-cuit',g:200}], steps:'1. Saisir le poulet en morceaux \u00e0 feu vif 6-8 min jusqu\u2019\u00e0 bien color\u00e9, r\u00e9server.\n2. Saisir poivron et ananas 3-4 min dans la m\u00eame po\u00eale pour les caram\u00e9liser légèrement.\n3. Remettre le poulet, d\u00e9glacer \u00e0 la sauce soja, m\u00e9langer 2 min \u00e0 feu vif. Servir sur le riz.', t:20},
{id:'r-boeuf-huitres', n:'Bœuf sauce aux hu\u00eetres, br\u00f4coli', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:150},{id:'brocoli',g:150},{id:'saucesoja',g:15},{id:'riz-basmati-cuit',g:180}], steps:'1. Couper le bœuf en fines lamelles, saisir \u00e0 feu tr\u00e8s vif 1-2 min seulement (il continue de cuire hors du feu), r\u00e9server.\n2. Faire sauter le brocoli 3-4 min, remettre le bœuf avec la sauce soja, m\u00e9langer 1 min. Servir sur le riz.', t:18},
{id:'r-porc-caramel', n:'Porc au caramel (asiatique), riz', cat:'dejeuner', ing:[{id:'porc-filet',g:170},{id:'saucesoja',g:20},{id:'miel',g:15},{id:'riz-basmati-cuit',g:200}], steps:'1. Faire dorer le porc en cubes \u00e0 feu vif 5-6 min sur toutes les faces.\n2. Ajouter sauce soja et miel, baisser \u00e0 feu doux, laisser caram\u00e9liser 8-10 min en remuant r\u00e9guli\u00e8rement \u2014 surveiller en fin de cuisson, le miel br\u00fble vite. Servir sur le riz.', t:25},
{id:'r-riz-cantonais-classique', n:'Riz cantonais classique', cat:'dejeuner', ing:[{id:'riz-basmati-cuit',g:250},{id:'jambonblanc',g:80},{id:'oeuf',g:55},{id:'petitspois',g:60},{id:'saucesoja',g:15}], steps:'1. Cuire l\u2019œuf brouill\u00e9 \u00e0 part \u00e0 feu doux, r\u00e9server.\n2. Sauter le riz \u00e0 feu vif avec le jambon en d\u00e9s et les petits pois \u2014 id\u00e9alement avec du riz de la veille, moins collant.\n3. Ajouter l\u2019œuf et la sauce soja, m\u00e9langer 1 min.', t:15},
{id:'r-nems-poulet', n:'Nems au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'carotte',g:60},{id:'saucesoja',g:10},{id:'huile-olive',g:15}], steps:'1. M\u00e9langer le poulet hach\u00e9 (ou tr\u00e8s finement coup\u00e9) avec la carotte r\u00e2p\u00e9e et la sauce soja.\n2. Tremper une feuille de riz quelques secondes dans l\u2019eau ti\u00e8de jusqu\u2019\u00e0 ce qu\u2019elle s\u2019assouplisse (pas plus, elle continue de ramollir en dehors de l\u2019eau et se d\u00e9chirerait si trop tremp\u00e9e), poser sur un torchon humide.\n3. D\u00e9poser une petite quantit\u00e9 de farce en bas de la feuille, replier les c\u00f4t\u00e9s vers le centre, puis rouler serré depuis le bas.\n4. Chauffer l\u2019huile dans une po\u00eale \u00e0 feu moyen, cuire les nems 8-10 min en les retournant r\u00e9guli\u00e8rement jusqu\u2019\u00e0 ce qu\u2019ils soient dor\u00e9s partout et la farce cuite \u00e0 cœur.\n5. \u00c9goutter sur papier absorbant avant de servir.', t:25},

// --- CORÉEN ---
{id:'r-bibimbap-boeuf', n:'Bibimbap au bœuf', cat:'dejeuner', ing:[{id:'boeuf-hache5',g:150},{id:'riz-blanc-cuit',g:200},{id:'oeuf',g:55},{id:'carotte',g:60},{id:'epinards',g:60},{id:'gochujang',g:15}], steps:'1. Saisir le bœuf hach\u00e9 \u00e0 feu vif 4-5 min avec un peu de sauce soja et d\u2019ail si dispo, jusqu\u2019\u00e0 bien color\u00e9. R\u00e9server.\n2. Faire sauter s\u00e9par\u00e9ment la carotte en b\u00e2tonnets (2-3 min, encore croquante) et les \u00e9pinards (1-2 min, juste flétris) \u2014 les garder distincts pr\u00e9serve le contraste de textures qui fait le charme du plat.\n3. Cuire un œuf au plat avec le jaune bien coulant.\n4. Dresser tous les \u00e9l\u00e9ments en cercles s\u00e9par\u00e9s autour du riz dans un bol, œuf au centre, gochujang \u00e0 c\u00f4t\u00e9. M\u00e9langer le tout seulement au moment de manger.', t:20},
{id:'r-poulet-bulgogi', n:'Poulet bulgogi, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'saucesoja',g:20},{id:'miel',g:10},{id:'ail',g:8},{id:'riz-blanc-cuit',g:200}], steps:'1. Mariner le poulet en fines tranches dans la sauce soja, le miel et l\u2019ail \u00e9cras\u00e9 \u2014 au moins 20 min, id\u00e9alement 1-2h : c\u2019est ce temps de repos qui fait toute la diff\u00e9rence sur un bulgogi.\n2. Saisir \u00e0 feu vif 6-8 min par petites quantit\u00e9s (pas tout d\u2019un coup) pour bien caram\u00e9liser sans faire bouillir la marinade.\n3. Servir sur le riz, avec un peu de graines de s\u00e9same si dispo.', t:20},
{id:'r-kimchi-riz-saute', n:'Riz saut\u00e9 au kimchi et porc', cat:'dejeuner', ing:[{id:'porc-filet',g:130},{id:'kimchi',g:100},{id:'riz-blanc-cuit',g:220},{id:'oeuf',g:55}], steps:'1. Faire revenir le porc en d\u00e9s \u00e0 feu vif 5-6 min jusqu\u2019\u00e0 coloration.\n2. Ajouter le kimchi coup\u00e9 (avec un peu de son jus, riche en go\u00fbt), saut\u00e9r 2 min pour le r\u00e9chauffer et intensifier sa saveur.\n3. Ajouter le riz, bien l\u2019enrober, laisser un peu accrocher au fond de la po\u00eale sans remuer 1-2 min pour un léger croustillant (comme le riz du fond d\u2019un bibimbap).\n4. Servir avec un œuf au plat au jaune coulant dessus.', t:18},

// --- VIETNAMIEN ---
{id:'r-bobun-boeuf', n:'Bo bun au bœuf', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:150},{id:'nouilles-chinoises-cuites',g:180},{id:'carotte',g:50},{id:'concombre',g:80},{id:'saucesoja',g:15}], steps:'1. Couper le bœuf en fines lani\u00e8res, mariner quelques minutes dans un peu de sauce soja et d\u2019ail \u00e9cras\u00e9 si dispo.\n2. Saisir \u00e0 feu tr\u00e8s vif 1-2 min seulement \u2014 le bo bun se mange avec un bœuf juste saisi, pas cuit \u00e0 cœur.\n3. Couper carotte et concombre en fine julienne (\u00e0 la mandoline si possible pour la finesse).\n4. Dresser les nouilles froides ou tièdes en bol avec les l\u00e9gumes crus et le bœuf, arroser de sauce (nuoc-m\u00e2m/sauce soja allong\u00e9e d\u2019un peu d\u2019eau, de sucre et de citron vert si possible pour l\u2019\u00e9quilibre aigre-doux typique du plat). Parsemer de cacahu\u00e8tes concass\u00e9es et d\u2019herbes fra\u00eeches si dispo.', t:18},
{id:'r-pho-poulet', n:'Pho au poulet', cat:'dejeuner', ing:[{id:'poulet-cuit',g:150},{id:'nouilles-udon-cuites',g:200},{id:'oignon',g:40},{id:'saucesoja',g:10}], steps:'1. Le secret du go\u00fbt authentique : faire griller l\u2019oignon coup\u00e9 en deux et un morceau de gingembre directement \u00e0 sec dans une po\u00eale bien chaude (ou sous le grill du four) 5-7 min jusqu\u2019\u00e0 ce qu\u2019ils noircissent par endroits \u2014 cette l\u00e9g\u00e8re carbonisation donne le go\u00fbt caract\u00e9ristique du bouillon, ne pas sauter cette \u00e9tape.\n2. Si vous avez des \u00e9pices enti\u00e8res (badiane, cannelle, clou de girofle), les torr\u00e9fier \u00e0 sec 1-2 min dans une po\u00eale jusqu\u2019\u00e0 ce qu\u2019elles embaument \u2014 elles deviennent amères si on les laisse br\u00fbler.\n3. Porter le bouillon \u00e0 fr\u00e9missement avec l\u2019oignon et le gingembre grill\u00e9s, les \u00e9pices, un trait de nuoc-m\u00e2m ou de sauce soja. Laisser infuser 15-20 min \u00e0 feu doux.\n4. Filtrer le bouillon, y plonger les nouilles 2 min.\n5. R\u00e9partir le poulet effiloch\u00e9 dans les bols, verser le bouillon chaud filtr\u00e9. Servir avec des herbes fra\u00eeches (coriandre, basilic thai si dispo), du citron vert et du piment \u00e0 table pour que chacun ajuste.', t:25},

// --- ESPAGNOL ---
{id:'r-poulet-espagnole', n:'Poulet \u00e0 l\u2019espagnole (poivrons, tomate)', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'poivron',g:150},{id:'tomate',g:100},{id:'riz-blanc-cuit',g:180}], steps:'1. Faire dorer le poulet \u00e0 feu vif 5-6 min sur toutes les faces.\n2. Ajouter poivrons et tomate coup\u00e9s, mijoter \u00e0 couvert 20-25 min \u00e0 feu doux jusqu\u2019\u00e0 ce que le poulet soit tr\u00e8s tendre et la sauce l\u00e9g\u00e8rement r\u00e9duite. Servir sur le riz.', t:35},

// --- GREC / MÉDITERRANÉEN ---
{id:'r-souvlaki-poulet', n:'Souvlaki de poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'pain-blanc',g:70},{id:'tzatziki',g:50},{id:'tomate',g:50},{id:'oignon',g:30}], steps:'1. Couper le poulet en cubes r\u00e9guliers, mariner dans huile d\u2019olive, jus de citron, origan et ail \u00e9cras\u00e9 si dispo \u2014 20 min minimum, id\u00e9alement plus.\n2. Enfiler en brochettes, griller \u00e0 feu vif 10-12 min en retournant r\u00e9guli\u00e8rement jusqu\u2019\u00e0 belle coloration sur toutes les faces.\n3. R\u00e9chauffer le pain, garnir avec le poulet, le tzatziki, la tomate et l\u2019oignon \u00e9minc\u00e9.', t:25},
{id:'r-moussaka', n:'Moussaka', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:180},{id:'aubergine',g:250},{id:'bechamel',g:150},{id:'coulistomate',g:100},{id:'emmental',g:40}], steps:'1. Couper l\u2019aubergine en tranches, les faire griller \u00e0 la po\u00eale ou au four quelques minutes de chaque c\u00f4t\u00e9 jusqu\u2019\u00e0 ce qu\u2019elles soient tendres et légèrement dor\u00e9es (l\u2019aubergine crue reste ferme et amère dans le plat fini).\n2. Faire revenir le bœuf hach\u00e9 5 min, ajouter le coulis de tomate, saler, poivrer, mijoter 15 min \u00e0 d\u00e9couvert jusqu\u2019\u00e0 ce que \u00e7a \u00e9paississe.\n3. Pr\u00e9chauffer le four \u00e0 200\u00b0C.\n4. Monter en couches dans un plat : aubergine, viande, aubergine (r\u00e9p\u00e9ter selon la hauteur du plat).\n5. Napper enti\u00e8rement de b\u00e9chamel, parsemer de fromage. Four 30 min \u00e0 200\u00b0C jusqu\u2019\u00e0 ce que le dessus soit bien dor\u00e9. Laisser reposer 5-10 min avant de couper \u2014 \u00e7a se tient mieux.', t:55},
{id:'r-salade-grecque-complete', n:'Salade grecque compl\u00e8te', cat:'dejeuner', ing:[{id:'feta',g:80},{id:'concombre',g:150},{id:'tomate',g:150},{id:'olives',g:30},{id:'huile-olive',g:12}], steps:'1. Couper concombre et tomate en gros morceaux (la vraie salade grecque \u00e9vite les petits d\u00e9s, les gros morceaux gardent plus de jus et de caract\u00e8re).\n2. Disposer la feta en une seule tranche \u00e9paisse par-dessus plut\u00f4t qu\u2019\u00e9miett\u00e9e, ajouter les olives.\n3. Arroser g\u00e9n\u00e9reusement d\u2019huile d\u2019olive et d\u2019origan sec juste avant de servir \u2014 pas besoin de vinaigre, l\u2019acidit\u00e9 de la tomate suffit.', t:10},

// --- MOYEN-ORIENT / LIBANAIS ---
{id:'r-chawarma-poulet', n:'Chawarma de poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'pain-blanc',g:70},{id:'salade',g:30},{id:'tomate',g:50},{id:'houmous',g:30}], steps:'1. Mariner le poulet en lamelles avec des \u00e9pices chawarma (cumin, curcuma, paprika, cannelle si dispo) et un peu d\u2019huile, 20 min minimum.\n2. Saisir \u00e0 feu vif 8-10 min jusqu\u2019\u00e0 ce que les bords soient bien caram\u00e9lis\u00e9s.\n3. R\u00e9chauffer le pain, garnir avec le poulet, salade, tomate et houmous.', t:22},
{id:'r-taboule-poulet', n:'Taboul\u00e9 au poulet', cat:'dejeuner', ing:[{id:'semoule-cuite',g:180},{id:'poulet-cuit',g:130},{id:'tomate',g:120},{id:'concombre',g:80},{id:'citron',g:20},{id:'huile-olive',g:10}], steps:'1. Couper tomate et concombre en tr\u00e8s petits d\u00e9s (le vrai taboul\u00e9 libanais mise sur des l\u00e9gumes finement coup\u00e9s).\n2. M\u00e9langer avec la semoule, le poulet effiloch\u00e9, le jus de citron et l\u2019huile.\n3. Laisser reposer 10 min au frais avant de servir si possible \u2014 \u00e7a laisse le citron p\u00e9n\u00e9trer.', t:15},
{id:'r-kefta-boeuf', n:'Kefta de bœuf, salade', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:180},{id:'oignon',g:40},{id:'salade',g:50},{id:'pain-blanc',g:60}], steps:'1. M\u00e9langer le bœuf hach\u00e9 avec l\u2019oignon tr\u00e8s finement r\u00e2p\u00e9 (\u00e7a s\u2019incorpore mieux que hach\u00e9) et des \u00e9pices (cumin, persil hach\u00e9, une pointe de piment si aim\u00e9).\n2. Former des brochettes allong\u00e9es en pressant bien la viande pour qu\u2019elle tienne \u00e0 la cuisson.\n3. Griller \u00e0 feu vif 8-10 min en retournant, jusqu\u2019\u00e0 belle coloration ext\u00e9rieure. Servir avec salade et pain.', t:20},

// --- NORD-AFRICAIN ---
{id:'r-tajine-poulet-olives', n:'Tajine de poulet, olives, citron', cat:'dejeuner', ing:[{id:'poulet-cuisse-cru',g:200},{id:'olives',g:40},{id:'citron',g:30},{id:'oignon',g:60},{id:'semoule-cuite',g:180}], steps:'1. Faire dorer le poulet avec l\u2019oignon \u00e9minc\u00e9 5-6 min \u00e0 feu moyen-vif dans un peu d\u2019huile, avec les \u00e9pices (gingembre, curcuma, cumin).\n2. Ajouter un peu d\u2019eau (juste de quoi mouiller le fond), couvrir, baisser \u00e0 feu doux.\n3. Mijoter 30-35 min en v\u00e9rifiant de temps en temps que \u00e7a n\u2019attache pas \u2014 le poulet doit se d\u00e9tacher facilement de l\u2019os.\n4. Ajouter olives et citron (en quartiers ou zeste) dans les 10 derni\u00e8res minutes seulement, pour qu\u2019ils gardent leur peps sans devenir amers.\n5. Servir avec la semoule.', t:45},
{id:'r-tajine-agneau-pruneaux', n:'Tajine d\u2019agneau aux pruneaux', cat:'dejeuner', ing:[{id:'agneau-gigot-cru',g:200},{id:'pruneaux',g:60},{id:'oignon',g:60},{id:'semoule-cuite',g:180}], steps:'1. Faire dorer l\u2019agneau en morceaux sur toutes les faces \u00e0 feu vif 5-6 min \u2014 cette coloration est essentielle pour le go\u00fbt.\n2. Ajouter l\u2019oignon \u00e9minc\u00e9 et les \u00e9pices (cannelle, gingembre), faire revenir 2-3 min.\n3. Couvrir d\u2019eau \u00e0 mi-hauteur, couvrir, baisser \u00e0 feu doux, mijoter 35-40 min.\n4. Ajouter les pruneaux dans les 10-15 derni\u00e8res minutes pour qu\u2019ils gonflent sans se d\u00e9faire compl\u00e8tement.\n5. La viande doit \u00eatre fondante \u00e0 la fourchette. Si la sauce est trop liquide, r\u00e9duire \u00e0 d\u00e9couvert quelques minutes. Servir avec la semoule.', t:55},
{id:'r-chakchouka-merguez', n:'Chakchouka aux merguez', cat:'dejeuner', ing:[{id:'merguez-crue',g:120},{id:'oeuf',g:110},{id:'coulistomate',g:180},{id:'poivron',g:100}], steps:'1. Faire dorer les merguez en tron\u00e7ons 5-6 min \u00e0 feu moyen-vif, r\u00e9server.\n2. Dans la m\u00eame po\u00eale (avec le gras parfum\u00e9 des merguez), faire revenir le poivron 4-5 min.\n3. Ajouter le coulis, saler légèrement (les merguez sont d\u00e9j\u00e0 \u00e9pic\u00e9es-sal\u00e9es), mijoter 8-10 min jusqu\u2019\u00e0 l\u00e9g\u00e8re r\u00e9duction.\n4. Remettre les merguez, creuser des puits, casser les œufs dedans, couvrir 5-6 min \u00e0 feu doux jusqu\u2019\u00e0 cuisson d\u00e9sir\u00e9e du jaune.', t:25},

// --- AMÉRICAIN ---
{id:'r-poulet-frit-pane', n:'Poulet frit pan\u00e9, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:170},{id:'chapelure',g:40},{id:'oeuf',g:55},{id:'riz-blanc-cuit',g:180}], steps:'1. Couper le poulet en morceaux de taille r\u00e9guli\u00e8re pour une cuisson uniforme, saler, poivrer.\n2. Tremper chaque morceau dans l\u2019œuf battu en l\u2019\u00e9gouttant l\u00e9g\u00e8rement, puis dans la chapelure en pressant bien pour qu\u2019elle accroche partout.\n3. Poser sur une assiette sans empiler (la panure ramollirait au contact).\n4. Cuire \u00e0 la po\u00eale avec un peu d\u2019huile \u00e0 feu moyen (pas vif, la panure br\u00fblerait avant que l\u2019int\u00e9rieur cuise), 4-5 min de chaque face selon l\u2019\u00e9paisseur.\n5. V\u00e9rifier la cuisson en coupant le plus gros morceau : la chair doit \u00eatre blanche partout, sans rose. Servir avec le riz.', t:25},
{id:'r-mac-and-cheese', n:'Mac and cheese', cat:'dejeuner', ing:[{id:'pates-cuites',g:250},{id:'cheddar',g:100},{id:'lait-demi',g:100},{id:'beurre',g:15}], steps:'1. Faire fondre le beurre \u00e0 feu doux, ajouter le lait progressivement en fouettant.\n2. Baisser \u00e0 feu tr\u00e8s doux avant d\u2019ajouter le cheddar r\u00e2p\u00e9 petit \u00e0 petit, en remuant jusqu\u2019\u00e0 fonte compl\u00e8te entre chaque ajout \u2014 trop de chaleur d\u2019un coup rend la sauce granuleuse au lieu de lisse.\n3. M\u00e9langer avec les p\u00e2tes chaudes encore \u00e9gout\u00e9es. Poivrer g\u00e9n\u00e9reusement.', t:20},
{id:'r-burger-classique', n:'Burger classique bœuf-cheddar', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:150},{id:'pain-burger',g:90},{id:'cheddar',g:30},{id:'salade',g:20},{id:'ketchup',g:15}], steps:'1. Former un steak sans trop tasser la viande (\u00e7a le rend dur \u00e0 la cuisson), saler juste avant de cuire.\n2. Poêler \u00e0 feu vif 3-4 min de chaque c\u00f4t\u00e9 sans presser la viande \u00e0 la spatule (\u00e7a fait perdre le jus), poser le cheddar dessus dans la derni\u00e8re minute pour qu\u2019il fonde.\n3. Griller légèrement l\u2019int\u00e9rieur du pain \u00e0 la po\u00eale 30 sec \u2014 \u00e7a \u00e9vite qu\u2019il d\u00e9trempe. Monter avec salade et ketchup.', t:15},
{id:'r-club-sandwich', n:'Club sandwich poulet, bacon', cat:'dejeuner', ing:[{id:'pain-mie-complet',g:90},{id:'poulet-cuit',g:120},{id:'lardons',g:50},{id:'salade',g:20},{id:'mayonnaise',g:15}], steps:'1. Faire dorer les lardons jusqu\u2019\u00e0 bien croustillants.\n2. Griller les tranches de pain de mie \u2014 c\u2019est ce qui donne au club sandwich sa tenue caract\u00e9ristique.\n3. Monter en \u00e9tages : pain, mayonnaise, poulet, salade, pain, mayonnaise, lardons, salade, pain. Presser légèrement avant de couper en triangles.', t:15},

// --- BRÉSILIEN ---
{id:'r-feijoada', n:'Feijoada simplifi\u00e9e (haricots noirs, porc)', cat:'dejeuner', ing:[{id:'porc-filet',g:150},{id:'haricotsnoirs-cuits',g:250},{id:'lardons',g:50},{id:'riz-blanc-cuit',g:180}], steps:'1. Faire dorer le porc en d\u00e9s et les lardons ensemble 5-6 min \u00e0 feu moyen-vif jusqu\u2019\u00e0 belle coloration.\n2. Ajouter les haricots noirs avec un peu de leur jus, m\u00e9langer.\n3. Mijoter \u00e0 couvert 20 min \u00e0 feu doux, en \u00e9crasant l\u00e9g\u00e8rement une partie des haricots \u00e0 la cuill\u00e8re pour \u00e9paissir naturellement la sauce.\n4. Go\u00fbter et rectifier l\u2019assaisonnement (les lardons apportent d\u00e9j\u00e0 du sel).\n5. Servir avec le riz.', t:35},

// --- CLASSIQUES / VARIANTES SUPPLÉMENTAIRES ---
{id:'r-poulet-moutarde', n:'Poulet \u00e0 la moutarde, riz', cat:'dejeuner', ing:[{id:'poulet-cuisse-cru',g:200},{id:'moutarde',g:25},{id:'cremelegere',g:50},{id:'riz-basmati-cuit',g:180}], steps:'1. Enduire le poulet de moutarde, saisir 6-8 min de chaque c\u00f4t\u00e9 \u00e0 feu moyen jusqu\u2019\u00e0 belle coloration \u2014 la moutarde caram\u00e9lise l\u00e9g\u00e8rement et parfume la peau.\n2. Baisser le feu, ajouter la cr\u00e8me en grattant les sucs de cuisson, mijoter 5 min.\n3. V\u00e9rifier la cuisson \u00e0 cœur (jus clair). Servir sur le riz.', t:25},
{id:'r-poulet-chasseur', n:'Poulet chasseur, champignons', cat:'dejeuner', ing:[{id:'poulet-cuisse-cru',g:200},{id:'champignons-cuits',g:150},{id:'coulistomate',g:100},{id:'riz-basmati-cuit',g:180}], steps:'1. Faire dorer le poulet c\u00f4t\u00e9 peau en premier, 4-5 min \u00e0 feu moyen-vif, jusqu\u2019\u00e0 une belle couleur dor\u00e9e \u2014 c\u2019est cette coloration qui donne le go\u00fbt, ne pas la sauter.\n2. Retourner, saisir l\u2019autre face 2-3 min.\n3. Ajouter les champignons et le coulis de tomate, saler, poivrer.\n4. Couvrir, baisser \u00e0 feu doux, mijoter 25 min jusqu\u2019\u00e0 ce que le poulet se d\u00e9tache facilement de l\u2019os.\n5. En fin de cuisson, retirer le couvercle 5 min \u00e0 feu un peu plus vif si la sauce est trop liquide, pour la faire r\u00e9duire. Servir sur le riz.', t:35},
{id:'r-escalope-milanaise', n:'Escalope milanaise, spaghetti', cat:'dejeuner', ing:[{id:'poulet-cru',g:170},{id:'chapelure',g:40},{id:'oeuf',g:55},{id:'pates-cuites',g:200},{id:'coulistomate',g:100}], steps:'1. Aplatir l\u2019escalope entre deux feuilles de papier cuisson (avec un rouleau ou le plat d\u2019une casserole) pour une \u00e9paisseur r\u00e9guli\u00e8re \u2014 \u00e7a garantit une cuisson uniforme sans ass\u00e9cher les bords.\n2. Saler, poivrer, tremper dans l\u2019œuf battu puis la chapelure en pressant bien.\n3. Poêler dans un peu d\u2019huile \u00e0 feu moyen 4-5 min de chaque c\u00f4t\u00e9, jusqu\u2019\u00e0 panure dor\u00e9e et croustillante.\n4. V\u00e9rifier la cuisson \u00e0 cœur en entaillant le centre.\n5. Servir avec les p\u00e2tes chaudes napp\u00e9es de coulis de tomate r\u00e9chauff\u00e9.', t:25},
{id:'r-boeuf-bourguignon', n:'Bœuf bourguignon, pommes de terre', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:200},{id:'lardons',g:50},{id:'carotte',g:100},{id:'champignons-cuits',g:100},{id:'ail',g:8},{id:'vin-rouge-cuisine',g:150},{id:'pdt-cuite',g:200}], steps:'1. Faire revenir les lardons 3-4 min pour lib\u00e9rer leur gras, r\u00e9server. Dans ce m\u00eame gras, faire dorer la viande \u00e0 feu vif sur toutes les faces, par petites quantit\u00e9s \u00e0 la fois (trop de viande d\u2019un coup fait bouillir au lieu de dorer).\n2. Ajouter l\u2019ail \u00e9cras\u00e9 et les carottes en rondelles, saisir 2-3 min.\n3. Verser le vin, gratter le fond de la po\u00eale avec une spatule pour d\u00e9coller les sucs (\u00e7a concentre le go\u00fbt de la sauce). Ajouter du thym et une feuille de laurier si disponibles (le vrai bouquet garni de la recette traditionnelle) \u2014 \u00e7a change vraiment le r\u00e9sultat.\n4. Couvrir, baisser \u00e0 feu tr\u00e8s doux, mijoter 1h30 \u00e0 2h \u2014 la viande doit devenir fondante, pas juste tendre. V\u00e9rifier de temps en temps que \u00e7a ne manque pas de liquide.\n5. Ajouter les champignons et les lardons r\u00e9serv\u00e9s dans la derni\u00e8re demi-heure. Servir avec les pommes de terre. Astuce de cuisiniers : ce plat est encore meilleur le lendemain, une fois qu\u2019il a eu le temps de reposer une nuit au frais \u2014 les saveurs se lient et s\u2019approfondissent.', t:130},
{id:'r-porc-ananas', n:'Saut\u00e9 de porc \u00e0 l\u2019ananas, riz', cat:'dejeuner', ing:[{id:'porc-filet',g:170},{id:'ananas',g:120},{id:'poivron',g:80},{id:'riz-basmati-cuit',g:200}], steps:'1. Couper le porc en cubes, saisir \u00e0 feu vif 5-6 min jusqu\u2019\u00e0 bien color\u00e9, r\u00e9server.\n2. Saisir le poivron 2-3 min dans la m\u00eame po\u00eale, ajouter l\u2019ananas en morceaux 2 min pour le caram\u00e9liser légèrement.\n3. Remettre le porc, m\u00e9langer 2 min \u00e0 feu vif. Un trait de sauce soja en fin de cuisson \u00e9quilibre bien le sucr\u00e9 de l\u2019ananas. Servir sur le riz.', t:20},
{id:'r-filet-mignon-champignons', n:'Filet mignon, sauce champignons', cat:'dejeuner', ing:[{id:'porc-filet',g:180},{id:'champignons-cuits',g:150},{id:'cremelegere',g:50},{id:'pdt-cuite',g:200}], steps:'1. Couper le filet mignon en tranches d\u2019environ 2 cm, saler et poivrer.\n2. Poêler \u00e0 feu moyen-vif 3-4 min de chaque c\u00f4t\u00e9 jusqu\u2019\u00e0 une belle coloration \u2014 le porc doit rester juste rosé \u00e0 cœur, pas sec. R\u00e9server au chaud.\n3. Dans la m\u00eame po\u00eale, faire revenir les champignons 4-5 min pour qu\u2019ils dorent et r\u00e9cup\u00e8rent les sucs de cuisson de la viande.\n4. Baisser le feu, ajouter la cr\u00e8me, laisser \u00e9paissir 1-2 min sans bouillir fort.\n5. Remettre la viande 1-2 min pour r\u00e9chauffer sans plus cuire. Servir avec les pommes de terre.', t:25},
{id:'r-cabillaud-sauce-vierge', n:'Cabillaud, sauce vierge', cat:'dejeuner', ing:[{id:'cabillaud-cru',g:180},{id:'tomate',g:100},{id:'huile-olive',g:12},{id:'citron',g:15},{id:'riz-basmati-cuit',g:180}], steps:'1. Couper la tomate en petits d\u00e9s \u00e9pép\u00e9s, m\u00e9langer avec l\u2019huile d\u2019olive, le jus de citron, sel et poivre \u2014 laisser mariner \u00e0 temp\u00e9rature ambiante pendant que le poisson cuit.\n2. S\u00e9cher le cabillaud avec du papier absorbant (\u00e7a \u00e9vite qu\u2019il rejette de l\u2019eau et bouillonne au lieu de dorer).\n3. Poêler c\u00f4t\u00e9 peau (ou premier c\u00f4t\u00e9) 4-5 min sans bouger le poisson, jusqu\u2019\u00e0 ce qu\u2019il se d\u00e9tache facilement.\n4. Retourner d\u00e9licatement, cuire 2-3 min de l\u2019autre c\u00f4t\u00e9 \u2014 la chair doit devenir opaque et se d\u00e9tacher en flocons \u00e0 la fourchette, pas translucide.\n5. Servir imm\u00e9diatement napp\u00e9 de sauce vierge encore fraîche, avec le riz.', t:20},
{id:'r-thon-grille-riz', n:'Thon grill\u00e9, riz', cat:'dejeuner', ing:[{id:'thon-cru',g:170},{id:'riz-basmati-cuit',g:180},{id:'huile-olive',g:8},{id:'citron',g:15}], steps:'1. Sortir le thon du frigo 10 min avant cuisson pour qu\u2019il ne soit pas glac\u00e9 (cuisson plus r\u00e9guli\u00e8re).\n2. Saler, poivrer, badigeonner d\u2019un peu d\u2019huile.\n3. Saisir dans une po\u00eale tr\u00e8s chaude 1-2 min de chaque c\u00f4t\u00e9 seulement \u2014 le thon continue de cuire en dehors du feu, et un thon trop cuit devient sec et fibreux. Viser un cœur encore rosé/rouge au centre.\n4. Laisser reposer 1 min avant de trancher.\n5. Servir avec le riz et un filet de citron press\u00e9 au moment de servir.', t:12},
{id:'r-dorade-citron', n:'Dorade, sauce citron', cat:'dejeuner', ing:[{id:'dorade-crue',g:200},{id:'citron',g:20},{id:'huile-olive',g:10},{id:'pdt-cuite',g:200}], steps:'1. S\u00e9cher le poisson avec du papier absorbant, inciser l\u00e9g\u00e8rement la peau en 2-3 endroits pour qu\u2019elle ne se r\u00e9tracte pas \u00e0 la cuisson.\n2. Saler, poivrer, cuire c\u00f4t\u00e9 peau en premier 6-8 min \u00e0 feu moyen sans bouger, jusqu\u2019\u00e0 ce que la peau soit dor\u00e9e et croustillante.\n3. Retourner d\u00e9licatement, cuire 4-5 min de l\u2019autre c\u00f4t\u00e9.\n4. V\u00e9rifier la cuisson : la chair doit se d\u00e9tacher facilement de l\u2019ar\u00eate et \u00eatre opaque jusqu\u2019au centre.\n5. Arroser de jus de citron et d\u2019un filet d\u2019huile juste avant de servir, avec les pommes de terre.', t:25},
{id:'r-truite-amandine', n:'Truite amandine', cat:'dejeuner', ing:[{id:'truite-crue',g:200},{id:'amandes',g:25},{id:'beurre',g:15},{id:'pdt-cuite',g:180}], steps:'1. S\u00e9cher la truite, saler et poivrer l\u2019int\u00e9rieur et l\u2019ext\u00e9rieur.\n2. Faire mousser le beurre dans une po\u00eale \u00e0 feu moyen (il ne doit pas noircir).\n3. Cuire la truite 4-5 min de chaque c\u00f4t\u00e9 en l\u2019arrosant r\u00e9guli\u00e8rement de beurre \u00e0 la cuill\u00e8re \u2014 la chair doit devenir opaque et se d\u00e9tacher facilement de l\u2019ar\u00eate centrale.\n4. R\u00e9server le poisson au chaud, ajouter les amandes effil\u00e9es dans le beurre restant, remuer 1-2 min \u00e0 feu doux jusqu\u2019\u00e0 coloration dor\u00e9e \u2014 elles br\u00fblent tr\u00e8s vite, ne pas s\u2019\u00e9loigner.\n5. Napper le poisson des amandes dor\u00e9es. Servir avec les pommes de terre.', t:20},
{id:'r-saumon-papillote', n:'Saumon en papillote, l\u00e9gumes', cat:'dejeuner', ing:[{id:'saumon-cru',g:170},{id:'courgette',g:100},{id:'carotte',g:80},{id:'citron',g:15}], steps:'1. Pr\u00e9chauffer le four \u00e0 200\u00b0C.\n2. D\u00e9couper un grand carr\u00e9 de papier cuisson, y d\u00e9poser les l\u00e9gumes coup\u00e9s en fines lamelles (plus fines = cuisson plus rapide et uniforme).\n3. Poser le saumon dessus, saler, poivrer, ajouter des tranches de citron.\n4. Refermer la papillote hermétiquement en repliant bien les bords \u2014 c\u2019est la vapeur emprisonn\u00e9e qui cuit le tout, une papillote mal ferm\u00e9e s\u00e8che le poisson.\n5. Four 18-20 min \u00e0 200\u00b0C. Ouvrir avec précaution en fin de cuisson (vapeur br\u00fblante qui s\u2019\u00e9chappe).', t:25},
{id:'r-croque-madame', n:'Croque madame', cat:'dejeuner', ing:[{id:'pain-mie-complet',g:80},{id:'jambonblanc',g:60},{id:'emmental',g:40},{id:'oeuf',g:55}], steps:'1. Monter le croque-monsieur (pain, jambon, fromage, pain), cuire 3-4 min de chaque c\u00f4t\u00e9 \u00e0 la po\u00eale \u00e0 feu moyen jusqu\u2019\u00e0 dor\u00e9 et fromage fondu.\n2. Cuire un œuf au plat \u00e0 c\u00f4t\u00e9, jaune encore coulant, le poser dessus.', t:15},
{id:'r-pates-pesto-poulet', n:'P\u00e2tes au pesto, poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'pates-cuites',g:220},{id:'pesto-vert',g:30},{id:'parmesan',g:15}], steps:'1. Poêler le poulet en d\u00e9s \u00e0 feu vif 8 min jusqu\u2019\u00e0 bien color\u00e9.\n2. M\u00e9langer avec les p\u00e2tes chaudes hors du feu (le pesto perd son go\u00fbt et sa couleur s\u2019il est cuit) et le parmesan.', t:20},
{id:'r-pates-crevettes', n:'P\u00e2tes aux crevettes, ail', cat:'dejeuner', ing:[{id:'crevettes-cuites',g:180},{id:'pates-cuites',g:220},{id:'ail',g:10},{id:'huile-olive',g:10},{id:'citron',g:10}], steps:'1. Faire revenir l\u2019ail \u00e9minc\u00e9 dans l\u2019huile \u00e0 feu doux 1 min sans le laisser br\u00fbler.\n2. Ajouter les crevettes 2-3 min seulement pour les r\u00e9chauffer (d\u00e9j\u00e0 cuites, trop de temps les rend caoutchouteuses). M\u00e9langer avec les p\u00e2tes et un filet de citron.', t:15},
{id:'r-tofu-legumes-sesame', n:'Po\u00eal\u00e9e de tofu, l\u00e9gumes, s\u00e9same', cat:'dejeuner', ing:[{id:'tofu',g:200},{id:'brocoli',g:120},{id:'carotte',g:80},{id:'huile-sesame',g:10},{id:'saucesoja',g:15}], steps:'1. S\u00e9cher le tofu en d\u00e9s (facilite le dorage), saut\u00e9r dans l\u2019huile de s\u00e9same \u00e0 feu vif jusqu\u2019\u00e0 cro\u00fbte dor\u00e9e, r\u00e9server.\n2. Saut\u00e9r les l\u00e9gumes 6-8 min, remettre le tofu, d\u00e9glacer \u00e0 la sauce soja.', t:18},
{id:'r-pates-saumonfume-citron', n:'P\u00e2tes au saumon fum\u00e9, cr\u00e8me, citron', cat:'dejeuner', ing:[{id:'saumonfume',g:100},{id:'pates-cuites',g:220},{id:'cremelegere',g:60},{id:'citron',g:10}], steps:'1. M\u00e9langer les p\u00e2tes chaudes avec la cr\u00e8me hors du feu (\u00e9vite qu\u2019elle tranche), le saumon fum\u00e9 en lani\u00e8res ajout\u00e9 en dernier (pour ne pas le cuire) et un filet de citron.', t:12},
{id:'r-salade-lentilles-saucisse', n:'Salade de lentilles, saucisse', cat:'dejeuner', ing:[{id:'lentilles-cuites',g:250},{id:'saucisse-toulouse-crue',g:120},{id:'oignon',g:40},{id:'vinaigrebalsa',g:10}], steps:'1. Poêler la saucisse 10-12 min \u00e0 feu moyen jusqu\u2019\u00e0 cuisson compl\u00e8te, couper en rondelles encore ti\u00e8de.\n2. M\u00e9langer avec les lentilles, l\u2019oignon finement \u00e9minc\u00e9 et le vinaigre \u2014 servir ti\u00e8de, c\u2019est meilleur qu\u2019une salade froide avec la saucisse.', t:20},
{id:'r-katsu-curry', n:'Katsu curry (poulet pan\u00e9, riz)', cat:'dejeuner', ing:[{id:'poulet-cru',g:170},{id:'chapelure',g:40},{id:'oeuf',g:55},{id:'curry-japonais-roux',g:40},{id:'riz-basmati-cuit',g:200}], steps:'1. Aplatir légèrement le poulet pour une \u00e9paisseur r\u00e9guli\u00e8re, saler, poivrer.\n2. Tremper dans l\u2019œuf battu puis la chapelure en pressant bien pour qu\u2019elle accroche.\n3. Poêler \u00e0 feu moyen 5-6 min de chaque c\u00f4t\u00e9 jusqu\u2019\u00e0 panure dor\u00e9e et cuisson compl\u00e8te \u00e0 cœur.\n4. Pendant ce temps, casser le roux de curry en morceaux dans une casserole d\u2019eau chaude (suivre les proportions indiqu\u00e9es sur l\u2019emballage), chauffer \u00e0 feu doux en remuant jusqu\u2019\u00e0 dissolution et l\u00e9ger \u00e9paississement.\n5. Trancher le poulet pan\u00e9 en lani\u00e8res, dresser sur le riz, napper de curry chaud.', t:25},
{id:'r-riz-saute-jambon', n:'Riz saut\u00e9 au jambon', cat:'dejeuner', ing:[{id:'jambonblanc',g:100},{id:'riz-basmati-cuit',g:250},{id:'petitspois',g:60},{id:'oeuf',g:55},{id:'saucesoja',g:15}], steps:'1. Cuire l\u2019œuf brouill\u00e9 \u00e0 part \u00e0 feu doux, r\u00e9server.\n2. Sauter le riz \u00e0 feu vif avec le jambon en d\u00e9s et les petits pois 3-4 min, ajouter l\u2019œuf et la sauce soja, m\u00e9langer 1 min.', t:12},
{id:'r-buddhabowl-poulet', n:'Buddha bowl au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'quinoa-cuit',g:150},{id:'avocat',g:60},{id:'carotte',g:60},{id:'epinards',g:50}], steps:'1. Poêler le poulet 8-10 min \u00e0 feu vif jusqu\u2019\u00e0 bien color\u00e9.\n2. Dresser en bol avec le quinoa, l\u2019avocat, la carotte r\u00e2p\u00e9e et les \u00e9pinards crus en sections distinctes. Un filet d\u2019huile d\u2019olive termine bien le plat.', t:18},
{id:'r-wrap-houmous-vege', n:'Wrap houmous, l\u00e9gumes (v\u00e9g\u00e9)', cat:'dejeuner', ing:[{id:'tortilla',g:70},{id:'houmous',g:80},{id:'concombre',g:60},{id:'carotte',g:50},{id:'salade',g:30}], steps:'1. R\u00e9chauffer légèrement la tortilla \u00e0 la po\u00eale s\u00e8che pour la rendre plus souple.\n2. Tartiner de houmous, garnir de l\u00e9gumes crus coup\u00e9s en b\u00e2tonnets, rouler serré.', t:8},
{id:'r-salade-nicoise', n:'Salade ni\u00e7oise', cat:'dejeuner', ing:[{id:'thon-boite',g:120},{id:'oeuf',g:110},{id:'haricotsverts',g:100},{id:'tomate',g:100},{id:'olives',g:20},{id:'huile-olive',g:10}], steps:'1. Cuire l\u2019œuf dur 9-10 min et les haricots verts \u00e0 la vapeur 5-6 min (encore fermes, pas mous).\n2. M\u00e9langer tous les ingr\u00e9dients avec un filet d\u2019huile, sel, poivre.', t:15},
{id:'r-curry-rouge-boeuf', n:'Curry rouge tha\u00ef au bœuf', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:160},{id:'pate-curry-verte',g:25},{id:'lait-coco',g:120},{id:'poivron',g:80},{id:'riz-basmati-cuit',g:200}], steps:'1. Saisir le bœuf en lamelles \u00e0 feu tr\u00e8s vif 1-2 min seulement, r\u00e9server.\n2. Faire revenir la p\u00e2te de curry 1-2 min pour la r\u00e9veiller, ajouter le lait de coco et le poivron, mijoter 8 min.\n3. Remettre le bœuf juste pour r\u00e9chauffer (pas plus, il durcirait). Servir sur le riz.', t:22},

// --- BISTRO FRANÇAIS / SOUPES / SALADES / VARIÉTÉ ---
{id:'r-ratatouille-poulet', n:'Ratatouille au poulet', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'ratatouille',g:300}], steps:'1. Poêler le poulet en morceaux \u00e0 feu vif 8-10 min jusqu\u2019\u00e0 bien color\u00e9.\n2. R\u00e9chauffer la ratatouille \u00e0 feu doux (elle se dessèche vite si trop chauff\u00e9e) et servir ensemble.', t:15},
{id:'r-poelee-legumes-hiver-saucisse', n:'Po\u00eal\u00e9e de l\u00e9gumes d\u2019hiver, saucisse', cat:'dejeuner', ing:[{id:'saucisse-toulouse-crue',g:130},{id:'navet',g:100},{id:'carotte',g:100},{id:'pdt-cuite',g:150}], steps:'1. Poêler la saucisse \u00e0 feu moyen 10-12 min jusqu\u2019\u00e0 cuisson compl\u00e8te, r\u00e9server.\n2. Dans le m\u00eame gras, faire revenir navet et carotte en d\u00e9s 10 min jusqu\u2019\u00e0 tendres et légèrement dor\u00e9s, ajouter les pommes de terre pour r\u00e9chauffer.', t:25},
{id:'r-veloute-potiron', n:'Velout\u00e9 de potiron, croûtons', cat:'dejeuner', ing:[{id:'potiron',g:350},{id:'cremelegere',g:50},{id:'pain-complet',g:40}], steps:'1. Cuire le potiron \u00e0 l\u2019eau ou \u00e0 la vapeur 15-20 min jusqu\u2019\u00e0 tr\u00e8s tendre.\n2. Mixer avec la cr\u00e8me jusqu\u2019\u00e0 texture bien lisse. Servir avec des croûtons de pain grill\u00e9.', t:25},
{id:'r-soupe-poisson', n:'Soupe de poisson', cat:'dejeuner', ing:[{id:'cabillaud-cru',g:200},{id:'tomate',g:150},{id:'oignon',g:60},{id:'pain-complet',g:40}], steps:'1. Faire revenir l\u2019oignon 5 min \u00e0 feu doux jusqu\u2019\u00e0 fondant.\n2. Ajouter le poisson en morceaux et la tomate, mijoter 15-18 min. Mixer si texture velout\u00e9e souhait\u00e9e. Servir avec le pain.', t:25},
{id:'r-salade-chevre-chaud', n:'Salade de ch\u00e8vre chaud', cat:'dejeuner', ing:[{id:'chevre',g:90},{id:'pain-complet',g:50},{id:'salade',g:80},{id:'noix',g:15},{id:'miel',g:10}], steps:'1. Disposer le ch\u00e8vre en rondelles sur le pain, faire gratiner 5 min au four/grill jusqu\u2019\u00e0 fondant et légèrement dor\u00e9.\n2. Servir sur la salade avec les noix concass\u00e9es et un filet de miel.', t:12},
{id:'r-endives-jambon-gratinees', n:'Endives au jambon gratin\u00e9es', cat:'dejeuner', ing:[{id:'endive',g:300},{id:'jambonblanc',g:80},{id:'bechamel',g:120},{id:'emmental',g:40}], steps:'1. Cuire les endives enti\u00e8res \u00e0 l\u2019eau bouillante sal\u00e9e 15 min jusqu\u2019\u00e0 ce qu\u2019elles soient tendres, \u00e9goutter soigneusement (bien presser, l\u2019eau qu\u2019elles rel\u00e2chent d\u00e9trempe le plat sinon).\n2. Pr\u00e9chauffer le four \u00e0 200\u00b0C.\n3. Envelopper chaque endive dans une tranche de jambon, ranger dans un plat.\n4. Napper de b\u00e9chamel, parsemer de fromage r\u00e2p\u00e9.\n5. Four 20-25 min jusqu\u2019\u00e0 ce que le dessus soit bien dor\u00e9 et bouillonnant.', t:35},
{id:'r-poireaux-vinaigrette-oeuf', n:'Poireaux vinaigrette, œuf', cat:'dejeuner', ing:[{id:'poireau',g:250},{id:'oeuf',g:110},{id:'vinaigrette',g:20}], steps:'1. Cuire les poireaux \u00e0 l\u2019eau bouillante sal\u00e9e 12-15 min jusqu\u2019\u00e0 tendres, \u00e9goutter et presser légèrement pour retirer l\u2019exc\u00e8s d\u2019eau.\n2. Cuire l\u2019œuf dur 9-10 min. Servir les poireaux ti\u00e8des (meilleurs ti\u00e8des que froids) avec la vinaigrette et l\u2019œuf coup\u00e9.', t:20},
{id:'r-gratin-courgettes', n:'Gratin de courgettes', cat:'dejeuner', ing:[{id:'courgette',g:300},{id:'oeuf',g:110},{id:'cremelegere',g:60},{id:'emmental',g:40}], steps:'1. Couper les courgettes en rondelles, les faire revenir 5 min \u00e0 feu moyen pour \u00e9vaporer une partie de leur eau (sinon le gratin devient liquide).\n2. Pr\u00e9chauffer le four \u00e0 190\u00b0C.\n3. Battre les œufs avec la cr\u00e8me, saler, poivrer.\n4. M\u00e9langer avec les courgettes égouttées, verser dans un plat beurr\u00e9, parsemer de fromage.\n5. Four 25 min \u00e0 190\u00b0C jusqu\u2019\u00e0 ce que le dessus soit dor\u00e9 et l\u2019appareil pris (\u00e0 peine tremblotant au centre).', t:35},
{id:'r-poulet-citron', n:'Poulet au citron, riz', cat:'dejeuner', ing:[{id:'poulet-cuisse-cru',g:200},{id:'citron',g:40},{id:'ail',g:8},{id:'riz-basmati-cuit',g:180}], steps:'1. Faire dorer le poulet c\u00f4t\u00e9 peau en premier 5-6 min \u00e0 feu moyen jusqu\u2019\u00e0 belle coloration, ajouter l\u2019ail écrasé en fin de dorage (il br\u00fble vite).\n2. Ajouter jus de citron et un peu d\u2019eau, mijoter \u00e0 couvert 25 min \u00e0 feu doux jusqu\u2019\u00e0 poulet tr\u00e8s tendre. Servir sur le riz.', t:35},
{id:'r-osso-bucco', n:'Osso bucco simplifi\u00e9, riz', cat:'dejeuner', ing:[{id:'veau-escalope-crue',g:200},{id:'tomate',g:150},{id:'carotte',g:80},{id:'riz-blanc-cuit',g:180}], steps:'1. Faire dorer le veau \u00e0 feu vif sur toutes les faces 4-5 min \u2014 cette coloration est la base du go\u00fbt du plat.\n2. Ajouter la tomate en d\u00e9s et la carotte en rondelles, saler, poivrer.\n3. Couvrir, baisser \u00e0 feu doux, mijoter 40-45 min en v\u00e9rifiant de temps en temps que \u00e7a n\u2019attache pas (ajouter un peu d\u2019eau si besoin).\n4. La viande est pr\u00eate quand elle se d\u00e9fait facilement \u00e0 la fourchette.\n5. Si la sauce est trop liquide en fin de cuisson, retirer le couvercle 5 min \u00e0 feu vif pour la faire r\u00e9duire. Servir sur le riz.', t:55},
{id:'r-dinde-moutarde', n:'Escalope de dinde, sauce moutarde', cat:'dejeuner', ing:[{id:'dinde-cru',g:160},{id:'moutarde',g:20},{id:'cremelegere',g:50},{id:'pdt-cuite',g:200}], steps:'1. Aplatir légèrement l\u2019escalope si elle est \u00e9paisse (pour une cuisson plus uniforme), saler, poivrer.\n2. Poêler 5-6 min de chaque c\u00f4t\u00e9 \u00e0 feu moyen jusqu\u2019\u00e0 ce qu\u2019elle soit bien color\u00e9e et cuite \u00e0 cœur (jus clair quand on pique). R\u00e9server au chaud.\n3. Baisser le feu, verser la cr\u00e8me dans la po\u00eale encore chaude en grattant les sucs de cuisson.\n4. Retirer du feu avant d\u2019ajouter la moutarde (bouillir la moutarde la rend amère et lui fait perdre son piquant), m\u00e9langer.\n5. Remettre la viande 1 min pour r\u00e9chauffer et napper. Servir avec les pommes de terre.', t:20},
{id:'r-roti-porc-pdt', n:'R\u00f4ti de porc, pommes de terre', cat:'dejeuner', ing:[{id:'porc-filet',g:200},{id:'pdt-cuite',g:250},{id:'ail',g:8}], steps:'1. Saler le r\u00f4ti, l\u2019entailler légèrement pour y glisser l\u2019ail en lamelles.\n2. Rôtir au four 30-35 min \u00e0 200\u00b0C en arrosant du jus de cuisson \u00e0 mi-parcours pour garder la viande moelleuse.\n3. Laisser reposer 5 min avant de trancher. Servir avec les pommes de terre r\u00f4ties.', t:45},
{id:'r-choucroute', n:'Choucroute garnie', cat:'dejeuner', ing:[{id:'saucisse-toulouse-crue',g:130},{id:'lardons',g:60},{id:'choux-vert',g:250},{id:'pdt-cuite',g:200}], steps:'1. Faire revenir les lardons 3-4 min pour lib\u00e9rer leur gras, ajouter le chou \u00e9minc\u00e9.\n2. Mouiller d\u2019un peu d\u2019eau, couvrir, laisser mijoter \u00e0 feu doux 25-30 min jusqu\u2019\u00e0 ce que le chou soit fondant (go\u00fbter pour v\u00e9rifier \u2014 il doit avoir perdu son croquant cru).\n3. Pendant ce temps, poêler la saucisse \u00e0 part 10-12 min jusqu\u2019\u00e0 cuisson compl\u00e8te et belle coloration.\n4. Servir le chou avec la saucisse et les pommes de terre chaudes.', t:40},
{id:'r-cassoulet', n:'Cassoulet simplifi\u00e9', cat:'dejeuner', ing:[{id:'saucisse-toulouse-crue',g:120},{id:'porc-filet',g:100},{id:'haricotsblancs-tomate',g:300}], steps:'1. Faire dorer la saucisse en tron\u00e7ons et le porc en d\u00e9s ensemble 6-8 min \u00e0 feu moyen-vif jusqu\u2019\u00e0 bonne coloration.\n2. Ajouter les haricots blancs, m\u00e9langer.\n3. Mijoter \u00e0 couvert 20 min \u00e0 feu doux pour que les saveurs se m\u00e9langent.\n4. Si l\u2019envie, terminer 10 min \u00e0 d\u00e9couvert au four chaud pour faire l\u00e9g\u00e8rement gratiner le dessus.', t:30},
{id:'r-aligot-simplifie', n:'Aligot simplifi\u00e9, saucisse', cat:'dejeuner', ing:[{id:'pdt-cuite',g:300},{id:'emmental',g:100},{id:'lait-demi',g:40},{id:'saucisse-toulouse-crue',g:120}], steps:'1. \u00c9craser les pommes de terre encore chaudes en pur\u00e9e avec le lait chaud (des pommes de terre froides donnent une pur\u00e9e collante).\n2. Remettre \u00e0 feu tr\u00e8s doux, incorporer le fromage r\u00e2p\u00e9 petit \u00e0 petit en \u00e9tirant \u00e0 la cuill\u00e8re en bois \u2014 c\u2019est ce geste r\u00e9p\u00e9t\u00e9 qui cr\u00e9e la texture filante caract\u00e9ristique.\n3. Servir avec la saucisse poêl\u00e9e \u00e0 part.', t:25},
{id:'r-veloute-champignons', n:'Velout\u00e9 de champignons', cat:'dejeuner', ing:[{id:'champignons-cuits',g:300},{id:'cremelegere',g:60},{id:'pain-complet',g:40}], steps:'1. Faire revenir les champignons \u00e0 feu vif jusqu\u2019\u00e0 ce qu\u2019ils rendent leur eau puis dorent (patienter jusqu\u2019\u00e0 cette 2e phase pour plus de go\u00fbt).\n2. Mixer avec la cr\u00e8me et un peu d\u2019eau jusqu\u2019\u00e0 texture lisse. Servir avec le pain.', t:18},
{id:'r-salade-caprese', n:'Salade caprese', cat:'dejeuner', ing:[{id:'tomate',g:200},{id:'mozzarella',g:125},{id:'huile-olive',g:10}], steps:'1. Alterner tranches de tomate et de mozzarella sur une assiette, saler légèrement la tomate (\u00e7a fait ressortir son jus et son go\u00fbt).\n2. Arroser d\u2019huile d\u2019olive et de basilic frais si dispo juste avant de servir.', t:8},
{id:'r-croque-chevre-miel', n:'Croque au ch\u00e8vre, miel', cat:'dejeuner', ing:[{id:'pain-complet',g:80},{id:'chevre',g:80},{id:'miel',g:12}], steps:'1. Disposer le ch\u00e8vre en rondelles sur le pain, filer un peu de miel dessus.\n2. Passer 5-6 min au four/grill jusqu\u2019\u00e0 ce que le fromage soit fondant et légèrement dor\u00e9 sur les bords.', t:12},
{id:'r-poulet-brocolis-amandes', n:'Po\u00eal\u00e9e de poulet, brocolis, amandes', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'brocoli',g:180},{id:'amandes',g:15},{id:'huile-olive',g:8}], steps:'1. Poêler le poulet en morceaux \u00e0 feu vif 8 min jusqu\u2019\u00e0 bien color\u00e9.\n2. Ajouter le brocoli, saut\u00e9r 5 min \u00e0 couvert pour qu\u2019il cuise \u00e0 la vapeur tout en restant croquant.\n3. Parsemer d\u2019amandes concass\u00e9es en fin de cuisson, les laisser tiédir 1 min dans la po\u00eale chaude pour qu\u2019elles se colorent légèrement.', t:20},
{id:'r-pates-poulet-champignons-creme', n:'P\u00e2tes au poulet, champignons, cr\u00e8me', cat:'dejeuner', ing:[{id:'poulet-cru',g:150},{id:'champignons-cuits',g:150},{id:'cremelegere',g:60},{id:'pates-cuites',g:220}], steps:'1. Poêler le poulet en d\u00e9s 8 min \u00e0 feu vif jusqu\u2019\u00e0 bien color\u00e9, r\u00e9server.\n2. Faire dorer les champignons dans la m\u00eame po\u00eale, ajouter la cr\u00e8me, laisser \u00e9paissir légèrement sans bouillir fort.\n3. Remettre le poulet, m\u00e9langer avec les p\u00e2tes chaudes.', t:25},
{id:'r-bar-riz-legumes', n:'Filet de bar, riz, l\u00e9gumes', cat:'dejeuner', ing:[{id:'bar-cru',g:180},{id:'riz-basmati-cuit',g:180},{id:'courgette',g:100},{id:'huile-olive',g:8}], steps:'1. S\u00e9cher le filet avec du papier absorbant, inciser l\u00e9g\u00e8rement la peau pour \u00e9viter qu\u2019elle se r\u00e9tracte.\n2. Cuire c\u00f4t\u00e9 peau en premier 4-5 min \u00e0 feu moyen sans bouger le poisson \u2014 c\u2019est ce qui rend la peau croustillante.\n3. Retourner d\u00e9licatement, cuire 2 min de l\u2019autre c\u00f4t\u00e9 \u2014 la chair doit \u00eatre opaque et se d\u00e9tacher facilement.\n4. Pendant ce temps, faire sauter la courgette en d\u00e9s \u00e0 feu vif 5 min.\n5. Servir le poisson c\u00f4t\u00e9 peau visible, avec le riz et la courgette.', t:20},
{id:'r-curry-poisson', n:'Curry de poisson, riz', cat:'dejeuner', ing:[{id:'cabillaud-cru',g:180},{id:'lait-coco',g:120},{id:'coulistomate',g:80},{id:'riz-basmati-cuit',g:180}], steps:'1. Chauffer lait de coco et coulis avec des \u00e9pices curry 3-4 min \u00e0 feu doux pour les r\u00e9veiller.\n2. Ajouter le poisson en morceaux, mijoter 10-12 min \u00e0 feu doux \u2014 remuer délicatement pour ne pas casser les morceaux. Servir sur le riz.', t:20},
{id:'r-riz-cantonais-crevettes', n:'Riz cantonais aux crevettes', cat:'dejeuner', ing:[{id:'crevettes-cuites',g:150},{id:'riz-basmati-cuit',g:220},{id:'oeuf',g:55},{id:'petitspois',g:60},{id:'saucesoja',g:15}], steps:'1. Cuire l\u2019œuf brouill\u00e9 \u00e0 part, r\u00e9server.\n2. Sauter le riz \u00e0 feu vif avec les petits pois 3-4 min, ajouter les crevettes seulement en toute fin (elles sont d\u00e9j\u00e0 cuites) pour les r\u00e9chauffer sans les durcir. Ajouter l\u2019œuf et la sauce soja.', t:15},
{id:'r-salade-riz-thon-mais', n:'Salade de riz, thon, ma\u00efs', cat:'dejeuner', ing:[{id:'riz-blanc-cuit',g:200},{id:'thon-boite',g:120},{id:'mais',g:80},{id:'tomate',g:80},{id:'huile-olive',g:8}], steps:'1. M\u00e9langer tous les ingr\u00e9dients froids avec un filet d\u2019huile, sel, poivre \u2014 un peu de vinaigre ou de citron rel\u00e8ve bien l\u2019ensemble.', t:10},
{id:'r-wrap-saumonfume-avocat', n:'Wrap saumon fum\u00e9, avocat', cat:'dejeuner', ing:[{id:'saumonfume',g:100},{id:'tortilla',g:70},{id:'avocat',g:60},{id:'salade',g:20}], steps:'1. \u00c9craser l\u2019avocat avec un peu de citron et de sel.\n2. Garnir la tortilla de saumon fum\u00e9, avocat \u00e9cras\u00e9 et salade, rouler serré.', t:6},
{id:'r-assiette-charcuterie', n:'Assiette de charcuterie, pain', cat:'dejeuner', ing:[{id:'jambonblanc',g:60},{id:'saucisson',g:50},{id:'pain-blanc',g:80},{id:'concombre',g:80}], steps:'1. Disposer les charcuteries en les pliant l\u00e9g\u00e8rement plut\u00f4t qu\u2019\u00e0 plat (plus app\u00e9tissant), avec le pain et le concombre en b\u00e2tonnets.', t:5},
{id:'r-pates-thon-creme-citron', n:'P\u00e2tes au thon, cr\u00e8me, citron', cat:'dejeuner', ing:[{id:'thon-boite',g:130},{id:'pates-cuites',g:220},{id:'cremelegere',g:50},{id:'citron',g:10}], steps:'1. M\u00e9langer les p\u00e2tes chaudes avec la cr\u00e8me hors du feu, le thon \u00e9miett\u00e9 en dernier (\u00e9vite de le rendre sec) et un filet de citron.', t:12},
{id:'r-poulet-roti-legumes-racines', n:'Poulet r\u00f4ti, l\u00e9gumes racines', cat:'dejeuner', ing:[{id:'poulet-cuisse-cru',g:220},{id:'carotte',g:120},{id:'navet',g:100},{id:'pdt-cuite',g:150}], steps:'1. Couper les l\u00e9gumes en morceaux réguliers pour une cuisson homog\u00e8ne, les disposer autour du poulet.\n2. Rôtir au four 35-40 min \u00e0 200\u00b0C, en retournant les l\u00e9gumes \u00e0 mi-cuisson pour qu\u2019ils dorent de tous les c\u00f4t\u00e9s.', t:45},
{id:'r-epaule-agneau-confite', n:'\u00c9paule d\u2019agneau confite, l\u00e9gumes', cat:'dejeuner', ing:[{id:'agneau-gigot-cru',g:200},{id:'carotte',g:100},{id:'oignon',g:60},{id:'pdt-cuite',g:180}], steps:'1. Faire dorer l\u2019agneau sur toutes les faces \u00e0 feu vif 5-6 min dans une cocotte.\n2. Ajouter oignon et carottes, faire revenir 3-4 min.\n3. Mouiller \u00e0 hauteur avec de l\u2019eau ou du bouillon, couvrir, baisser \u00e0 feu tr\u00e8s doux.\n4. Laisser mijoter 1h30 \u00e0 2h sans presser \u2014 c\u2019est le temps long \u00e0 feu doux qui rend la viande fondante au point de se d\u00e9tacher \u00e0 la fourchette, pas juste tendre. V\u00e9rifier de temps en temps le niveau de liquide.\n5. Servir avec les pommes de terre, arros\u00e9 du jus de cuisson.', t:120},
