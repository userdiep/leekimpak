{id:'r-porc-moutarde-ancienne', n:'Filet de porc, moutarde \u00e0 l\u2019ancienne', cat:'dejeuner', ing:[{id:'porc-filet',g:180},{id:'moutarde-ancienne',g:25},{id:'cremelegere',g:50},{id:'pdt-cuite',g:200}], steps:'1. Couper le porc en tranches, saler, poivrer.\n2. Poêler 3-4 min de chaque c\u00f4t\u00e9 \u00e0 feu moyen-vif jusqu\u2019\u00e0 coloration \u2014 le porc doit rester juste rosé, pas sec. R\u00e9server.\n3. Baisser le feu, verser la cr\u00e8me dans la po\u00eale en grattant les sucs.\n4. Retirer du feu avant d\u2019incorporer la moutarde \u00e0 l\u2019ancienne (\u00e7a pr\u00e9serve son go\u00fbt et sa texture en grains).\n5. Remettre la viande 1 min pour r\u00e9chauffer. Servir avec les pommes de terre.', t:22},
{id:'r-gambas-ail', n:'Po\u00eal\u00e9e de gambas \u00e0 l\u2019ail', cat:'dejeuner', ing:[{id:'crevettes-cuites',g:200},{id:'ail',g:12},{id:'huile-olive',g:12},{id:'persil',g:5},{id:'riz-basmati-cuit',g:180}], steps:'1. Faire revenir l\u2019ail \u00e9minc\u00e9 dans l\u2019huile \u00e0 feu doux 1 min, sans le laisser br\u00fbler.\n2. Ajouter les gambas 3-4 min \u00e0 feu vif juste pour les r\u00e9chauffer et les enrober, parsemer de persil frais hach\u00e9. Servir avec le riz.', t:12},
{id:'r-riz-pilaf-legumes', n:'Riz pilaf aux l\u00e9gumes', cat:'dejeuner', ing:[{id:'riz-blanc-cru',g:100},{id:'carotte',g:80},{id:'petitspois',g:60},{id:'oignon',g:40},{id:'huile-olive',g:8}], steps:'1. Faire revenir l\u2019oignon et le riz cru 2 min dans l\u2019huile jusqu\u2019\u00e0 ce que les grains deviennent translucides.\n2. Ajouter l\u2019eau chaude et les l\u00e9gumes, cuire \u00e0 couvert \u00e0 feu doux 15-18 min sans soulever le couvercle.', t:25},
{id:'r-salade-pates-pesto-tomatescerises', n:'Salade de p\u00e2tes au pesto, tomates cerises', cat:'dejeuner', ing:[{id:'pates-cuites',g:220},{id:'pesto-vert',g:30},{id:'tomate',g:120},{id:'parmesan',g:15}], steps:'1. M\u00e9langer les p\u00e2tes froides avec le pesto, les tomates cerises coup\u00e9es en deux et le parmesan.', t:10},
{id:'r-veloute-courgette', n:'Velout\u00e9 de courgette', cat:'dejeuner', ing:[{id:'courgette',g:350},{id:'cremelegere',g:50},{id:'ail',g:5}], steps:'1. Cuire les courgettes avec l\u2019ail \u00e0 l\u2019eau 15 min jusqu\u2019\u00e0 tr\u00e8s tendres.\n2. Mixer avec la cr\u00e8me jusqu\u2019\u00e0 texture bien lisse.', t:20},
{id:'r-poulet-yaourt-epices', n:'Poulet mariné au yaourt, \u00e9pices, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:170},{id:'yaourtgrec',g:60},{id:'riz-basmati-cuit',g:200}], steps:'1. Mariner le poulet dans le yaourt et des \u00e9pices (curcuma, cumin, paprika) au moins 20 min, id\u00e9alement plus \u2014 le yaourt attendrit la viande en plus de la parfumer.\n2. Griller ou poêler 10-12 min \u00e0 feu moyen-vif. Servir sur le riz.', t:20},
{id:'r-saumon-puree-patatedouce', n:'Filet de saumon, pur\u00e9e de patate douce', cat:'dejeuner', ing:[{id:'saumon-cru',g:170},{id:'patatedouce-cuite',g:250},{id:'beurre',g:10}], steps:'1. Poêler le saumon c\u00f4t\u00e9 peau en premier 4-5 min, retourner 2-3 min.\n2. \u00c9craser la patate douce en pur\u00e9e avec le beurre jusqu\u2019\u00e0 texture onctueuse.', t:22},
{id:'r-boulettes-sauce-tomate-spaghetti', n:'Boulettes de viande, sauce tomate, spaghetti', cat:'dejeuner', ing:[{id:'boeuf-hache15',g:180},{id:'coulistomate',g:180},{id:'pates-cuites',g:220},{id:'parmesan',g:15}], steps:'1. Former des boulettes r\u00e9guli\u00e8res avec le bœuf hach\u00e9 sans trop les tasser.\n2. Les dorer \u00e0 feu vif 4-5 min sur toutes les faces, puis mijoter dans le coulis 15 min \u00e0 feu doux \u2014 elles finissent de cuire dans la sauce, plus moelleuses qu\u2019en les cuisant enti\u00e8rement \u00e0 la po\u00eale. Servir sur les spaghetti.', t:30},
{id:'r-assiette-sushis-mixte', n:'Assiette de sushis mixtes', cat:'dejeuner', ing:[{id:'riz-sushi-cuit',g:220},{id:'saumon-cru',g:80},{id:'thon-cru',g:80},{id:'algue-nori',g:8},{id:'saucesoja',g:15}], steps:'1. Utiliser uniquement du poisson vendu pour consommation crue (\"qualit\u00e9 sushi\", surgel\u00e9 pr\u00e9alablement par le poissonnier).\n2. Se mouiller les mains (le riz colle sinon) et former des petits pav\u00e9s de riz compacts mais pas trop tass\u00e9s pour les nigiris.\n3. Trancher le poisson finement, d\u00e9poser une tranche sur chaque pav\u00e9 de riz en pressant l\u00e9gèrement.\n4. Pour des makis, \u00e9taler le riz sur une feuille de nori, ajouter le poisson en b\u00e2tonnet au centre, rouler serré \u00e0 l\u2019aide d\u2019une natte en bambou si disponible (ou \u00e0 la main), puis trancher avec un couteau tr\u00e8s aiguis\u00e9 et humide.\n5. Servir avec la sauce soja pour tremper.', t:30},
{id:'r-galettes-sarrasin-completes', n:'Galette de sarrasin compl\u00e8te (jambon, œuf, fromage)', cat:'dejeuner', ing:[{id:'farine-sarrasin',g:60},{id:'oeuf',g:55},{id:'jambonblanc',g:50},{id:'emmental',g:30}], steps:'1. M\u00e9langer la farine de sarrasin avec de l\u2019eau (et une pinc\u00e9e de sel) en fouettant jusqu\u2019\u00e0 p\u00e2te lisse et fluide, sans grumeaux. Laisser reposer 20-30 min si possible.\n2. Chauffer une po\u00eale large \u00e0 feu moyen-vif, bien huil\u00e9e.\n3. Verser une louche au centre et \u00e9taler en fine couche r\u00e9guli\u00e8re en inclinant la po\u00eale (ou \u00e0 la spatule en bois) \u2014 la galette de sarrasin est plus fragile que la cr\u00eape classique, y aller franchement mais sans trop insister.\n4. Laisser cuire 2-3 min jusqu\u2019\u00e0 ce que les bords se d\u00e9collent et croustillent l\u00e9g\u00e8rement.\n5. Casser l\u2019œuf au centre, r\u00e9partir jambon et fromage, replier les 4 bords vers le centre pour former un carr\u00e9 en laissant l\u2019œuf visible. Couvrir 1-2 min pour cuire l\u2019œuf et faire fondre le fromage.', t:18},
{id:'r-crepe-salee-jambonfromage', n:'Cr\u00eape sal\u00e9e jambon-fromage', cat:'dejeuner', ing:[{id:'farine',g:50},{id:'oeuf',g:55},{id:'lait-demi',g:120},{id:'jambonblanc',g:50},{id:'emmental',g:30}], steps:'1. Pr\u00e9parer la p\u00e2te : farine dans un saladier, creuser un puits, casser l\u2019œuf, incorporer le lait petit \u00e0 petit en fouettant depuis le centre jusqu\u2019\u00e0 p\u00e2te lisse.\n2. Chauffer une po\u00eale l\u00e9g\u00e8rement huil\u00e9e, verser une louche en \u00e9talant fin.\n3. Cuire 1-2 min jusqu\u2019\u00e0 ce que les bords se d\u00e9collent, retourner.\n4. Garnir aussit\u00f4t de jambon et fromage sur une moiti\u00e9, replier l\u2019autre moiti\u00e9 par-dessus.\n5. Laisser 1-2 min \u00e0 feu doux pour que le fromage fonde bien.', t:15},
{id:'r-tortellini-tomate', n:'Tortellini fromage, sauce tomate', cat:'dejeuner', ing:[{id:'pates-cuites',g:250},{id:'coulistomate',g:150},{id:'parmesan',g:20}], steps:'1. Cuire les tortellini dans l\u2019eau bouillante sal\u00e9e selon l\u2019indication, les \u00e9goutter d\u00e8s qu\u2019ils remontent \u00e0 la surface.\n2. Chauffer le coulis \u00e0 part, napper les tortellini, parsemer de parmesan.', t:15},
{id:'r-curry-crevettes-riz', n:'Curry de crevettes, riz', cat:'dejeuner', ing:[{id:'crevettes-cuites',g:180},{id:'lait-coco',g:120},{id:'coulistomate',g:80},{id:'riz-basmati-cuit',g:200}], steps:'1. Chauffer lait de coco et coulis avec des \u00e9pices 3-4 min \u00e0 feu doux.\n2. Ajouter les crevettes seulement 3-4 min en fin de cuisson (d\u00e9j\u00e0 cuites, ne pas les faire bouillir longtemps). Servir sur le riz.', t:15},
{id:'r-dinde-poivrons-oignons', n:'Po\u00eal\u00e9e de dinde, poivrons, oignons', cat:'dejeuner', ing:[{id:'dinde-cru',g:160},{id:'poivron',g:120},{id:'oignon',g:60},{id:'huile-olive',g:8}], steps:'1. Faire sauter la dinde en lamelles \u00e0 feu vif 5-6 min jusqu\u2019\u00e0 bien color\u00e9e, r\u00e9server.\n2. Saisir poivrons et oignon 5-6 min dans la m\u00eame po\u00eale, remettre la dinde, m\u00e9langer 1-2 min.', t:18},
{id:'r-boeuf-gingembre-riz', n:'Bœuf saut\u00e9 au gingembre, riz', cat:'dejeuner', ing:[{id:'boeuf-fauxfilet',g:160},{id:'gingembre',g:15},{id:'saucesoja',g:20},{id:'riz-basmati-cuit',g:200}], steps:'1. Couper le bœuf en fines lamelles, saisir \u00e0 feu tr\u00e8s vif 1-2 min avec le gingembre r\u00e2p\u00e9.\n2. D\u00e9glacer \u00e0 la sauce soja hors du plus fort du feu (\u00e9vite qu\u2019elle br\u00fble). Servir sur le riz.', t:15},
{id:'r-poulet-creme-citron-riz', n:'Filet de poulet, sauce cr\u00e8me citron, riz', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'cremelegere',g:60},{id:'citron',g:20},{id:'riz-basmati-cuit',g:200}], steps:'1. Poêler le poulet 8-10 min \u00e0 feu vif jusqu\u2019\u00e0 bien color\u00e9, r\u00e9server.\n2. Baisser le feu, ajouter la cr\u00e8me et le jus de citron en grattant les sucs, remettre le poulet 1-2 min. Servir sur le riz.', t:18},
{id:'r-salade-quinoa-feta-concombre', n:'Salade de quinoa, feta, concombre', cat:'dejeuner', ing:[{id:'quinoa-cuit',g:180},{id:'feta',g:70},{id:'concombre',g:120},{id:'huile-olive',g:10}], steps:'1. M\u00e9langer tous les ingr\u00e9dients froids avec un filet d\u2019huile, poivre \u2014 la feta est d\u00e9j\u00e0 sal\u00e9e, go\u00fbter avant de resaler.', t:10},
{id:'r-riz-tofu-legumes-croquants', n:'Riz saut\u00e9 au tofu, l\u00e9gumes croquants', cat:'dejeuner', ing:[{id:'tofu',g:180},{id:'riz-basmati-cuit',g:220},{id:'poivron',g:80},{id:'carotte',g:60},{id:'saucesoja',g:15}], steps:'1. S\u00e9cher le tofu en d\u00e9s, saut\u00e9r \u00e0 feu vif jusqu\u2019\u00e0 dorer, r\u00e9server.\n2. Saut\u00e9r les l\u00e9gumes en julienne 5 min \u00e0 feu vif (ils doivent rester croquants). Remettre le tofu, ajouter le riz et la sauce soja.', t:18},
{id:'r-assiette-fromages', n:'Assiette de fromages, pain, salade', cat:'dejeuner', ing:[{id:'emmental',g:40},{id:'chevre',g:40},{id:'roquefort',g:30},{id:'pain-complet',g:70},{id:'salade',g:30}], steps:'1. Sortir les fromages 15-20 min avant de servir (ils sont meilleurs \u00e0 temp\u00e9rature ambiante). Disposer sur une planche avec le pain et la salade.', t:5},
{id:'r-legumes-soleil-oeuf', n:'Po\u00eal\u00e9e de l\u00e9gumes du soleil, œuf', cat:'dejeuner', ing:[{id:'courgette',g:120},{id:'aubergine',g:120},{id:'poivron',g:100},{id:'oeuf',g:110},{id:'huile-olive',g:10}], steps:'1. Faire sauter les l\u00e9gumes 10-12 min \u00e0 feu moyen dans l\u2019huile jusqu\u2019\u00e0 tendres et légèrement caram\u00e9lis\u00e9s sur les bords.\n2. Ajouter un œuf au plat ou brouill\u00e9 pour servir dessus.', t:18},
{id:'r-poulet-roquefort', n:'Blanc de poulet, sauce roquefort', cat:'dejeuner', ing:[{id:'poulet-cru',g:160},{id:'roquefort',g:50},{id:'cremelegere',g:50},{id:'pates-cuites',g:200}], steps:'1. Poêler le poulet en morceaux 8-10 min \u00e0 feu moyen jusqu\u2019\u00e0 cuisson compl\u00e8te (jus clair, plus de rose \u00e0 cœur). R\u00e9server.\n2. Baisser le feu, ajouter la cr\u00e8me dans la po\u00eale encore chaude.\n3. \u00c9mietter le roquefort dedans, remuer \u00e0 feu doux jusqu\u2019\u00e0 ce qu\u2019il fonde compl\u00e8tement dans la cr\u00e8me \u2014 ne pas faire bouillir, \u00e7a rendrait la sauce granuleuse.\n4. Remettre le poulet 1-2 min pour r\u00e9chauffer et bien enrober de sauce. Go\u00fbter avant de resaler (le roquefort est d\u00e9j\u00e0 sal\u00e9).\n5. Servir avec les p\u00e2tes chaudes.', t:20},

/* ============================= ÉTAT & PERSISTANCE ============================= */
const LS_KEY = 'nutri-app-state-v1';
function defaultState(){
  return {
    people: [{id:'moi', name:'Moi', kcalTarget:1800, proteinTarget:170, weight:null, weightLog:[]}],
    customIngredients: [],
    customSupplements: [],
    customRecipes: [],
    recipeOverrides: {},
    log: []
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const d = defaultState();
      const merged = Object.assign({}, d, parsed);
      if((!parsed.people || parsed.people.length===0) && parsed.settings){
        merged.people = [{id:'moi', name:'Moi', kcalTarget:parsed.settings.kcalTarget||1800, proteinTarget:parsed.settings.proteinTarget||170, weight:parsed.settings.weight||null, weightLog:parsed.settings.weightLog||[]}];
      }
      if(!merged.people || merged.people.length===0) merged.people = d.people;
      const firstId = merged.people[0].id;
      merged.log = (merged.log||[]).map(e => e.person ? e : Object.assign({}, e, {person: firstId}));
      delete merged.settings;
      return merged;
    }
  }catch(e){}
  return defaultState();
}
let STATE = loadState();
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){} }
function getPerson(id){ return STATE.people.find(p=>p.id===id) || STATE.people[0]; }
function activePerson(){ return getPerson(VIEW.activePersonId || STATE.people[0].id); }

/* ============================= HELPERS DE DONNÉES ============================= */
function allIngredients(){ return INGREDIENTS.concat(STATE.customIngredients); }
function allSupplements(){ return SUPPLEMENTS_BASE.concat(STATE.customSupplements); }
function allRecipes(){
  const base = RECIPES.map(r => STATE.recipeOverrides[r.id] ? Object.assign({}, r, STATE.recipeOverrides[r.id], {isOverridden:true}) : r);
  return base.concat(STATE.customRecipes.map(r=>Object.assign({}, r, {isCustom:true})));
}
function findIngredient(id){ return allIngredients().find(i=>i.id===id); }
function findSupplement(id){ return allSupplements().find(i=>i.id===id); }
function findRecipe(id){ return allRecipes().find(i=>i.id===id); }
function isBuiltInRecipe(id){ return RECIPES.some(r=>r.id===id); }

function macrosFromRef(ref){
  const ing = findIngredient(ref.id);
  if(ing){
    const f = ref.g/100;
    return {k:ing.k*f, p:ing.p*f, c:ing.c*f, f:ing.f*f};
  }
  const sup = findSupplement(ref.id);
  if(sup){
    const f = ref.g;
    return {k:sup.k*f, p:sup.p*f, c:sup.c*f, f:sup.f*f};
  }
  return {k:0,p:0,c:0,f:0};
}
function computeRecipeMacros(recipe){
  const tot = {k:0,p:0,c:0,f:0};
  (recipe.ing||[]).forEach(ref=>{
    const m = macrosFromRef(ref);
    tot.k+=m.k; tot.p+=m.p; tot.c+=m.c; tot.f+=m.f;
  });
  return tot;
}
function round(n){ return Math.round(n*10)/10; }
function r0(n){ return Math.round(n); }

/* Macros pour une entrée du journal */
function macrosForEntry(e){
  if(e.kind==='recipe'){
    let m;
    if(e.ingSnapshot){ m = computeRecipeMacros({ing:e.ingSnapshot}); }
    else { const rec = findRecipe(e.refId); if(!rec) return {k:0,p:0,c:0,f:0}; m = computeRecipeMacros(rec); }
    return {k:m.k*e.qty, p:m.p*e.qty, c:m.c*e.qty, f:m.f*e.qty};
  }
  if(e.kind==='ingredient'){
    const ing = findIngredient(e.refId);
    if(!ing) return {k:0,p:0,c:0,f:0};
    const f = e.qty/100;
    return {k:ing.k*f, p:ing.p*f, c:ing.c*f, f:ing.f*f};
  }
  if(e.kind==='supplement'){
    const sup = findSupplement(e.refId);
    if(!sup) return {k:0,p:0,c:0,f:0};
    return {k:sup.k*e.qty, p:sup.p*e.qty, c:sup.c*e.qty, f:sup.f*e.qty};
  }
  if(e.kind==='custom'){
    return {k:(e.macros.k||0)*e.qty, p:(e.macros.p||0)*e.qty, c:(e.macros.c||0)*e.qty, f:(e.macros.f||0)*e.qty};
  }
  return {k:0,p:0,c:0,f:0};
}
function entryLabel(e){
  if(e.kind==='recipe'){ const r=findRecipe(e.refId); return {name: r?r.n:'(recette supprimée)', qty: (e.qty===1?'1 portion':round(e.qty)+' portions')}; }
  if(e.kind==='ingredient'){ const i=findIngredient(e.refId); return {name: i?i.n:'(aliment supprimé)', qty: r0(e.qty)+' g'}; }
  if(e.kind==='supplement'){ const s=findSupplement(e.refId); return {name: s?s.n.split(' — ')[0]:'(complément supprimé)', qty: (e.qty===1?'1 dose':round(e.qty)+' doses')}; }
  if(e.kind==='custom'){ return {name: e.name, qty: 'saisie libre'}; }
  return {name:'?', qty:''};
}
function dotClass(kind){ return kind; }

/* ============================= DATES ============================= */
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
function humanDate(dateStr){
  const t = todayStr(); const y = addDays(t,-1);
  if(dateStr===t) return "Aujourd\u2019hui";
  if(dateStr===y) return 'Hier';
  const d = new Date(dateStr+'T00:00:00');
  const s = d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function dayLetter(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{weekday:'narrow'}).toUpperCase();
}

function entriesForDate(dateStr, personId){
  const pid = personId || activePerson().id;
  return STATE.log.filter(e=>e.date===dateStr && (e.person||STATE.people[0].id)===pid);
}
function totalsForDate(dateStr, personId){
  const tot = {k:0,p:0,c:0,f:0};
  entriesForDate(dateStr, personId).forEach(e=>{ const m=macrosForEntry(e); tot.k+=m.k; tot.p+=m.p; tot.c+=m.c; tot.f+=m.f; });
  return tot;
}
function last7Days(fromDate){
  const days = [];
  for(let i=6;i>=0;i--) days.push(addDays(fromDate,-i));
  return days;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(VIEW.tab==='today') html = renderToday();
  else if(VIEW.tab==='recipes') html = renderRecipes();
  else if(VIEW.tab==='supplements') html = renderSupplements();
  else if(VIEW.tab==='settings') html = renderSettings();
  html += renderTabbar();
  app.innerHTML = html;
  const modalRoot = document.createElement('div');
  modalRoot.id = 'modal-root';
  app.appendChild(modalRoot);
  if(VIEW.modal) renderModal();
}
function renderTabbar(){
  const t = (id)=> VIEW.tab===id ? 'active' : '';
  return '<div class="tabbar">'
    + '<button class="'+t('today')+'" onclick="switchTab(\'today\')">'+ICONS.today+'<span>Aujourd\u2019hui</span></button>'
    + '<button class="'+t('recipes')+'" onclick="switchTab(\'recipes\')">'+ICONS.recipes+'<span>Recettes</span></button>'
    + '<button class="'+t('supplements')+'" onclick="switchTab(\'supplements\')">'+ICONS.supplements+'<span>Compl\u00e9ments</span></button>'
    + '<button class="'+t('settings')+'" onclick="switchTab(\'settings\')">'+ICONS.settings+'<span>R\u00e9glages</span></button>'
    + '</div>';
}
function switchTab(id){ VIEW.tab=id; VIEW.modal=null; if(id==='supplements') resetLogFor(); render(); window.scrollTo(0,0); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ============================= VUE : AUJOURD\u2019HUI ============================= */
function renderToday(){
  const date = VIEW.currentDate;
  const person = activePerson();
  const tot = totalsForDate(date, person.id);
  const kcalPct = Math.min(100, (tot.k/person.kcalTarget)*100);
  const protPct = Math.min(100, (tot.p/person.proteinTarget)*100);
  const kcalOver = tot.k > person.kcalTarget * 1.05;
  const days = last7Days(date);
  const weekTotals = days.map(d=>totalsForDate(d, person.id).k);
  const maxWeek = Math.max(person.kcalTarget, ...weekTotals, 1);
  const avg7 = weekTotals.reduce((a,b)=>a+b,0)/7;
  const entries = entriesForDate(date, person.id).slice().sort((a,b)=>b.ts-a.ts);

  let entriesHtml = '';
  if(entries.length===0){
    entriesHtml = '<div class="empty">Rien de logg\u00e9 pour l\u2019instant.</div>';
  } else {
    entriesHtml = entries.map(e=>{
      const m = macrosForEntry(e);
      const lbl = entryLabel(e);
      return '<div class="entry">'
        + '<div class="dot '+dotClass(e.kind)+'"></div>'
        + '<div class="info"><div class="name">'+esc(lbl.name)+'</div><div class="qty">'+esc(lbl.qty)+'</div></div>'
        + '<div class="macros"><span class="kc num">'+r0(m.k)+' kcal</span><br>'+round(m.p)+' g prot</div>'
        + '<button class="del" onclick="deleteEntry(\''+e.id+'\')">\u00d7</button>'
        + '</div>';
    }).join('');
  }

  const weekHtml = days.map((d,i)=>{
    const v = weekTotals[i];
    const h = Math.max(4, (v/maxWeek)*64);
    const isToday = d===date;
    return '<div class="col"><div class="stick" style="height:'+64+'px"><div class="fill" style="height:'+h+'px; opacity:'+(isToday?1:0.55)+'"></div></div><div class="day" style="'+(isToday?'color:var(--accent)':'')+'">'+dayLetter(d)+'</div></div>';
  }).join('');

  const personSwitch = STATE.people.length>1 ? '<div class="person-switch">'+STATE.people.map(p=>'<button class="'+(p.id===person.id?'active':'')+'" onclick="setActivePerson(\''+p.id+'\')">'+esc(p.name)+'</button>').join('')+'</div>' : '';

  return '<div class="wrap">'
    + '<div class="topbar">'
    + personSwitch
    + '<div style="display:flex; align-items:center; justify-content:space-between;">'
    + '<button class="btn small ghost" onclick="navDay(-1)" style="padding:6px 10px;">'+ICONS.chevL+'</button>'
    + '<div style="text-align:center;"><div class="date">Journal</div><h1 style="font-size:20px;">'+humanDate(date)+'</h1></div>'
    + '<button class="btn small ghost" onclick="navDay(1)" style="padding:6px 10px; opacity:'+(date>=todayStr()?'.3':'1')+';" '+(date>=todayStr()?'disabled':'')+'>'+ICONS.chevR+'</button>'
    + '</div></div>'

    + '<div class="metric-row">'

const CATS = [['all','Toutes'],['petit-dej','Petit-d\u00e9j'],['dejeuner','D\u00e9jeuner / D\u00eener'],['collation','Collation'],['dessert','Dessert']];
function renderRecipes(){
  const q = VIEW.recipeSearch.toLowerCase();
  let list = allRecipes();
  if(VIEW.recipeCat!=='all') list = list.filter(r=>r.cat===VIEW.recipeCat);
  if(q) list = list.filter(r=>r.n.toLowerCase().includes(q));
  list = list.slice().sort((a,b)=>a.n.localeCompare(b.n,'fr'));

  const chips = CATS.map(([id,label])=>'<button class="chip '+(VIEW.recipeCat===id?'active':'')+'" onclick="setRecipeCat(\''+id+'\')">'+label+'</button>').join('');

  const cards = list.map(r=>{
    const m = computeRecipeMacros(r);
    const catLabel = (CATS.find(c=>c[0]===r.cat)||['',''])[1];

    return '<div class="recipe-card" onclick="openRecipeDetail(\''+r.id+'\')">'
      + '<div><div class="name">'+esc(r.n)+'</div><div class="tag">'+catLabel+timeTag+(r.isCustom?' \u00b7 perso':(r.isOverridden?' \u00b7 modifi\u00e9e':''))+'</div></div>'

    + '<div class="topbar"><div class="date">'+allRecipes().length+' recettes</div><h1>Recettes</h1></div>'

    + '<div style="margin-top:10px;">'+cards+'</div>'

function onRecipeSearch(v){ VIEW.recipeSearch=v; render(); }
function setRecipeCat(id){ VIEW.recipeCat=id; render(); }
function openRecipeDetail(id){

function openRecipeEditor(id){

    VIEW.editorDraft = {id: r.isCustom?r.id:null, baseId: r.isCustom?null:id, n:r.n, cat:r.cat, steps:r.steps||'', t:r.t||10, ing: JSON.parse(JSON.stringify(ingSource))};

function updatePerson(id, key, val){
  const p = getPerson(id);
  if(!p) return;
  if(key==='name'){ if(val.trim()) p.name = val.trim(); }
  else { const n = parseFloat(val); if(!isNaN(n) && n>0) p[key]=n; }
  saveState(); render();
}
function addPerson(){
  const id = 'p'+Date.now().toString(36);
  STATE.people.push({id, name:'Copine', kcalTarget:2000, proteinTarget:120, weight:null, weightLog:[]});
  saveState(); render(); toast('Personne ajout\u00e9e \u2014 modifie son nom et ses cibles');
}
function removePerson(id){
  if(STATE.people.length<2) return;
  STATE.people = STATE.people.filter(p=>p.id!==id);
  STATE.log = STATE.log.filter(e=>e.person!==id);
  if(VIEW.activePersonId===id) VIEW.activePersonId = STATE.people[0].id;
  saveState(); render(); toast('Personne supprim\u00e9e');
}
function logWeight(personId, val){
  const n = parseFloat(val);
  if(isNaN(n) || n<=0) return;
  const p = getPerson(personId);
  p.weight = n;
  p.weightLog = p.weightLog || [];
  p.weightLog.push({date: todayStr(), value:n, ts:Date.now()});
  saveState(); render(); toast('Poids enregistr\u00e9');
}
function confirmReset(){
  VIEW.modal = {type:'confirm-reset'};
  render();
}
function replaceState(newState){
  Object.keys(STATE).forEach(k=>delete STATE[k]);
  Object.assign(STATE, newState);
}
function doReset(){
  replaceState(defaultState());
  saveState();
  VIEW.modal = null;
  render();
  toast('Donn\u00e9es r\u00e9initialis\u00e9es');
}
function openExport(){ VIEW.modal={type:'export'}; render(); }
function openImport(){ VIEW.modal={type:'import'}; render(); }
function doImport(){
  const ta = document.getElementById('import-ta');
  try{
    const parsed = JSON.parse(ta.value);
    replaceState(Object.assign(defaultState(), parsed));
    saveState();
    VIEW.modal = null;
    render();
    toast('Donn\u00e9es import\u00e9es');
  }catch(e){
    toast('JSON invalide');
  }
}

function closeModal(){ VIEW.modal=null; render(); }
function stop(ev){ ev.stopPropagation(); }
function openAddPicker(){ resetLogFor(); VIEW.modal={type:'add'}; render(); }

function renderModal(){
  const root = document.getElementById('modal-root');
  const m = VIEW.modal;
  let inner = '';
  if(m.type==='add') inner = modalAdd();
  else if(m.type==='recipe-detail') inner = modalRecipeDetail(m);
  else if(m.type==='recipe-editor') inner = modalRecipeEditor();
  else if(m.type==='ingredient-picker') inner = modalIngredientPicker(m);
  else if(m.type==='log-ingredient-qty') inner = modalLogIngredientQty(m);
  else if(m.type==='new-ingredient') inner = modalNewIngredient(m);
  else if(m.type==='custom-entry') inner = modalCustomEntry(m);
  else if(m.type==='supplement-editor') inner = modalSupplementEditor(m);
  else if(m.type==='confirm-reset') inner = modalConfirmReset();
  else if(m.type==='export') inner = modalExport();
  else if(m.type==='import') inner = modalImport();
  else if(m.type==='roulette') inner = modalRoulette(m);
  root.innerHTML = '<div class="modal-backdrop" onclick="closeModal()"><div class="modal" onclick="stop(event)"><div class="modal-handle"></div>'+inner+'</div></div>';

function modalRecipeDetail(){
  const da = VIEW.detailAdjust;
  const r = findRecipe(da.recipeId);
  if(!r) return '<div class="empty">Recette introuvable.</div>';
  const tot = computeRecipeMacros({ing: da.ing});
  const servings = da.servings||1;

  let rows;
  if(da.adjusting){
    rows = da.ing.map((ref,i)=>{
      const ing = findIngredient(ref.id); const sup = !ing?findSupplement(ref.id):null; const item = ing||sup;
      const label = item ? item.n : '(?)';
      return '<div class="ing-row"><div class="n">'+esc(label)+'</div>'
        + '<input class="g" type="number" step="'+(ing?'1':'0.5')+'" value="'+ref.g+'" onchange="updateDetailIngQty('+i+', this.value)">'
        + '<div class="u">'+(ing?'g':'d')+'</div>'
        + '<button class="rm" onclick="removeDetailIngredient('+i+')">\u00d7</button></div>';
    }).join('') || '<div class="empty">Plus aucun ingr\u00e9dient \u2014 ajoutes-en un.</div>';
    rows += '<button class="btn full" style="margin-top:10px;" onclick="addIngredientToDetail()">+ Ajouter un ingr\u00e9dient</button>';
  } else {
    rows = da.ing.map(ref=>{
      const ing = findIngredient(ref.id);
      const sup = !ing ? findSupplement(ref.id) : null;
      const item = ing||sup;
      if(!item) return '';
      const mm = macrosFromRef(ref);
      const qtyLabel = ing ? ref.g+' g' : (ref.g===1?'1 dose':round(ref.g)+' doses');
      return '<div class="ing-row"><div class="n">'+esc(item.n)+'</div><div style="font-size:12px; color:var(--text-dim); width:70px; text-align:right;">'+qtyLabel+'</div><div style="font-size:12px; color:var(--text-dim); width:60px; text-align:right;" class="num">'+r0(mm.k)+' kcal</div></div>';
    }).join('');
  }
  const catLabel = (CATS.find(c=>c[0]===r.cat)||['',''])[1];
  const changed = JSON.stringify(da.ing)!==JSON.stringify(r.ing);
  const stepsHtml = r.steps ? '<div class="section-title" style="margin-top:22px;"><h2 style="font-size:15px;">Pr\u00e9paration</h2></div><p style="font-size:14px; line-height:1.6; color:var(--text); white-space:pre-line;">'+esc(r.steps)+'</p>' : '';
  const person = activePerson();
  const timeHtml = r.t ? ' \u00b7 <span class="time-badge">'+ICONS.clock+r.t+' min</span>' : '';

  return '<div class="sheet-header"><button class="back" onclick="closeModal()">\u2039 Fermer</button>'
    + '<button class="back" onclick="toggleAdjust()">'+(da.adjusting?'Termin\u00e9':'Ajuster les ingr\u00e9dients')+'</button></div>'
    + '<h2 style="font-size:21px; margin-bottom:4px;">'+esc(r.n)+'</h2>'
    + '<div style="color:var(--text-dim); font-size:13px; margin-bottom:14px; display:flex; align-items:center; gap:4px;">'+catLabel+timeHtml+(changed?' \u00b7 ingr\u00e9dients modifi\u00e9s pour cette fois':'')+'</div>'
    + '<div>'+rows+'</div>'
    + '<div class="macro-preview">'
    + '<div class="m"><div class="v num">'+r0(tot.k)+'</div><div class="l">kcal</div></div>'
    + '<div class="m"><div class="v num">'+round(tot.p)+'</div><div class="l">prot (g)</div></div>'
    + '<div class="m"><div class="v num">'+round(tot.c)+'</div><div class="l">gluc (g)</div></div>'
    + '<div class="m"><div class="v num">'+round(tot.f)+'</div><div class="l">lip (g)</div></div>'
    + '</div>'
    + '<div class="field"><label>Portions</label><div class="stepper">'
    + '<button onclick="stepServings(-0.5)">\u2212</button><div class="v num">'+servings+'</div><button onclick="stepServings(0.5)">+</button>'
    + '</div></div>'
    + '<div class="field"><label>Ajuster \u00e0 un objectif calorique</label><div class="fab-row">'
    + '<button class="btn small" onclick="scaleRecipeToTarget('+person.kcalTarget+')">Objectif ('+person.kcalTarget+')</button>'
    + '<button class="btn small" onclick="scaleRecipeToTarget('+r0(person.kcalTarget/2)+')">Moiti\u00e9 ('+r0(person.kcalTarget/2)+')</button>'
    + '</div><input type="number" placeholder="Ou viser X kcal pr\u00e9cis\u00e9ment" style="margin-top:8px;" onchange="scaleRecipeToTarget(parseFloat(this.value)||0)"></div>'
    + personPillsField()
    + '<button class="btn primary full" onclick="logRecipe()">Ajouter au journal \u2014 '+r0(tot.k*servings)+' kcal</button>'
    + '<div class="fab-row" style="margin-top:10px;">'
    + '<button class="btn" onclick="openRecipeEditor(\''+r.id+'\')">'+(changed?'Enregistrer ces changements':'Modifier la recette')+'</button>'
    + (r.isCustom ? '<button class="btn danger" onclick="deleteCustomRecipe(\''+r.id+'\')">Supprimer</button>' : (r.isOverridden ? '<button class="btn" onclick="resetRecipeOverride(\''+r.id+'\')">R\u00e9initialiser</button>' : ''))
    + '</div>'
    + stepsHtml;
}
function scaleRecipeToTarget(targetKcal){
  const da = VIEW.detailAdjust;
  const base = computeRecipeMacros({ing: da.ing});
  if(base.k<=0 || !targetKcal || targetKcal<=0) return;
  da.servings = Math.max(0.25, round(targetKcal / base.k));
  render();
}
function toggleAdjust(){ VIEW.detailAdjust.adjusting = !VIEW.detailAdjust.adjusting; render(); }
function updateDetailIngQty(i, val){
  const n = parseFloat(val);

}

function removeEditorIngredient(i){ VIEW.editorDraft.ing.splice(i,1); render(); }
function saveRecipeDraft(){
  const d = VIEW.editorDraft;
  if(!d.n.trim()){ toast('Donne un nom \u00e0 la recette'); return; }
  if(d.ing.length===0){ toast('Ajoute au moins un ingr\u00e9dient'); return; }
  if(d.id){
    const idx = STATE.customRecipes.findIndex(r=>r.id===d.id);
    if(idx>=0) STATE.customRecipes[idx] = {id:d.id, n:d.n, cat:d.cat, steps:d.steps||'', t:d.t||10, ing:d.ing};
  } else if(d.baseId){
    STATE.recipeOverrides[d.baseId] = {n:d.n, cat:d.cat, steps:d.steps||'', t:d.t||10, ing:d.ing};
  } else {
    const slug = 'custom-'+d.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Date.now().toString(36);
    STATE.customRecipes.push({id:slug, n:d.n, cat:d.cat, steps:d.steps||'', t:d.t||10, ing:d.ing});

  saveState();

}

function modalLogIngredientQty(m){

  const factor = grams/100;
  const toggle = hasUnit ? '<div class="person-switch" style="margin-bottom:16px;"><button class="'+(m.mode==='g'?'active':'')+'" onclick="setIngQtyMode(\'g\')">Grammes</button><button class="'+(m.mode==='unit'?'active':'')+'" onclick="setIngQtyMode(\'unit\')">Nombre</button></div>' : '';

    ? '<div class="field"><label>Nombre de '+esc(ing.ul)+'(s)</label><input type="number" step="0.5" value="'+m.pieces+'" onchange="VIEW.modal.pieces=parseFloat(this.value)||0; render();"></div><p style="color:var(--text-dim); font-size:12px; margin-top:-10px;">\u2248 '+ing.uw+' g / '+esc(ing.ul)+' \u2014 soit '+r0(grams)+' g au total</p>'
    : '<div class="field"><label>Quantit\u00e9 (g)</label><input type="number" value="'+m.qty+'" onchange="VIEW.modal.qty=parseFloat(this.value)||0; render();"></div>';
  return '<div class="sheet-header"><h2 style="font-size:16px;">'+esc(ing.n)+'</h2><button class="back" onclick="closeModal()">Fermer</button></div>'
    + toggle
    + qtyField
    + '<div class="macro-preview">'
    + '<div class="m"><div class="v num">'+r0(ing.k*factor)+'</div><div class="l">kcal</div></div>'
    + '<div class="m"><div class="v num">'+round(ing.p*factor)+'</div><div class="l">prot (g)</div></div>'
    + '<div class="m"><div class="v num">'+round(ing.c*factor)+'</div><div class="l">gluc (g)</div></div>'
    + '<div class="m"><div class="v num">'+round(ing.f*factor)+'</div><div class="l">lip (g)</div></div>'

function openRoulette(){ VIEW.modal={type:'roulette', cat:'all', mealsLeft:null, result:null}; render(); }
function roulettePool(m){
  let pool = allRecipes();
  if(m.cat!=='all') pool = pool.filter(r=>r.cat===m.cat);
  if(m.mealsLeft){
    const remaining = Math.max(0, activePerson().kcalTarget - totalsForDate(VIEW.currentDate).k);
    const target = remaining / m.mealsLeft;
    if(target > 0){
      pool = pool.slice().sort((a,b)=> Math.abs(computeRecipeMacros(a).k - target) - Math.abs(computeRecipeMacros(b).k - target));
      const keep = Math.max(5, Math.ceil(pool.length * 0.25));
      pool = pool.slice(0, keep);
    }
  }
  return pool;
}
function rouletteTarget(m){
  if(!m.mealsLeft) return null;
  const remaining = Math.max(0, activePerson().kcalTarget - totalsForDate(VIEW.currentDate).k);
  return remaining / m.mealsLeft;
}
function setRouletteCat(cat){ VIEW.modal.cat=cat; VIEW.modal.result=null; render(); }
function setRouletteMeals(n){ VIEW.modal.mealsLeft = (VIEW.modal.mealsLeft===n ? null : n); VIEW.modal.result=null; render(); }
function modalRoulette(m){
  const pool = roulettePool(m);
  const target = rouletteTarget(m);
  const chips = CATS.map(([id,label])=>'<button class="chip '+(m.cat===id?'active':'')+'" onclick="setRouletteCat(\''+id+'\')">'+label+'</button>').join('');
  const display = m.result ? m.result.n : (pool.length ? 'Pr\u00eat \u00e0 tourner\u00a0?' : 'Aucune recette dans ce filtre');
  const resultActions = m.result
    ? '<div style="text-align:center; color:var(--text-dim); font-size:13px; margin:-6px 0 16px;">'+r0(computeRecipeMacros(m.result).k)+' kcal \u00b7 '+(m.result.t||'?')+' min</div>'
      + '<div class="fab-row"><button class="btn" onclick="spinRoulette()">Relancer</button><button class="btn primary" onclick="closeModal(); openRecipeDetail(\''+m.result.id+'\')">Voir la recette</button></div>'
    : '<button id="roulette-spin-btn" class="btn primary full" onclick="spinRoulette()" '+(pool.length?'':'disabled')+'>Lancer la roulette</button>';
  const targetHint = target ? '<p style="color:var(--text-dim); font-size:12px; margin:-2px 0 4px;">Cible par repas \u2248 '+r0(target)+' kcal \u2014 la roulette privil\u00e9gie les recettes qui s\u2019en rapprochent.</p>' : '';

  return '<div class="sheet-header"><h2 style="font-size:16px;">Roulette</h2><button class="back" onclick="closeModal()">Fermer</button></div>'
    + '<div class="chiprow">'+chips+'</div>'
    + '<div class="field" style="margin:12px 0 4px;"><label>Repas restants aujourd\u2019hui</label><div class="person-pills">'
    + '<button class="person-pill '+(m.mealsLeft===1?'active':'')+'" onclick="setRouletteMeals(1)">Plus qu\u20191</button>'
    + '<button class="person-pill '+(m.mealsLeft===2?'active':'')+'" onclick="setRouletteMeals(2)">Encore 2</button>'
    + '</div></div>'
    + targetHint
    + '<div class="roulette-wheel" id="roulette-display">'+esc(display)+'</div>'
    + resultActions;
}
function spinRoulette(){
  const m = VIEW.modal;
  const pool = roulettePool(m);
  if(pool.length===0){ toast('Aucune recette ne correspond \u00e0 ce filtre'); return; }
  const el = document.getElementById('roulette-display');
  const btn = document.getElementById('roulette-spin-btn');
  if(btn) btn.disabled = true;
  let i=0; const total = 16 + Math.floor(Math.random()*8);
  const iv = setInterval(()=>{
    const r = pool[Math.floor(Math.random()*pool.length)];
    if(el) el.textContent = r.n;
    i++;
    if(i>=total){
      clearInterval(iv);
      m.result = pool[Math.floor(Math.random()*pool.length)];
      render();
    }
  }, 80);
}
