<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F3F2EE; --text:#181917; --text-dim:#8B8A83;
  --accent:#2E4A34; --accent-soft:#E7ECE4; --protein:#9C6B32; --protein-soft:#F2E9DA;
  --danger:#AE4B3E; --danger-soft:#F5E7E4; --line:#E5E3DC; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:82px; min-height:100vh;}
h1,h2,h3{font-family:'Fraunces',serif; font-weight:500; margin:0; letter-spacing:-0.01em;}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums;}
.wrap{max-width:560px; margin:0 auto; padding:0 18px;}
a{color:inherit;}
svg{width:1em; height:1em; display:block; flex-shrink:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* header */
.topbar{padding:22px 0 14px;}
.topbar .date{color:var(--text-dim); font-size:13px; margin-bottom:2px;}
.topbar h1{font-size:26px;}

/* dashboard */
.metric-row{display:flex; gap:12px; margin:18px 0;}
.metric{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:16px 16px 14px;}
.metric .label{color:var(--text-dim); font-size:12px; text-transform:none; margin-bottom:8px;}
.metric .value{font-size:22px; font-weight:600;}
.metric .value .sub{font-size:13px; color:var(--text-dim); font-weight:400;}
.bar-track{height:5px; background:var(--surface2); border-radius:3px; margin-top:10px; overflow:hidden; position:relative;}
.bar-fill{height:100%; border-radius:3px; transition:width .3s ease;}
.bar-fill.kcal{background:var(--accent);}
.bar-fill.prot{background:var(--protein);}
.bar-fill.over{background:var(--danger);}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px;}
.section-title h2{font-size:16px; font-weight:500;}
.section-title .hint{font-size:12px; color:var(--text-dim);}

.weekbars{display:flex; gap:6px; align-items:flex-end; height:64px; margin:8px 0 4px;}
.weekbars .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%;}
.weekbars .stick{width:100%; max-width:22px; border-radius:2px 2px 1px 1px; background:var(--surface2); position:relative;}
.weekbars .stick .fill{position:absolute; bottom:0; left:0; right:0; border-radius:2px 2px 1px 1px; background:var(--accent);}
.weekbars .day{font-size:10px; color:var(--text-dim);}

.entry{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);}
.entry:last-child{border-bottom:none;}
.entry .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.entry .dot.recipe{background:var(--accent);}
.entry .dot.ingredient{background:var(--protein);}
.entry .dot.supplement{background:#7C6A93;}
.entry .dot.custom{background:var(--text-dim);}
.entry .info{flex:1; min-width:0;}
.entry .info .name{font-size:14.5px; font-weight:500;}
.entry .info .qty{font-size:12px; color:var(--text-dim); margin-top:1px;}
.entry .macros{text-align:right; font-size:12.5px; color:var(--text-dim); flex-shrink:0;}
.entry .macros .kc{color:var(--text); font-weight:600;}
.entry .del{color:var(--text-dim); background:none; border:none; padding:4px 0 4px 10px; font-size:18px; line-height:1;}
.empty{color:var(--text-dim); font-size:13.5px; padding:20px 0; text-align:center;}

.fab-row{display:flex; gap:10px; margin-top:14px;}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:2px; padding:13px 16px; font-size:14.5px; font-weight:500; text-align:center; flex:1;}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
.btn.ghost{background:none; border-color:transparent;}
.btn.danger{color:var(--danger); border-color:var(--line);}
.btn.small{padding:9px 12px; font-size:13px; flex:none;}
.btn.full{width:100%;}

/* tab bar */
.tabbar{position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.94); backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
.tabbar button{flex:1; background:none; border:none; color:var(--text-dim); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0;}
.tabbar button.active{color:var(--accent);}
.tabbar svg{width:21px; height:21px;}

/* recipe library */
.searchbar{display:flex; gap:8px; margin:16px 0 6px;}
.searchbar input{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:11px 14px; color:var(--text); font-size:14.5px;}
.searchbar input::placeholder{color:var(--text-dim);}
.chiprow{display:flex; gap:7px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; background:none; border:1px solid var(--line); color:var(--text-dim); padding:7px 13px; border-radius:100px; font-size:13px; white-space:nowrap;}
.chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

.recipe-card{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); gap:10px;}
.recipe-card .name{font-size:15px; font-weight:500;}
.recipe-card .tag{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
.recipe-card .m{text-align:right; font-size:12px; color:var(--text-dim); flex-shrink:0;}
.recipe-card .m .kc{font-size:14.5px; color:var(--accent); font-weight:600; display:block;}

/* detail / editor sheets */
.sheet-header{display:flex; align-items:center; justify-content:space-between; padding:18px 0 6px;}
.sheet-header .back{color:var(--text-dim); font-size:14px; background:none; border:none; padding:6px 0;}
.field{margin:16px 0;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px;}
.field input, .field select{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:12px 14px; color:var(--text); font-size:15px;}
.ing-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.ing-row .n{flex:1; font-size:14.5px;}
.ing-row .g{width:64px; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:8px 8px; color:var(--text); font-size:14px; text-align:center;}
.ing-row .u{font-size:12px; color:var(--text-dim); width:16px;}
.ing-row .rm{color:var(--text-dim); background:none; border:none; font-size:17px; padding:4px 2px;}
.macro-preview{display:flex; gap:10px; background:var(--surface2); border-radius:2px; padding:16px; margin:14px 0;}
.macro-preview .m{flex:1; text-align:center;}
.macro-preview .m .v{font-size:17px; font-weight:600;}
.macro-preview .m .l{font-size:10.5px; color:var(--text-dim); margin-top:2px;}
.autocomplete{position:relative;}
.ac-list{position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:2px; max-height:230px; overflow-y:auto; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.06);}
.ac-item{padding:11px 14px; font-size:14px; border-bottom:1px solid var(--line);}
.ac-item:last-child{border-bottom:none;}
.ac-item .k{color:var(--text-dim); font-size:11.5px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(20,20,18,.4); z-index:40; display:flex; align-items:flex-end;}
.modal{background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:4px 18px 24px; border-top:1px solid var(--line);}
.modal-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:10px auto 4px;}

.settings-row{display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid var(--line);}
.settings-row .l{font-size:14.5px;}
.settings-row .l .s{display:block; font-size:12px; color:var(--text-dim); margin-top:2px;}
.settings-row input[type=number]{width:84px; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:9px 10px; color:var(--text); text-align:right; font-size:15px;}

.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:32px; height:32px; border-radius:50%; background:var(--surface2); border:1px solid var(--line); color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center;}
.stepper .v{min-width:44px; text-align:center; font-size:15px; font-weight:600;}

.toast{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:11px 18px; border-radius:100px; font-size:13.5px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.time-badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--text-dim);}
.time-badge svg{width:12px; height:12px;}
.person-pills{display:flex; gap:8px; margin:10px 0;}
.person-pill{flex:1; border:1px solid var(--line); border-radius:100px; padding:9px 10px; text-align:center; font-size:13.5px; color:var(--text-dim); background:none;}
.person-pill.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}
.person-switch{display:flex; gap:6px; margin-bottom:4px;}
.person-switch button{flex:1; padding:8px 10px; border-radius:100px; border:1px solid var(--line); background:none; color:var(--text-dim); font-size:13px;}
.person-switch button.active{background:var(--text); color:#fff; border-color:var(--text);}
.roulette-wheel{text-align:center; padding:30px 10px; font-family:'Fraunces',serif; font-size:22px; min-height:100px; display:flex; align-items:center; justify-content:center;}
</style>
</head>

/* ============================= ÉTAT & PERSISTANCE ============================= */
const LS_KEY = 'nutri-app-state-v1';
function defaultState(){
  return {
    people: [{id:'moi', name:'Moi', kcalTarget:1800, proteinTarget:170, weight:null, weightLog:[]}],
    customIngredients: [],
    customSupplements: [],
    customRecipes: [],
    recipeOverrides: {},
    log: []
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const d = defaultState();
      const merged = Object.assign({}, d, parsed);
      if((!parsed.people || parsed.people.length===0) && parsed.settings){
        merged.people = [{id:'moi', name:'Moi', kcalTarget:parsed.settings.kcalTarget||1800, proteinTarget:parsed.settings.proteinTarget||170, weight:parsed.settings.weight||null, weightLog:parsed.settings.weightLog||[]}];
      }
      if(!merged.people || merged.people.length===0) merged.people = d.people;
      const firstId = merged.people[0].id;
      merged.log = (merged.log||[]).map(e => e.person ? e : Object.assign({}, e, {person: firstId}));
      delete merged.settings;
      return merged;
    }
  }catch(e){}
  return defaultState();
}
let STATE = loadState();
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){} }
function getPerson(id){ return STATE.people.find(p=>p.id===id) || STATE.people[0]; }
function activePerson(){ return getPerson(VIEW.activePersonId || STATE.people[0].id); }

/* ============================= HELPERS DE DONNÉES ============================= */
function allIngredients(){ return INGREDIENTS.concat(STATE.customIngredients); }
function allSupplements(){ return SUPPLEMENTS_BASE.concat(STATE.customSupplements); }
function allRecipes(){
  const base = RECIPES.map(r => STATE.recipeOverrides[r.id] ? Object.assign({}, r, STATE.recipeOverrides[r.id], {isOverridden:true}) : r);
  return base.concat(STATE.customRecipes.map(r=>Object.assign({}, r, {isCustom:true})));
}
function findIngredient(id){ return allIngredients().find(i=>i.id===id); }
function findSupplement(id){ return allSupplements().find(i=>i.id===id); }
function findRecipe(id){ return allRecipes().find(i=>i.id===id); }
function isBuiltInRecipe(id){ return RECIPES.some(r=>r.id===id); }

function macrosFromRef(ref){
  const ing = findIngredient(ref.id);
  if(ing){
    const f = ref.g/100;
    return {k:ing.k*f, p:ing.p*f, c:ing.c*f, f:ing.f*f};
  }
  const sup = findSupplement(ref.id);
  if(sup){
    const f = ref.g;
    return {k:sup.k*f, p:sup.p*f, c:sup.c*f, f:sup.f*f};
  }
  return {k:0,p:0,c:0,f:0};
}
function computeRecipeMacros(recipe){
  const tot = {k:0,p:0,c:0,f:0};
  (recipe.ing||[]).forEach(ref=>{
    const m = macrosFromRef(ref);
    tot.k+=m.k; tot.p+=m.p; tot.c+=m.c; tot.f+=m.f;
  });
  return tot;
}
function round(n){ return Math.round(n*10)/10; }
function r0(n){ return Math.round(n); }

/* Macros pour une entrée du journal */
function macrosForEntry(e){
  if(e.kind==='recipe'){
    let m;
    if(e.ingSnapshot){ m = computeRecipeMacros({ing:e.ingSnapshot}); }
    else { const rec = findRecipe(e.refId); if(!rec) return {k:0,p:0,c:0,f:0}; m = computeRecipeMacros(rec); }
    return {k:m.k*e.qty, p:m.p*e.qty, c:m.c*e.qty, f:m.f*e.qty};
  }
  if(e.kind==='ingredient'){
    const ing = findIngredient(e.refId);
    if(!ing) return {k:0,p:0,c:0,f:0};
    const f = e.qty/100;
    return {k:ing.k*f, p:ing.p*f, c:ing.c*f, f:ing.f*f};
  }
  if(e.kind==='supplement'){
    const sup = findSupplement(e.refId);
    if(!sup) return {k:0,p:0,c:0,f:0};
    return {k:sup.k*e.qty, p:sup.p*e.qty, c:sup.c*e.qty, f:sup.f*e.qty};
  }
  if(e.kind==='custom'){
    return {k:(e.macros.k||0)*e.qty, p:(e.macros.p||0)*e.qty, c:(e.macros.c||0)*e.qty, f:(e.macros.f||0)*e.qty};
  }
  return {k:0,p:0,c:0,f:0};
}
function entryLabel(e){
  if(e.kind==='recipe'){ const r=findRecipe(e.refId); return {name: r?r.n:'(recette supprimée)', qty: (e.qty===1?'1 portion':round(e.qty)+' portions')}; }
  if(e.kind==='ingredient'){ const i=findIngredient(e.refId); return {name: i?i.n:'(aliment supprimé)', qty: r0(e.qty)+' g'}; }
  if(e.kind==='supplement'){ const s=findSupplement(e.refId); return {name: s?s.n.split(' — ')[0]:'(complément supprimé)', qty: (e.qty===1?'1 dose':round(e.qty)+' doses')}; }
  if(e.kind==='custom'){ return {name: e.name, qty: 'saisie libre'}; }
  return {name:'?', qty:''};
}
function dotClass(kind){ return kind; }

/* ============================= DATES ============================= */
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
function humanDate(dateStr){
  const t = todayStr(); const y = addDays(t,-1);
  if(dateStr===t) return "Aujourd\u2019hui";
  if(dateStr===y) return 'Hier';
  const d = new Date(dateStr+'T00:00:00');
  const s = d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function dayLetter(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{weekday:'narrow'}).toUpperCase();
}

function entriesForDate(dateStr, personId){
  const pid = personId || activePerson().id;
  return STATE.log.filter(e=>e.date===dateStr && (e.person||STATE.people[0].id)===pid);
}
function totalsForDate(dateStr, personId){
  const tot = {k:0,p:0,c:0,f:0};
  entriesForDate(dateStr, personId).forEach(e=>{ const m=macrosForEntry(e); tot.k+=m.k; tot.p+=m.p; tot.c+=m.c; tot.f+=m.f; });
  return tot;
}
function last7Days(fromDate){
  const days = [];
  for(let i=6;i>=0;i--) days.push(addDays(fromDate,-i));
  return days;
}

/* ============================= VUE : AUJOURD\u2019HUI ============================= */
function renderToday(){
  const date = VIEW.currentDate;
  const person = activePerson();
  const tot = totalsForDate(date, person.id);
  const kcalPct = Math.min(100, (tot.k/person.kcalTarget)*100);
  const protPct = Math.min(100, (tot.p/person.proteinTarget)*100);
  const kcalOver = tot.k > person.kcalTarget * 1.05;
  const days = last7Days(date);
  const weekTotals = days.map(d=>totalsForDate(d, person.id).k);
  const maxWeek = Math.max(person.kcalTarget, ...weekTotals, 1);
  const avg7 = weekTotals.reduce((a,b)=>a+b,0)/7;
  const entries = entriesForDate(date, person.id).slice().sort((a,b)=>b.ts-a.ts);

  let entriesHtml = '';
  if(entries.length===0){
    entriesHtml = '<div class="empty">Rien de logg\u00e9 pour l\u2019instant.</div>';
  } else {
    entriesHtml = entries.map(e=>{
      const m = macrosForEntry(e);
      const lbl = entryLabel(e);
      return '<div class="entry">'
        + '<div class="dot '+dotClass(e.kind)+'"></div>'
        + '<div class="info"><div class="name">'+esc(lbl.name)+'</div><div class="qty">'+esc(lbl.qty)+'</div></div>'
        + '<div class="macros"><span class="kc num">'+r0(m.k)+' kcal</span><br>'+round(m.p)+' g prot</div>'
        + '<button class="del" onclick="deleteEntry(\''+e.id+'\')">\u00d7</button>'
        + '</div>';
    }).join('');
  }

  const weekHtml = days.map((d,i)=>{
    const v = weekTotals[i];
    const h = Math.max(4, (v/maxWeek)*64);
    const isToday = d===date;
    return '<div class="col"><div class="stick" style="height:'+64+'px"><div class="fill" style="height:'+h+'px; opacity:'+(isToday?1:0.55)+'"></div></div><div class="day" style="'+(isToday?'color:var(--accent)':'')+'">'+dayLetter(d)+'</div></div>';
  }).join('');

  const personSwitch = STATE.people.length>1 ? '<div class="person-switch">'+STATE.people.map(p=>'<button class="'+(p.id===person.id?'active':'')+'" onclick="setActivePerson(\''+p.id+'\')">'+esc(p.name)+'</button>').join('')+'</div>' : '';

  return '<div class="wrap">'
    + '<div class="topbar">'
    + personSwitch
    + '<div style="display:flex; align-items:center; justify-content:space-between;">'
    + '<button class="btn small ghost" onclick="navDay(-1)" style="padding:6px 10px;">'+ICONS.chevL+'</button>'
    + '<div style="text-align:center;"><div class="date">Journal</div><h1 style="font-size:20px;">'+humanDate(date)+'</h1></div>'
    + '<button class="btn small ghost" onclick="navDay(1)" style="padding:6px 10px; opacity:'+(date>=todayStr()?'.3':'1')+';" '+(date>=todayStr()?'disabled':'')+'>'+ICONS.chevR+'</button>'
    + '</div></div>'

    + '<div class="metric-row">'
    + '<div class="metric"><div class="label">Calories</div><div class="value num">'+r0(tot.k)+'<span class="sub"> / '+person.kcalTarget+'</span></div>'
    + '<div class="bar-track"><div class="bar-fill '+(kcalOver?'over':'kcal')+'" style="width:'+kcalPct+'%"></div></div>'
    + '<div style="font-size:11px; color:var(--text-dim); margin-top:6px;">reste '+r0(Math.max(0,person.kcalTarget-tot.k))+' kcal</div></div>'
    + '<div class="metric"><div class="label">Prot\u00e9ines</div><div class="value num">'+round(tot.p)+'<span class="sub"> / '+person.proteinTarget+' g</span></div>'
    + '<div class="bar-track"><div class="bar-fill prot" style="width:'+protPct+'%"></div></div>'
    + '<div style="font-size:11px; color:var(--text-dim); margin-top:6px;">reste '+round(Math.max(0,person.proteinTarget-tot.p))+' g</div></div>'
    + '</div>'

    + '<button class="btn primary full" onclick="openAddPicker()">+ Ajouter une entr\u00e9e</button>'

    + '<div class="section-title"><h2>Moyenne 7 jours</h2><span class="hint num">'+r0(avg7)+' kcal/j</span></div>'
    + '<div class="weekbars">'+weekHtml+'</div>'

    + '<div class="section-title"><h2>Journal du jour</h2></div>'
    + entriesHtml

    + '</div>';
}

    + '<p style="color:var(--text-dim); font-size:12px; margin-top:26px; line-height:1.5;">Les donn\u00e9es sont stock\u00e9es uniquement sur cet appareil (localStorage). Utilise l\u2019export pour en garder une copie ou passer d\u2019un appareil \u00e0 l\u2019autre.</p>'

function updatePerson(id, key, val){
  const p = getPerson(id);
  if(!p) return;
  if(key==='name'){ if(val.trim()) p.name = val.trim(); }
  else { const n = parseFloat(val); if(!isNaN(n) && n>0) p[key]=n; }
  saveState(); render();
}
function addPerson(){
  const id = 'p'+Date.now().toString(36);
  STATE.people.push({id, name:'Copine', kcalTarget:2000, proteinTarget:120, weight:null, weightLog:[]});
  saveState(); render(); toast('Personne ajout\u00e9e \u2014 modifie son nom et ses cibles');
}
function removePerson(id){
  if(STATE.people.length<2) return;
  STATE.people = STATE.people.filter(p=>p.id!==id);
  STATE.log = STATE.log.filter(e=>e.person!==id);
  if(VIEW.activePersonId===id) VIEW.activePersonId = STATE.people[0].id;
  saveState(); render(); toast('Personne supprim\u00e9e');
}
function logWeight(personId, val){
  const n = parseFloat(val);
  if(isNaN(n) || n<=0) return;
  const p = getPerson(personId);
  p.weight = n;
  p.weightLog = p.weightLog || [];
  p.weightLog.push({date: todayStr(), value:n, ts:Date.now()});
  saveState(); render(); toast('Poids enregistr\u00e9');
}
function confirmReset(){
  VIEW.modal = {type:'confirm-reset'};
  render();
}
function replaceState(newState){
  Object.keys(STATE).forEach(k=>delete STATE[k]);
  Object.assign(STATE, newState);
}
function doReset(){
  replaceState(defaultState());
  saveState();
  VIEW.modal = null;
  render();
  toast('Donn\u00e9es r\u00e9initialis\u00e9es');
}
function openExport(){ VIEW.modal={type:'export'}; render(); }
function openImport(){ VIEW.modal={type:'import'}; render(); }
function doImport(){
  const ta = document.getElementById('import-ta');
  try{
    const parsed = JSON.parse(ta.value);
    replaceState(Object.assign(defaultState(), parsed));
    saveState();
    VIEW.modal = null;
    render();
    toast('Donn\u00e9es import\u00e9es');
  }catch(e){
    toast('JSON invalide');
  }
}

    + '<div class="macro-preview">'
    + '<div class="m"><div class="v num">'+r0(tot.k)+'</div><div class="l">kcal</div></div>'
    + '<div class="m"><div class="v num">'+round(tot.p)+'</div><div class="l">prot (g)</div></div>'
    + '<div class="m"><div class="v num">'+round(tot.c)+'</div><div class="l">gluc (g)</div></div>'

    + '<button class="btn small" onclick="scaleRecipeToTarget('+person.kcalTarget+')">Objectif ('+person.kcalTarget+')</button>'

    + '</div><input type="number" placeholder="Ou viser X kcal pr\u00e9cis\u00e9ment" style="margin-top:8px;" onchange="scaleRecipeToTarget(parseFloat(this.value)||0)"></div>'
    + personPillsField()

function scaleRecipeToTarget(targetKcal){
  const da = VIEW.detailAdjust;
  const base = computeRecipeMacros({ing: da.ing});
  if(base.k<=0 || !targetKcal || targetKcal<=0) return;
  da.servings = Math.max(0.25, round(targetKcal / base.k));
  render();
}

function saveRecipeDraft(){
  const d = VIEW.editorDraft;

  if(d.ing.length===0){ toast('Ajoute au moins un ingr\u00e9dient'); return; }
  if(d.id){
    const idx = STATE.customRecipes.findIndex(r=>r.id===d.id);
    if(idx>=0) STATE.customRecipes[idx] = {id:d.id, n:d.n, cat:d.cat, steps:d.steps||'', t:d.t||10, ing:d.ing};
  } else if(d.baseId){

  } else {
    const slug = 'custom-'+d.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Date.now().toString(36);

function modalExport(){

  return '<div class="sheet-header"><h2 style="font-size:16px;">Exporter</h2><button class="back" onclick="closeModal()">Fermer</button></div>'

    + '<textarea readonly style="width:100%; height:220px; background:var(--surface); border:1px solid var(--line); border-radius:2px; color:var(--text); padding:12px; font-family:var(--mono); font-size:11px;" onclick="this.select()">'+esc(json)+'</textarea>'

function copyExport(){
  const ta = document.querySelector('#modal-root textarea');
  ta.select();
  try{ document.execCommand('copy'); toast('Copi\u00e9'); }
  catch(e){
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast('Copi\u00e9')).catch(()=>toast('Copie manuelle n\u00e9cessaire'));
  }
}

function openRoulette(){ VIEW.modal={type:'roulette', cat:'all', budgetOnly:false, result:null}; render(); }
function roulettePool(m){
  let pool = allRecipes();
  if(m.cat!=='all') pool = pool.filter(r=>r.cat===m.cat);
  if(m.budgetOnly){
    const remaining = Math.max(0, activePerson().kcalTarget - totalsForDate(VIEW.currentDate).k);
    pool = pool.filter(r=>computeRecipeMacros(r).k <= remaining + 80);
  }
  return pool;
}
function setRouletteCat(cat){ VIEW.modal.cat=cat; VIEW.modal.result=null; render(); }
function toggleRouletteBudget(){ VIEW.modal.budgetOnly=!VIEW.modal.budgetOnly; VIEW.modal.result=null; render(); }
function modalRoulette(m){
  const pool = roulettePool(m);
  const chips = CATS.map(([id,label])=>'<button class="chip '+(m.cat===id?'active':'')+'" onclick="setRouletteCat(\''+id+'\')">'+label+'</button>').join('');
  const display = m.result ? m.result.n : (pool.length ? 'Pr\u00eat \u00e0 tourner\u00a0?' : 'Aucune recette dans ce filtre');
  const resultActions = m.result
    ? '<div style="text-align:center; color:var(--text-dim); font-size:13px; margin:-6px 0 16px;">'+r0(computeRecipeMacros(m.result).k)+' kcal \u00b7 '+(m.result.t||'?')+' min</div>'
      + '<div class="fab-row"><button class="btn" onclick="spinRoulette()">Relancer</button><button class="btn primary" onclick="closeModal(); openRecipeDetail(\''+m.result.id+'\')">Voir la recette</button></div>'
    : '<button id="roulette-spin-btn" class="btn primary full" onclick="spinRoulette()" '+(pool.length?'':'disabled')+'>Lancer la roulette</button>';

  return '<div class="sheet-header"><h2 style="font-size:16px;">Roulette</h2><button class="back" onclick="closeModal()">Fermer</button></div>'
    + '<div class="chiprow">'+chips+'</div>'
    + '<label style="display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-dim); margin:10px 0 4px; cursor:pointer;"><input type="checkbox" '+(m.budgetOnly?'checked':'')+' onchange="toggleRouletteBudget()"> Seulement ce qui tient dans mon budget restant</label>'
    + '<div class="roulette-wheel" id="roulette-display">'+esc(display)+'</div>'
    + resultActions;
}
function spinRoulette(){
  const m = VIEW.modal;
  const pool = roulettePool(m);
  if(pool.length===0){ toast('Aucune recette ne correspond \u00e0 ce filtre'); return; }
  const el = document.getElementById('roulette-display');
  const btn = document.getElementById('roulette-spin-btn');
  if(btn) btn.disabled = true;
  let i=0; const total = 16 + Math.floor(Math.random()*8);
  const iv = setInterval(()=>{
    const r = pool[Math.floor(Math.random()*pool.length)];
    if(el) el.textContent = r.n;
    i++;
    if(i>=total){
      clearInterval(iv);
      m.result = pool[Math.floor(Math.random()*pool.length)];
      render();
    }
  }, 80);
}
